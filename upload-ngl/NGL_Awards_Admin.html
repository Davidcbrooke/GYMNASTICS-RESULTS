<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NGL Awards Admin</title>
<style>
  :root{--navy:#0a1440;--navy-3:#152463;--line:rgba(255,255,255,.14);--muted:#b7c1e6;--schools:#f5d12f;--rec:#E88230;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{background:var(--navy);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;}
  header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);}
  header h1{font-size:18px;margin:0 8px 0 0;}
  .tab{border:2px solid var(--c);background:transparent;color:#fff;font-weight:800;font-size:15px;padding:10px 18px;border-radius:999px;cursor:pointer;}
  .tab[aria-pressed="true"]{background:var(--c);color:#0a1440;}
  .note{margin-left:auto;color:var(--muted);font-size:12.5px;max-width:420px;}
  .note a{color:var(--muted);}
  main{flex:1;position:relative;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--navy);display:none;}
  iframe.on{display:block;}
</style>
</head>
<body>
<header>
  <h1>Awards licences</h1>
  <button class="tab" style="--c:var(--schools)" data-k="schools" aria-pressed="false">NGL Schools</button>
  <button class="tab" style="--c:var(--rec)" data-k="rec" aria-pressed="false">NGL Recreational</button>
  <p class="note">Orders, invoices, clubs and licences. Sign in once in each tab with your NGL admin login. <a id="open" href="#" target="_blank" rel="noopener">Open in a new window</a></p>
</header>
<main>
  <iframe id="f-schools" title="NGL Schools admin" data-src="https://nglschools.co.uk/club/?admin=1"></iframe>
  <iframe id="f-rec" title="NGL Recreational admin" data-src="https://nglrecreational.co.uk/?admin=1"></iframe>
</main>
<script>
  const tabs = document.querySelectorAll('.tab');
  function pick(k){
    tabs.forEach(t => t.setAttribute('aria-pressed', String(t.dataset.k === k)));
    document.querySelectorAll('iframe').forEach(f => {
      const on = f.id === 'f-' + k;
      if(on && !f.src) f.src = f.dataset.src;
      f.classList.toggle('on', on);
      if(on) document.getElementById('open').href = f.dataset.src;
    });
    try{ localStorage.setItem('ngl-awards-admin-tab', k); }catch(e){}
  }
  tabs.forEach(t => t.addEventListener('click', () => pick(t.dataset.k)));
  let start = new URLSearchParams(location.search).get('tab');
  if(!start){ try{ start = localStorage.getItem('ngl-awards-admin-tab'); }catch(e){} }
  pick(start === 'schools' ? 'schools' : 'rec');
</script>
</body>
</html>
