<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1440">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NGL Schools">
<title>NGL Schools Hub</title>
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --red:#d0021b; --gold:#f2a900; --schools:#f5d12f;
    --bronze:#c98a4b; --silver:#c9d1dc;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy); color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100vh; min-height:100dvh;
  }
  button{font:inherit;color:inherit;}
  a{color:var(--schools);}
  .app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{
    position:sticky;top:0;z-index:20;
    padding:calc(12px + var(--safe-t)) 16px 12px;
    background:rgba(10,20,64,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:10px;min-height:56px;
  }
  .back{
    width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--navy-3);
    display:grid;place-items:center;cursor:pointer;flex:0 0 auto;
  }
  .back[hidden]{display:none;}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip{
    margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:800;letter-spacing:.04em;
    padding:6px 10px;border-radius:999px;background:var(--schools);color:var(--navy);
  }

  main{flex:1;padding:18px 16px calc(96px + var(--safe-b));}
  .screen{animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ---------- Bottom nav ---------- */
  .tabbar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(13,26,79,0.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));
  }
  .tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);}
  .tab{
    background:none;border:0;cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;
  }
  .tab svg{width:24px;height:24px;}
  .tab.active{color:var(--schools);}
  .tabbar[hidden]{display:none;}

  /* ---------- Common ---------- */
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 8px;}
  h1{font-size:26px;line-height:1.15;margin:0 0 8px;font-weight:900;letter-spacing:-.01em;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;}
  h3{font-size:16px;margin:0 0 4px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;}
  .section-title h2{font-size:17px;margin:0;}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
    padding:15px 18px;border-radius:14px;border:0;cursor:pointer;
    background:var(--schools);color:var(--navy);font-weight:900;font-size:16px;text-decoration:none;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);font-weight:700;}
  .btn[disabled]{opacity:.6;cursor:default;}

  /* ---------- Sign-in ---------- */
  .signin{display:flex;flex-direction:column;justify-content:center;min-height:calc(100dvh - 120px);}
  .signin .hero{text-align:center;margin-bottom:22px;}
  .signin .hero img{width:150px;height:auto;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.45);margin-bottom:18px;transform:rotate(-3deg);}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;}
  .licence-input{
    width:100%;padding:16px;border-radius:14px;border:2px solid var(--line);background:var(--navy-2);
    color:var(--white);font-size:22px;font-weight:800;letter-spacing:.12em;text-align:center;text-transform:uppercase;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;outline:none;
  }
  .licence-input:focus{border-color:var(--schools);}
  .licence-input::placeholder{color:rgba(183,193,230,.45);}
  .hint{font-size:13px;color:var(--muted);margin:10px 2px 16px;text-align:center;}
  .error{color:#ff8a95;font-size:14px;font-weight:700;text-align:center;margin:0 0 12px;min-height:1em;}
  .demo-banner{
    font-size:12px;text-align:center;color:var(--navy);background:var(--gold);border-radius:10px;padding:8px 10px;margin:0 0 14px;font-weight:700;
  }

  /* ---------- Home ---------- */
  .welcome{
    background:linear-gradient(135deg,var(--navy-4),var(--navy-3));
    border:1px solid var(--line);border-radius:20px;padding:20px;margin-bottom:6px;position:relative;overflow:hidden;
  }
  .welcome::after{
    content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;
    background:radial-gradient(circle,rgba(245,209,47,.35),transparent 70%);
  }
  .welcome .num{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:800;letter-spacing:.08em;color:var(--schools);font-size:15px;}
  .welcome .club{font-size:14px;color:var(--muted);margin-top:4px;}
  .journey{display:flex;gap:6px;margin-top:14px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;}
  .journey::-webkit-scrollbar{display:none;}
  .jstep{
    flex:0 0 auto;font-size:11px;font-weight:800;padding:5px 9px;border-radius:999px;
    border:1px solid var(--line);color:var(--muted);white-space:nowrap;
  }
  .jstep.on{background:var(--schools);border-color:var(--schools);color:var(--navy);}

  .level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
  .level-card{
    background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:14px 12px 12px;
    cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .12s ease,border-color .18s ease;
  }
  .level-card:active{transform:scale(.97);}
  .level-card:hover{border-color:rgba(245,209,47,.6);}
  .level-card img{width:78px;height:78px;object-fit:cover;border-radius:50%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
  .level-card .lname{font-weight:900;font-size:17px;}
  .level-card .lmeta{font-size:12px;color:var(--muted);}

  .link-card{display:flex;align-items:center;gap:14px;cursor:pointer;}
  .link-card .ico{
    width:46px;height:46px;border-radius:14px;flex:0 0 auto;display:grid;place-items:center;
    background:rgba(245,209,47,.14);color:var(--schools);
  }
  .link-card .ico svg{width:24px;height:24px;}
  .link-card .txt{flex:1;min-width:0;}
  .link-card .txt p{margin:0;font-size:14px;color:var(--muted);}
  .chev{color:var(--muted);flex:0 0 auto;}

  /* ---------- Level screen ---------- */
  .level-head{display:flex;align-items:center;gap:14px;margin-bottom:16px;}
  .level-head img{width:72px;height:72px;object-fit:cover;border-radius:50%;flex:0 0 auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.4));}
  .seg{
    display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:14px;
    background:var(--navy-2);border:1px solid var(--line);margin-bottom:16px;position:sticky;top:64px;z-index:10;
  }
  .seg button{
    border:0;background:transparent;padding:11px 6px;border-radius:10px;cursor:pointer;
    font-weight:800;font-size:15px;color:var(--muted);
  }
  .seg button.active{background:var(--schools);color:var(--navy);}

  .video{
    position:relative;width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;
    margin-bottom:14px;cursor:pointer;border:1px solid var(--line);
  }
  .video img{width:100%;height:100%;object-fit:cover;display:block;opacity:.85;}
  .video .play{
    position:absolute;inset:0;display:grid;place-items:center;
  }
  .video .play span{
    width:68px;height:68px;border-radius:50%;background:var(--schools);display:grid;place-items:center;
    box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  .video .play svg{width:28px;height:28px;margin-left:4px;color:var(--navy);}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}

  .skills{list-style:none;margin:0;padding:0;counter-reset:s;}
  .skills li{
    counter-increment:s;display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);font-size:15px;
  }
  .skills li:first-child{border-top:0;}
  .skills li::before{
    content:counter(s);flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
    background:var(--navy-4);font-size:13px;font-weight:800;color:var(--schools);
  }
  .vault-part + .vault-part{margin-top:8px;}

  .level-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}

  /* ---------- Graduation ---------- */
  .awards-row{display:flex;gap:10px;margin:14px 0 4px;}
  .award{flex:1;text-align:center;padding:12px 6px;border-radius:14px;background:var(--navy-2);border:1px solid var(--line);}
  .award .dot{width:34px;height:34px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,.25);}
  .award b{font-size:14px;}
  .medal-strip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:10px;}
  .medal-strip img{width:46px;height:46px;object-fit:cover;border-radius:50%;}
  .event{border-left:4px solid var(--schools);}
  .event .when{font-size:14px;color:var(--muted);margin-bottom:8px;}
  .facts{list-style:none;padding:0;margin:10px 0 0;}
  .facts li{padding:6px 0;font-size:15px;display:flex;gap:10px;}
  .facts li::before{content:"✓";color:var(--schools);font-weight:900;}
  .empty{text-align:center;padding:26px 18px;}
  .empty svg{width:40px;height:40px;color:var(--muted);margin-bottom:8px;}

  .coming{font-size:12px;font-weight:800;color:var(--navy);background:var(--muted);border-radius:999px;padding:3px 9px;}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;}
  .foot button{background:none;border:0;color:var(--schools);text-decoration:underline;cursor:pointer;font-size:12px;padding:6px;}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="back" id="backBtn" hidden aria-label="Back">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">
      <span class="brand-top">National Gymnastics League</span>
      <span class="brand-title" id="topTitle">Schools Hub</span>
    </div>
    <span class="chip" id="topChip" hidden>SCHOOLS</span>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <div class="tabbar-inner">
      <button class="tab" data-go="#/home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
        Home
      </button>
      <button class="tab" data-go="#/routines">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor"/></svg>
        Routines
      </button>
      <button class="tab" data-go="#/graduation">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg>
        Graduation
      </button>
    </div>
  </nav>
</div>

<script>
/* =====================================================================
   NGL SCHOOLS HUB — parent/gymnast portal
   ---------------------------------------------------------------------
   DEMO MODE: while FIREBASE_CONFIG is null, any correctly formatted
   licence number (NGL-XXXX-XXXX) opens the Hub. Once the ngl-schools
   Firebase project exists, paste its config below and the Hub will
   check each number against the Firestore `licences` collection.
   ===================================================================== */
const FIREBASE_CONFIG = null;

/* ---------- Licence number format ----------
   8 characters from an alphabet with no look-alikes (no 0/O, 1/I/L),
   shown as NGL-XXXX-XXXX. Must match the generator in the club dashboard. */
const LICENCE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
const LICENCE_RE = new RegExp('^NGL-[' + LICENCE_ALPHABET + ']{4}-[' + LICENCE_ALPHABET + ']{4}$');
function normaliseLicence(raw){
  let s = String(raw || '').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.startsWith('NGL')) s = s.slice(3);
  s = s.slice(0,8);
  if(s.length <= 4) return s ? 'NGL-' + s : '';
  return 'NGL-' + s.slice(0,4) + '-' + s.slice(4);
}

const STORE_KEY = 'ngl-schools-licence';
let session = null;   // {number, clubName, schoolName, season}

function store(get, val){
  try{
    if(get) return JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
    if(val === null) localStorage.removeItem(STORE_KEY);
    else localStorage.setItem(STORE_KEY, JSON.stringify(val));
  }catch(e){ return null; }
}

/* ---------- Licence check ---------- */
let db = null;
async function initFirebase(){
  if(!FIREBASE_CONFIG || db) return;
  const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
  const fsMod  = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
  const app = appMod.initializeApp(FIREBASE_CONFIG);
  db = { mod: fsMod, fs: fsMod.getFirestore(app) };
}
async function checkLicence(number){
  if(!LICENCE_RE.test(number)) return {ok:false, reason:'That doesn’t look like an NGL licence number. It should look like NGL-7K4P-2M9Q.'};
  if(!FIREBASE_CONFIG){
    return {ok:true, data:{number, clubName:'Demo Club', schoolName:'Demo School', season:'2026/27'}};
  }
  try{
    await initFirebase();
    const snap = await db.mod.getDoc(db.mod.doc(db.fs, 'licences', number));
    if(!snap.exists()) return {ok:false, reason:'We couldn’t find that licence number. Please check it with your school or club.'};
    const d = snap.data();
    if(d.status !== 'active') return {ok:false, reason:'This licence isn’t active for the current season. Please ask your club to renew it.'};
    return {ok:true, data:{number, clubName:d.clubName||'', schoolName:d.schoolName||'', season:d.season||''}};
  }catch(e){
    return {ok:false, reason:'We couldn’t reach the Hub just now. Please check your connection and try again.'};
  }
}

/* ---------- Helpers ---------- */
const $view = document.getElementById('view');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setChrome({title='Schools Hub', back=false, tabs=true, active=''}){
  document.getElementById('topTitle').textContent = title;
  document.getElementById('backBtn').hidden = !back;
  document.getElementById('topChip').hidden = !session;
  document.getElementById('tabbar').hidden = !tabs;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.go === active));
}
function render(html){ $view.innerHTML = '<div class="screen">' + html + '</div>'; window.scrollTo(0,0); }
const chevron = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg>';

function videoHTML(id, label){
  return `<div class="video" data-yt="${id}" role="button" tabindex="0" aria-label="Play ${esc(label)} video">
    <img src="https://i.ytimg.com/vi/${id}/hqdefault.jpg" alt="" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="play"><span><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l14 8-14 8z"/></svg></span></div>
  </div>`;
}
function skillsHTML(list){ return '<ol class="skills">' + list.map(s => `<li>${esc(s)}</li>`).join('') + '</ol>'; }

/* ---------- Screens ---------- */
function screenSignIn(prefill, error){
  setChrome({title:'Schools Hub', tabs:false});
  render(`
    <div class="signin">
      <div class="hero">
        <img src="data:image/jpeg;base64,${BOOK_COVER}" alt="NGL Schools Awards Book">
        <p class="eyebrow">Welcome to</p>
        <h1>Your NGL Schools Hub</h1>
        <p class="muted">Watch the routines your gymnast is learning at school and practise them together at home.</p>
      </div>
      ${FIREBASE_CONFIG ? '' : '<div class="demo-banner">Preview mode: any number in the right format will open the Hub</div>'}
      <form id="signinForm" class="field" autocomplete="off">
        <label for="lic">Enter your NGL licence number</label>
        <input id="lic" class="licence-input" inputmode="text" autocapitalize="characters" spellcheck="false"
               placeholder="NGL-XXXX-XXXX" maxlength="13" value="${esc(prefill||'')}">
        <p class="hint">You’ll find it on the licence slip from your school or club.</p>
        <p class="error" id="err">${esc(error||'')}</p>
        <button class="btn" id="goBtn" type="submit">Open my Hub</button>
      </form>
    </div>
  `);
  const input = document.getElementById('lic');
  input.addEventListener('input', () => {
    input.value = normaliseLicence(input.value);
    document.getElementById('err').textContent = '';
  });
  document.getElementById('signinForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = document.getElementById('goBtn');
    btn.disabled = true; btn.textContent = 'Checking…';
    const number = normaliseLicence(input.value);
    const res = await checkLicence(number);
    if(res.ok){
      session = res.data; store(false, session);
      location.hash = '#/home'; route();
    }else{
      btn.disabled = false; btn.textContent = 'Open my Hub';
      document.getElementById('err').textContent = res.reason;
    }
  });
}

function screenHome(){
  setChrome({title:'Schools Hub', active:'#/home'});
  const where = [session.schoolName, session.clubName].filter(Boolean).map(esc).join(' · ');
  render(`
    <div class="welcome">
      <p class="eyebrow">Welcome to your NGL journey</p>
      <div class="num">${esc(session.number)}</div>
      ${where ? `<div class="club">${where}</div>` : ''}
      <div class="journey" aria-label="NGL pathways">
        <span class="jstep">Pre-School</span><span class="jstep on">Schools</span><span class="jstep">Recreational</span>
        <span class="jstep">General</span><span class="jstep">Performance</span><span class="jstep">University</span><span class="jstep">Masters</span>
      </div>
    </div>

    <div class="section-title"><h2>Learn the routines</h2><span class="muted" style="font-size:13px">Levels 1–6</span></div>
    ${levelGridHTML()}

    <div class="section-title"><h2>Celebrate</h2></div>
    <div class="card link-card" data-go="#/graduation">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="9" r="6"/><path d="M8.5 14L7 22l5-3 5 3-1.5-8"/></svg></div>
      <div class="txt"><h3>NGL Graduation</h3><p>Bronze, Silver, Gold, then perform for your family</p></div>
      ${chevron}
    </div>
    <div class="card link-card" style="cursor:default">
      <div class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V10M12 20V4M18 20v-7"/></svg></div>
      <div class="txt"><h3>Core Skills &amp; Strength</h3><p>Master classes and conditioning videos</p></div>
      <span class="coming">Soon</span>
    </div>
    ${footHTML()}
  `);
}

function levelGridHTML(){
  let h = '<div class="level-grid">';
  for(let l=1; l<=6; l++){
    h += `<div class="level-card" data-go="#/level/${l}/floor" role="button" tabindex="0">
      <img src="data:image/jpeg;base64,${MEDALS[l-1]}" alt="">
      <span class="lname">Level ${l}</span>
      <span class="lmeta">Floor · Bench · Vault</span>
    </div>`;
  }
  return h + '</div>';
}

function screenRoutines(){
  setChrome({title:'Routines', active:'#/routines'});
  render(`
    <p class="eyebrow">Learn the routines</p>
    <h1>Pick your level</h1>
    <p class="muted">Each level has a Floor, Bench and Vault routine, just like in your Awards Book.</p>
    <div style="height:8px"></div>
    ${levelGridHTML()}
    ${footHTML()}
  `);
}

function screenLevel(level, app){
  const i = level - 1;
  setChrome({title:'Level ' + level, back:true, active:'#/routines'});
  let body = '';
  if(app === 'floor'){
    body = `<div class="card">${videoHTML(LEVEL_VIDEOS.floor[i],'Floor')}<h3>Floor routine</h3><p class="muted" style="font-size:14px">Skills in routine order</p>${skillsHTML(FLOOR_SKILLS[i])}</div>`;
  }else if(app === 'bench'){
    body = `<div class="card">${videoHTML(LEVEL_VIDEOS.bench[i],'Bench')}<h3>Bench routine</h3><p class="muted" style="font-size:14px">Skills in routine order. Also works on a low beam.</p>${skillsHTML(BENCH_SKILLS[i])}</div>`;
  }else{
    body = `
      <div class="card vault-part">${videoHTML(LEVEL_VIDEOS.block[i],'Block routine')}<h3>Block routine</h3><p>${esc(BLOCK_CAPTIONS[i])}</p></div>
      <div class="card vault-part">${videoHTML(LEVEL_VIDEOS.spring[i],'Block and springboard')}<h3>Block &amp; springboard</h3><p>${esc(SPRING_CAPTIONS[i])}</p></div>`;
  }
  const prev = level > 1 ? `<button class="btn ghost" data-go="#/level/${level-1}/${app}">‹ Level ${level-1}</button>` : '<span></span>';
  const next = level < 6 ? `<button class="btn ghost" data-go="#/level/${level+1}/${app}">Level ${level+1} ›</button>` : '<span></span>';
  render(`
    <div class="level-head">
      <img src="data:image/jpeg;base64,${MEDALS[i]}" alt="Level ${level} medal">
      <div><p class="eyebrow" style="margin:0 0 2px">NGL Schools</p><h1 style="margin:0">Level ${level}</h1></div>
    </div>
    <div class="seg" role="tablist">
      ${APPARATUS.map(a => `<button role="tab" data-go="#/level/${level}/${a.id}" class="${a.id===app?'active':''}" aria-selected="${a.id===app}">${a.name}</button>`).join('')}
    </div>
    ${body}
    <div class="level-nav">${prev}${next}</div>
  `);
}

function screenGraduation(){
  setChrome({title:'Graduation', active:'#/graduation'});
  render(`
    <p class="eyebrow">Finish the year with something special</p>
    <h1>NGL Graduation</h1>
    <p class="muted">Work through your level, collect all three certificates, then perform your routines live for your family.</p>

    <div class="card">
      <h3>Your certificates</h3>
      <p class="muted" style="font-size:14px">Awarded by your coach and recorded in your Awards Book.</p>
      <div class="awards-row">
        <div class="award"><div class="dot" style="background:var(--bronze)"></div><b>Bronze</b></div>
        <div class="award"><div class="dot" style="background:var(--silver)"></div><b>Silver</b></div>
        <div class="award"><div class="dot" style="background:var(--gold)"></div><b>Gold</b></div>
      </div>
    </div>

    <div class="card">
      <h3>The Graduation Performance</h3>
      <ul class="facts">
        <li>Perform your routines in front of your family</li>
        <li>Held at your local British Gymnastics club where available, or at your school</li>
        <li>Family spectators go free</li>
        <li>Every graduate receives an exclusive NGL Schools Medal</li>
      </ul>
      <div class="medal-strip">${MEDALS.map((m,i)=>`<img src="data:image/jpeg;base64,${m}" alt="Level ${i+1} medal">`).join('')}</div>
    </div>

    <div class="section-title"><h2>Upcoming Graduations</h2></div>
    <div id="events">${eventsHTML([])}</div>
    ${footHTML()}
  `);
  loadEvents();
}

function eventsHTML(list){
  if(!list.length){
    return `<div class="card empty">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
      <h3>No dates published yet</h3>
      <p class="muted" style="margin:0">When your club announces a Graduation, the details will appear here.</p>
    </div>`;
  }
  return list.map(ev => `<div class="card event">
    <h3>${esc(ev.title||'NGL Schools Graduation')}</h3>
    <div class="when">${esc(ev.dateText||'')}${ev.venue ? ' · ' + esc(ev.venue) : ''}</div>
    <ul class="facts">
      ${ev.price ? `<li>${esc(ev.price)} per gymnast</li>` : ''}
      <li>Family spectators FREE</li>
      <li>NGL Graduation Medal included</li>
    </ul>
    ${ev.bookingUrl ? `<a class="btn" style="margin-top:12px" href="${esc(ev.bookingUrl)}" target="_blank" rel="noopener">Book a place</a>` : ''}
  </div>`).join('');
}

async function loadEvents(){
  if(!FIREBASE_CONFIG || !session) return;
  // Phase 1: events published by the gymnast's club (collection `events`, field clubId).
  // Wired up once the club dashboard creates events.
}

function footHTML(){
  return `<div class="foot">Licence ${esc(session.number)}${session.season ? ' · ' + esc(session.season) : ''}<br>
    <button data-action="signout">Use a different licence number</button></div>`;
}

/* ---------- Router ---------- */
function route(){
  const h = location.hash || '';
  const qp = new URLSearchParams(location.search);
  if(!session){
    const fromQR = qp.get('l') || qp.get('licence');
    return screenSignIn(fromQR ? normaliseLicence(fromQR) : '');
  }
  let m;
  if((m = h.match(/^#\/level\/([1-6])\/(floor|bench|vault)$/))) return screenLevel(+m[1], m[2]);
  if(h === '#/routines') return screenRoutines();
  if(h === '#/graduation') return screenGraduation();
  return screenHome();
}

document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]');
  if(go){ location.hash = go.dataset.go; return; }
  const v = e.target.closest('.video[data-yt]');
  if(v && !v.querySelector('iframe')){
    const id = v.dataset.yt;
    v.innerHTML = `<iframe src="https://www.youtube-nocookie.com/embed/${id}?autoplay=1&rel=0&modestbranding=1&playsinline=1"
      title="Routine video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>`;
    return;
  }
  if(e.target.closest('[data-action="signout"]')){
    session = null; store(false, null); location.hash = ''; route();
  }
});
document.addEventListener('keydown', e => {
  if((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"]')){ e.preventDefault(); e.target.click(); }
});
document.getElementById('backBtn').addEventListener('click', () => {
  if(history.length > 1) history.back(); else location.hash = '#/routines';
});
window.addEventListener('hashchange', route);

/* ---------- Start ---------- */
(async function start(){
  const saved = store(true);
  const qp = new URLSearchParams(location.search);
  const fromQR = qp.get('l') || qp.get('licence');
  if(saved && (!fromQR || normaliseLicence(fromQR) === saved.number)){
    session = saved;
    // Re-check quietly so expired licences stop working next season.
    if(FIREBASE_CONFIG){
      checkLicence(saved.number).then(r => { if(!r.ok){ session = null; store(false,null); screenSignIn(saved.number, r.reason); } });
    }
  }
  route();
})();
</script>
</body>
</html>
