<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGL Club Account</title>
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --red:#d0021b; --gold:#f2a900; --ok:#5fd38d; --warn:#ffb454; --bad:#ff8a95;
    --c-preschool:#ef2891; --c-schools:#f5d12f; --c-recreational:#ea732c; --c-general:#0f6bac;
    --c-performance:#38bcb9; --c-university:#59ac29; --c-masters:#851a6c;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,select{font:inherit;color:inherit;}
  a{color:var(--gold);}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px;}
  .topbar{position:sticky;top:0;z-index:30;background:rgba(10,20,64,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px;}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  @media(max-width:600px){.brand-top{display:none;}}
  .navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--navy-3);font-weight:700;font-size:14px;cursor:pointer;}
  .navtab.active{background:var(--gold);border-color:var(--gold);color:var(--navy);}
  main{padding:20px 0 60px;}
  .screen{animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  h1{font-size:clamp(26px,5vw,40px);line-height:1.1;margin:0 0 10px;font-weight:900;letter-spacing:-.015em;}
  h2{font-size:21px;margin:0 0 10px;font-weight:850;}
  h3{font-size:16px;margin:0 0 6px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:0 0 8px;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--gold);color:var(--navy);font-weight:900;font-size:15px;text-decoration:none;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);font-weight:700;}
  .btn.danger{background:transparent;color:var(--bad);border:1px solid rgba(255,138,149,.5);font-weight:700;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.5;cursor:not-allowed;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  .input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--white);font-size:16px;outline:none;}
  .input:focus{border-color:var(--gold);}
  .error{color:var(--bad);font-weight:700;font-size:14px;min-height:1em;margin:0 0 10px;}
  .note{font-size:13px;color:var(--muted);line-height:1.5;}
  .auth{max-width:460px;margin:10px auto 0;}
  .demo-banner{font-size:13px;color:var(--navy);background:var(--gold);border-radius:10px;padding:10px 12px;margin:0 0 16px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .demo-banner input{background:#fff;color:var(--navy);border:0;border-radius:8px;padding:4px 8px;font-weight:700;}
  .demo-banner label{display:flex;gap:6px;align-items:center;}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .kpi .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .window-strip{display:flex;gap:10px;align-items:center;border-radius:12px;padding:12px 14px;margin:14px 0 0;font-size:14px;line-height:1.45;}
  .window-strip.open{background:rgba(95,211,141,.12);border:1px solid rgba(95,211,141,.4);}
  .window-strip.closed{background:var(--navy-2);border:1px solid var(--line);}
  .paths{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:700px){.paths{grid-template-columns:1fr 1fr;}}
  @media(min-width:1000px){.paths{grid-template-columns:1fr 1fr 1fr;}}
  .path{background:var(--navy-3);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .path .stripe{height:6px;background:var(--pc);}
  .path .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .path .head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .path .name{font-weight:850;font-size:17px;}
  .path .figs{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .path .fig{background:var(--navy-2);border-radius:10px;padding:10px;}
  .path .fig .v{font-weight:900;font-size:18px;font-variant-numeric:tabular-nums;}
  .path .fig .l{font-size:11.5px;color:var(--muted);font-weight:700;}
  .path .actions{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap;}
  .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.ok{background:rgba(95,211,141,.18);color:var(--ok);}
  .tag.wait{background:rgba(255,180,84,.18);color:var(--warn);}
  .tag.bad{background:rgba(255,138,149,.16);color:var(--bad);}
  .tag.none{background:rgba(255,255,255,.08);color:var(--muted);}
  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:14px;}
  th{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-wrap{overflow-x:auto;}
  .modal-bg{position:fixed;inset:0;background:rgba(3,8,30,.72);z-index:50;display:grid;place-items:center;padding:16px;}
  .modal{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto;}
  .sum{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;}
  .sum span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .sum.total{font-weight:900;font-size:17px;border-bottom:0;}
  .stepper{display:flex;align-items:center;gap:8px;}
  .stepper .input{text-align:center;font-size:22px;font-weight:900;max-width:140px;}
  .stepper button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--navy-2);font-size:22px;font-weight:900;cursor:pointer;}
  .stepper button[disabled]{opacity:.35;cursor:not-allowed;}
  .lock{display:flex;gap:10px;align-items:flex-start;background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0;font-size:14px;line-height:1.45;}
  .lock b{color:var(--warn);}
  .win-row{display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:8px;align-items:end;margin-bottom:8px;}
  @media(max-width:640px){.win-row{grid-template-columns:1fr 1fr;}.win-row .lbl{grid-column:1 / -1;}}
  .win-row .input{padding:9px 10px;font-size:14px;}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:var(--navy);font-weight:800;padding:12px 18px;border-radius:12px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.4);}
  .toast.err{background:var(--bad);}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:40px;}
  .incl{list-style:none;padding:0;margin:0;font-size:13.5px;line-height:1.4;}
  .incl li{position:relative;padding:3px 0 3px 22px;}
  .incl li::before{content:"✓";position:absolute;left:2px;top:3px;color:var(--pc, var(--gold));font-weight:900;}
  .path details{border-top:1px solid var(--line);padding-top:8px;}
  .path summary{cursor:pointer;font-size:13px;font-weight:800;color:var(--muted);}
  .path summary:hover{color:var(--white);}
  .feebox{background:var(--navy-2);border:1px solid rgba(242,169,0,.4);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;}
  .feebox s{color:var(--muted);margin-right:6px;}
  .feebox b.price{font-size:16px;}
  .found{display:inline-block;font-size:11px;font-weight:800;padding:2px 8px;border-radius:999px;background:var(--gold);color:var(--navy);margin-left:6px;vertical-align:middle;}
  .shop-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);}
  .shop-row .input{max-width:110px;text-align:center;padding:8px;}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--pc);margin-right:8px;vertical-align:middle;}
</style>
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <div class="brand">
      <span class="brand-top">National Gymnastics League</span>
      <span class="brand-title" id="brandTitle">NGL Club Account</span>
    </div>
    <div class="top-actions" id="topActions"></div>
  </div>
  <div class="wrap"><nav class="navtabs" id="navtabs" hidden></nav></div>
</header>
<main><div class="wrap" id="view"></div></main>

<script type="module">
/* =====================================================================
   NGL CLUB ACCOUNT
   One account per club, one licence per pathway.
   ---------------------------------------------------------------------
   PREVIEW MODE: while FIREBASE_CONFIG is null the page runs on demo data
   held in memory (nothing is saved, no payments). Paste the ngl-accounts
   Firebase config below to switch to Firebase Auth + Firestore + the
   Cloud Functions in /functions (which talk to Stripe).
   ===================================================================== */
const FIREBASE_CONFIG = null;
const FUNCTIONS_REGION = 'europe-west2';
const SDK = 'https://www.gstatic.com/firebasejs/10.12.0/';
const CONTACT_EMAIL = 'admin@nationalgymnasticsleague.co.uk';

/* Pathway areas: where each pathway's own hub lives once licensed */
const PATHWAYS = [
  {id:'preschool',    name:'Pre-School',         color:'var(--c-preschool)',    area:null},
  {id:'schools',      name:'Schools',            color:'var(--c-schools)',      area:'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/ngl-schools-club.html'},
  {id:'recreational', name:'Recreational',       color:'var(--c-recreational)', area:null},
  {id:'general',      name:'General League',     color:'var(--c-general)',      area:null},
  {id:'performance',  name:'Performance League', color:'var(--c-performance)',  area:null},
  {id:'university',   name:'University League',  color:'var(--c-university)',  area:null},
  {id:'masters',      name:'Masters',            color:'var(--c-masters)',      area:null}
];
const MAX_GYMNASTS = 5000;

/* What each licence includes, per gymnast. Shown on the pathway cards and when starting a licence. */
const INCLUDES = {
  preschool: [
    'Passport to collect 10 country medals',
    'A country medal every 4 weeks, sent with each term\'s bill',
    'Exclusive use of the NGL Somi & Flic characters'
  ],
  schools: [
    '6-level Awards Book, lasting 6 years',
    '3 certificates per gymnast per year',
    'Access to the Schools Hub app',
    'Tuition videos',
    'Access to the Graduation Ceremony'
  ],
  recreational: [
    '3-level Awards Book (lasts 1 year, 1 level per term)',
    'A medal each term for the level passed, sent with each term\'s bill',
    '4 attendance certificates',
    'Recreational Hub: routine, masterclass and conditioning videos'
  ],
  general: [ 'Gymnast Progress Book, Levels 1–4' ],
  performance: [ 'Gymnast Routine Book, Levels 1–6' ]
};
/* What the yearly Club Licence covers (pathways with one) */
const CLUB_FEE_VALUE = {
  preschool: '10 themes: themed training plans and ready-made social media posts. Extra themes £25 each.',
  recreational: 'A full year of weekly coaching plans, aligned to NGL competitions and illustrated throughout. Months of work for a club to write itself.'
};
const includesList = id => INCLUDES[id] ? `<ul class="incl">${INCLUDES[id].map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '';

/* ---------- Prices and terms (display copy of functions/licensing.js, which is enforced) ---------- */
const MAX_SPARE_PCT = 0.25;
const DEFAULT_PRICING = {
  preschool: {termPence:400, bookPence:500, rrpPence:1000, bookName:'Passport',
    clubFee:{bands:[{max:null, fullPence:40000, foundingPence:20000}]},
    medal:{pricePence:200, rrpPence:400, fromCalendar:true},
    themes:{included:10, extraPence:2500}},
  schools: {termPence:400, bookPence:500, rrpPence:1000},
  recreational: {termPence:400, bookPence:500, rrpPence:1000,
    clubFee:{bands:[{max:199, fullPence:100000, foundingPence:50000}, {max:499, fullPence:150000, foundingPence:100000}, {max:null, fullPence:200000, foundingPence:150000}]},
    medal:{pricePence:250, rrpPence:500, perTerm:1}},
  general: {termPence:400, bookPence:500, rrpPence:1000},
  performance: {termPence:400, bookPence:500, rrpPence:1000}
};
const DEFAULT_FOUNDING_UNTIL = '2027-08-31';
const DEFAULT_TERMS = [
  {id:'2026-aut', label:'Autumn 2026', start:'2026-09-01', end:'2026-12-18', regOpens:'2026-07-20', countries:['France','Japan','Brazil','Kenya']},
  {id:'2027-spr', label:'Spring 2027', start:'2027-01-04', end:'2027-03-26', regOpens:'2026-12-01', countries:['Australia','Canada','India']},
  {id:'2027-sum', label:'Summer 2027', start:'2027-04-12', end:'2027-07-21', regOpens:'2027-03-15', countries:['Egypt','Mexico','Norway']},
  {id:'2027-aut', label:'Autumn 2027', start:'2027-09-01', end:'2027-12-17', regOpens:'2027-07-19', countries:['France','Japan','Brazil','Kenya']}
];
function pricingFor(settings, id){
  const p = {...(DEFAULT_PRICING[id] || {}), ...(((settings || {}).pathways || {})[id] || {})};
  return Number.isInteger(p.termPence) && p.termPence > 0 && Number.isInteger(p.bookPence) && p.bookPence >= 0 ? p : null;
}
const ukDate = (d = now()) => new Intl.DateTimeFormat('en-CA', {timeZone:'Europe/London'}).format(d);
const givesAccess = s => s === 'active' || s === 'past_due';
const termsFrom = settings => [...(((settings || {}).terms || []).length ? settings.terms : DEFAULT_TERMS)].sort((a, b) => a.start.localeCompare(b.start));
const termById = id => termsFrom(state.settings).find(t => t.id === id) || null;
function currentTerm(){ const d = ukDate(); let cur = null; termsFrom(state.settings).forEach(t => { if(t.start <= d) cur = t; }); return cur; }
function nextTerm(){ const d = ukDate(); return termsFrom(state.settings).find(t => t.start > d) || null; }
const registrationOpen = t => !!t && ukDate() >= t.regOpens && ukDate() < t.start;
/* the term a new licence is billed for: next term while its registration is open, otherwise the current one */
const billingTerm = () => { const n = nextTerm(); return n && registrationOpen(n) ? n : currentTerm(); };
const termIndex = t => { const m = +t.start.slice(5, 7); return m >= 8 ? 0 : m <= 2 ? 1 : 2; };
const yearEnd = t => { const y = +t.start.slice(0, 4), m = +t.start.slice(5, 7); return `${m >= 8 ? y + 1 : y}-08-31`; };
const foundingUntil = () => (state.settings && state.settings.foundingUntil) || DEFAULT_FOUNDING_UNTIL;
const foundingOpen = () => ukDate() <= foundingUntil();

function clubFeeFor(price, gymnasts, founding){
  const bands = price && price.clubFee && price.clubFee.bands;
  if(!Array.isArray(bands) || !bands.length) return null;
  const band = bands.find(b => b.max == null || gymnasts <= b.max) || bands[bands.length - 1];
  const i = bands.indexOf(band), lo = i === 0 ? 1 : bands[i - 1].max + 1;
  return {band: band.max == null ? `${lo}+ gymnasts` : `${lo}–${band.max} gymnasts`, fullPence:band.fullPence, foundingPence:band.foundingPence, pence: founding ? band.foundingPence : band.fullPence, founding};
}
function clubLicenceDue(price, term, gymnasts, {paidUntil = null, founding = false} = {}){
  const fee = clubFeeFor(price, gymnasts, founding);
  if(!fee || (paidUntil && paidUntil >= term.start)) return null;
  const idx = termIndex(term), firstYear = !paidUntil;
  let share = firstYear ? (3 - idx) / 3 : 1;
  if(firstYear && idx === 2 && state.settings.summerTaster === true) share = 0;
  const pence = share === 1 ? fee.pence : Math.round(fee.pence * share / 500) * 500;
  return {...fee, pence, share, until: yearEnd(term), taster: share === 0,
    label: share === 1 ? 'Club Licence, full year' : share === 0 ? 'Club Licence: summer taster, first payment in September' : `Club Licence, ${idx === 1 ? 'spring and summer' : 'summer'} (pro-rata)`};
}
function medalsPerTerm(price, term){
  if(!price || !price.medal) return 0;
  if(price.medal.fromCalendar) return term && term.countries ? term.countries.length : 0;
  return price.medal.perTerm || 0;
}
function termBill({price, pathway, term, gymnasts, books = 0, spares = 0, clubLicence = null}){
  if(!Number.isInteger(gymnasts) || gymnasts < 0 || gymnasts > MAX_GYMNASTS) return {error:`Enter between 0 and ${MAX_GYMNASTS} gymnasts.`};
  if(!Number.isInteger(books) || books < 0 || books > gymnasts) return {error:`Books must be between 0 and ${gymnasts}.`};
  const maxSpare = Math.ceil(gymnasts * MAX_SPARE_PCT);
  if(!Number.isInteger(spares) || spares < 0 || spares > maxSpare) return {error:`Spare medals must be between 0 and ${maxSpare}.`};
  const per = medalsPerTerm(price, term), bookName = price.bookName || 'Awards Book';
  const lines = [];
  if(clubLicence && clubLicence.pence > 0) lines.push({id:'club', name:`${clubLicence.label}${clubLicence.founding ? ' (founding club price)' : ''}`, qty:1, unitPence:clubLicence.pence});
  if(gymnasts) lines.push({id:'licence', name:`Gymnast Licence, ${term.label}`, qty:gymnasts, unitPence:price.termPence});
  if(gymnasts && per) lines.push({id:'medal', name: price.medal.fromCalendar ? `Country medals: ${term.countries.join(', ')}` : `Medals, ${term.label}`, qty:gymnasts * per, unitPence:price.medal.pricePence});
  if(spares && price.medal) lines.push({id:'spare', name:'Spare medals', qty:spares, unitPence:price.medal.pricePence});
  if(books) lines.push({id:'book', name:`${bookName}s`, qty:books, unitPence:price.bookPence});
  const live = lines.filter(l => l.qty > 0 && l.unitPence > 0);
  return {lines: live, totalPence: live.reduce((a, l) => a + l.qty * l.unitPence, 0), per};
}
const billHTML = bill => bill.lines.map(l => `<div class="sum"><span>${esc(l.name)}${l.qty > 1 || l.id !== 'club' ? ` <span class="muted">${n0(l.qty)} × ${gbp(l.unitPence)}</span>` : ''}</span><span>${gbp(l.qty * l.unitPence)}</span></div>`).join('') +
  `<div class="sum total"><span>Total</span><span>${gbp(bill.totalPence)}</span></div>`;

/* ---------- Formatting ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gbp = p => '£' + (p / 100).toLocaleString('en-GB', {minimumFractionDigits: p % 100 ? 2 : 0, maximumFractionDigits: 2});
const n0 = n => Number(n || 0).toLocaleString('en-GB');
const fmtDate = iso => iso ? new Date(iso + 'T12:00:00Z').toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '';
const pathwayById = id => PATHWAYS.find(p => p.id === id);

/* =====================================================================
   DEMO DATA LAYER
   ===================================================================== */
let demoToday = null;   // demo can pretend today is another date, to try registration windows
function now(){ return demoToday ? new Date(demoToday + 'T12:00:00Z') : new Date(); }

const demo = {
  settings: { pathways: {}, season: '2026/27', terms: DEFAULT_TERMS, summerTaster: false, foundingUntil: DEFAULT_FOUNDING_UNTIL },
  club: null, licences: {}, regs: {}, isAdmin: false,
  others: [   // other clubs, for the admin overview
    {club:'Elite Gymnastics', bg:'BG-2231', pathway:'schools',      status:'active',   gymnasts:140},
    {club:'Salto Gymnastics', bg:'BG-4410', pathway:'recreational', status:'past_due', gymnasts:62},
    {club:'React Gymnastics', bg:'BG-3108', pathway:'preschool',    status:'lapsed',   gymnasts:15},
    {club:'NBC Gymnastics',   bg:'BG-1987', pathway:'general',      status:'active',   gymnasts:48}
  ],
  sample(){
    this.club = {name:'SAADI Gymnastics', bgNumber:'BG-1234', contactName:'Dave Brooke', email:'bookingoffice@saadigymnastics.co.uk', accessCode:'SAADI-7K4P', defaultPaymentMethod:true};
    this.licences = {
      recreational: {status:'active', gymnasts:45, currentTermId:'2026-aut', clubLicence:{paidUntil:'2027-08-31', lastPaidPence:50000}, foundingClub:true}
    };
    this.regs = { recreational: { '2026-aut': {gymnasts:45, totalPence:50000 + 45 * 400 + 45 * 250 + 45 * 500, status:'paid'} } };
  }
};
const demoApi = {
  live: false,
  async signIn(email){ demo.sample(); demo.isAdmin = /saadi|nationalgymnasticsleague/i.test(email); return {ok:true}; },
  async register(d){
    demo.club = {name:d.name, bgNumber:d.bgNumber.toUpperCase(), contactName:d.contactName, email:d.email, accessCode:'NEW-2H8K'};
    demo.licences = {}; demo.regs = {}; demo.isAdmin = false; return {ok:true};
  },
  async resetPassword(){ return {ok:true}; },
  async signOut(){ demo.club = null; },
  async load(){ return {club:demo.club, licences:demo.licences, regs:demo.regs, settings:demo.settings, isAdmin:demo.isAdmin}; },
  async startLicence(pathway, gymnasts, books, spares){
    // Real version: Stripe Checkout, then Stripe confirms and the licence goes live
    const price = pricingFor(demo.settings, pathway), term = billingTerm(), prev = demo.licences[pathway] || {};
    const cl = clubLicenceDue(price, term, gymnasts, {paidUntil: prev.clubLicence && prev.clubLicence.paidUntil, founding: foundingOpen() || prev.foundingClub});
    const bill = termBill({price, pathway, term, gymnasts, books, spares, clubLicence: cl});
    if(bill.error) throw new Error(bill.error);
    demo.licences[pathway] = {status:'active', gymnasts, currentTermId: term.id,
      clubLicence: cl ? {paidUntil: cl.until, lastPaidPence: cl.pence} : prev.clubLicence || null, foundingClub: !!(cl && cl.founding) || !!prev.foundingClub};
    demo.club.defaultPaymentMethod = true;
    (demo.regs[pathway] ||= {})[term.id] = {gymnasts, totalPence: bill.totalPence, status:'paid'};
    return {demo:true};
  },
  async registerTerm(pathway, gymnasts, books, spares){
    const term = nextTerm(), lic = demo.licences[pathway], price = pricingFor(demo.settings, pathway);
    if(!registrationOpen(term)) throw new Error('Registration for the next term is not open yet.');
    if((demo.regs[pathway] || {})[term.id]) throw new Error(`You have already registered for ${term.label}.`);
    if(gymnasts === 0){ (demo.regs[pathway] ||= {})[term.id] = {gymnasts:0, status:'ending'}; lic.endsAt = term.start; return {ending:true}; }
    const cl = clubLicenceDue(price, term, gymnasts, {paidUntil: lic.clubLicence && lic.clubLicence.paidUntil, founding: lic.foundingClub});
    const bill = termBill({price, pathway, term, gymnasts, books, spares, clubLicence: cl});
    if(bill.error) throw new Error(bill.error);
    (demo.regs[pathway] ||= {})[term.id] = {gymnasts, totalPence: bill.totalPence, status:'paid'};
    if(cl) lic.clubLicence = {paidUntil: cl.until, lastPaidPence: cl.pence};
    lic.endsAt = null;
    return {totalPence: bill.totalPence};
  },
  async addGymnasts(pathway, added, books){
    const lic = demo.licences[pathway], term = termById(lic.currentTermId) || currentTerm();
    const bill = termBill({price: pricingFor(demo.settings, pathway), pathway, term, gymnasts: added, books});
    if(bill.error) throw new Error(bill.error);
    lic.gymnasts += added;
    const r = (demo.regs[pathway] ||= {})[lic.currentTermId] ||= {gymnasts:0, status:'paid', totalPence:0};
    r.gymnasts += added; r.totalPence = (r.totalPence || 0) + bill.totalPence;
    return {ok:true};
  },
  async orderProducts(){ return {demo:true}; },
  async billingPortal(){ return {demo:true}; },
  async saveSettings(s){ demo.settings = {...demo.settings, ...s}; },
  async allLicences(){
    const mine = Object.entries(demo.licences).map(([pathway, l]) => ({club:demo.club.name, bg:demo.club.bgNumber, pathway, status:l.status, gymnasts:l.gymnasts, endsAt:l.endsAt}));
    return [...mine, ...demo.others];
  }
};
/* In the demo, moving the date across a term start applies registrations and roll-overs (the daily job does this live). */
function demoRollover(){
  const cur = currentTerm(); if(!cur) return;
  Object.entries(demo.licences).forEach(([p, l]) => {
    if(!givesAccess(l.status) || l.currentTermId === cur.id) return;
    const r = (demo.regs[p] || {})[cur.id];
    if(r && r.status === 'ending'){ l.status = 'ended'; l.gymnasts = 0; return; }
    if(!r){ (demo.regs[p] ||= {})[cur.id] = {gymnasts: l.gymnasts, status:'paid', rolled:true}; }
    else l.gymnasts = r.gymnasts;
    l.currentTermId = cur.id;
  });
}

/* =====================================================================
   LIVE DATA LAYER (Firebase Auth + Firestore + Cloud Functions)
   ===================================================================== */
let fb = null;
async function firebase(){
  if(fb) return fb;
  const [appM, authM, fsM, fnM] = await Promise.all([
    import(SDK + 'firebase-app.js'), import(SDK + 'firebase-auth.js'),
    import(SDK + 'firebase-firestore.js'), import(SDK + 'firebase-functions.js')
  ]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  fb = {authM, fsM, auth: authM.getAuth(app), db: fsM.getFirestore(app), fns: fnM.getFunctions(app, FUNCTIONS_REGION), fnM};
  return fb;
}
const call = async (name, data) => { const f = await firebase(); return (await f.fnM.httpsCallable(f.fns, name)(data)).data; };
const friendly = e => (e && e.message || String(e)).replace(/^Firebase: /, '').replace(/\s*\(auth\/[a-z-]+\)\.?/, '');

const liveApi = {
  live: true,
  async signIn(email, password){ const f = await firebase(); await f.authM.signInWithEmailAndPassword(f.auth, email, password); return {ok:true}; },
  async register(d){
    const f = await firebase();
    await f.authM.createUserWithEmailAndPassword(f.auth, d.email, d.password);
    await call('registerClub', {name:d.name, bgNumber:d.bgNumber, contactName:d.contactName, acceptedTerms:true});
    return {ok:true};
  },
  async resetPassword(email){ const f = await firebase(); await f.authM.sendPasswordResetEmail(f.auth, email); return {ok:true}; },
  async signOut(){ const f = await firebase(); await f.authM.signOut(f.auth); },
  async load(){
    const f = await firebase(); const {doc, getDoc, collection, getDocs} = f.fsM;
    const user = f.auth.currentUser;
    const token = await user.getIdTokenResult(true);
    const isAdmin = token.claims.admin === true;
    const settingsSnap = await getDoc(doc(f.db, 'settings/licensing'));
    const settings = {pathways:{}, ...(settingsSnap.exists() ? settingsSnap.data() : {})};
    const u = await getDoc(doc(f.db, 'users', user.uid));
    if(!u.exists()) return {club:null, licences:{}, regs:{}, settings, isAdmin};
    const clubId = u.data().clubId;
    const club = (await getDoc(doc(f.db, 'clubs', clubId))).data();
    const licences = {}, regs = {};
    for(const s of (await getDocs(collection(f.db, 'clubs', clubId, 'licences'))).docs){
      licences[s.id] = s.data(); regs[s.id] = {};
      (await getDocs(collection(f.db, 'clubs', clubId, 'licences', s.id, 'terms'))).forEach(t => { regs[s.id][t.id] = t.data(); });
    }
    return {club, licences, regs, settings, isAdmin};
  },
  async startLicence(pathway, gymnasts, books, spares){ const r = await call('startLicence', {pathway, gymnasts, books, spares}); location.href = r.url; return r; },
  async registerTerm(pathway, gymnasts, books, spares){ return call('registerTerm', {pathway, gymnasts, books, spares}); },
  async addGymnasts(pathway, added, books){ return call('addGymnasts', {pathway, added, books}); },
  async orderProducts(pathway, items){ const r = await call('orderProducts', {pathway, items}); location.href = r.url; return r; },
  async billingPortal(){ const r = await call('billingPortal', {}); location.href = r.url; return r; },
  async saveSettings(s){
    const f = await firebase(); const {doc, setDoc, serverTimestamp} = f.fsM;
    await setDoc(doc(f.db, 'settings/licensing'), {...s, updatedAt: serverTimestamp()}, {merge:true});
  },
  async allLicences(){
    const f = await firebase(); const {collectionGroup, getDocs, getDoc} = f.fsM;
    const snaps = await getDocs(collectionGroup(f.db, 'licences'));
    const clubCache = {}, rows = [];
    for(const s of snaps.docs){
      const clubRef = s.ref.parent.parent;
      clubCache[clubRef.id] ||= (await getDoc(clubRef)).data() || {};
      const c = clubCache[clubRef.id], l = s.data();
      rows.push({club:c.name, bg:c.bgNumber, pathway:s.id, status:l.status, gymnasts:l.gymnasts, endsAt:l.endsAt});
    }
    return rows;
  }
};

function toast(msg, err){
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' err' : ''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3600);
}

function modal(html){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`;
  bg.addEventListener('click', e => { if(e.target === bg) bg.remove(); });
  document.body.appendChild(bg);
  bg.close = () => bg.remove();
  bg.querySelectorAll('[data-close]').forEach(b => b.onclick = bg.close);
  return bg;
}

function statusTag(l){
  if(!l || l.status === 'none') return '<span class="tag none">Not started</span>';
  if(givesAccess(l.status) && l.endsAt) return '<span class="tag wait">Ending</span>';
  return ({
    active:'<span class="tag ok">Active</span>',
    past_due:'<span class="tag wait">Payment due</span>',
    pending:'<span class="tag wait">Awaiting payment</span>',
    lapsed:'<span class="tag bad">Lapsed</span>',
    ended:'<span class="tag none">Ended</span>'
  })[l.status] || '<span class="tag none">Not started</span>';
}

function termStrip(){
  const cur = currentTerm(), nx = nextTerm();
  const parts = [];
  if(cur && ukDate() <= cur.end) parts.push(`<b>${esc(cur.label)}</b> runs until ${fmtDate(cur.end)}.`);
  else if(cur) parts.push(`${esc(cur.label)} has finished.`);
  if(nx && registrationOpen(nx)) return `<div class="window-strip open"><span>📝</span><span>${parts.join(' ')} <b>Registration for ${esc(nx.label)} is open</b> until ${fmtDate(nx.start)}. Confirm your gymnast numbers on each licence below; anything not registered rolls over at the current number.</span></div>`;
  if(nx) parts.push(`Registration for ${esc(nx.label)} opens ${fmtDate(nx.regOpens)}.`);
  return `<div class="window-strip closed"><span>📅</span><span>${parts.join(' ')} You can add gymnasts at any time; numbers go down by registering a lower number for the next term.</span></div>`;
}

/* Club Licence box: founding price charged, full price struck through */
function clubFeeBox(pr, id, due){
  const bands = pr.clubFee.bands, f = foundingOpen();
  let priceHtml;
  if(due){
    const struck = due.founding && due.fullPence > due.foundingPence && due.share === 1 ? `<s>${gbp(due.fullPence)}</s>` : '';
    priceHtml = `${struck}<b class="price">${gbp(due.pence)}</b> ${due.share === 1 ? 'for the year' : due.taster ? '' : 'for the rest of this school year'}${bands.length > 1 ? ` <span class="muted">(${esc(due.band)})</span>` : ''}${due.founding ? '<span class="found">Founding club price</span>' : ''}
      ${due.share < 1 ? `<div class="muted" style="margin-top:4px">${due.taster ? 'Summer taster: no Club Licence to pay until September.' : `Pro-rata for joining mid-year. Then ${gbp(due.founding ? due.foundingPence : due.fullPence)} a year, renewing each September.`}</div>` : '<div class="muted" style="margin-top:4px">Renews each September.</div>'}`;
  } else if(bands.length === 1){
    const b = bands[0];
    priceHtml = `${f && b.fullPence > b.foundingPence ? `<s>${gbp(b.fullPence)}</s>` : ''}<b class="price">${gbp(f ? b.foundingPence : b.fullPence)}</b> a year${f ? '<span class="found">Founding club price</span>' : ''}`;
  } else {
    priceHtml = `From ${f ? `<s>${gbp(bands[0].fullPence)}</s>` : ''}<b class="price">${gbp(f ? bands[0].foundingPence : bands[0].fullPence)}</b> a year${f ? '<span class="found">Founding club price</span>' : ''}<br><span class="muted">By number of gymnasts: ${esc(bands.map((b, i, a) => { const lo = i === 0 ? 1 : a[i-1].max + 1; return `${b.max == null ? lo + '+' : lo + '–' + b.max} ${gbp(f ? b.foundingPence : b.fullPence)}`; }).join(' · '))}</span>`;
  }
  return `<div class="feebox"><div style="font-weight:800;margin-bottom:2px">Club Licence: the plans, yearly</div>${priceHtml}
    ${CLUB_FEE_VALUE[id] ? `<div class="muted" style="margin-top:4px">${esc(CLUB_FEE_VALUE[id])}</div>` : ''}
    ${!due && f ? `<div class="muted" style="margin-top:4px">Founding club prices for clubs that join by ${fmtDate(foundingUntil())}, kept when you renew. Joining mid-year is pro-rata by term.</div>` : ''}</div>`;
}

function stepper(id, value, min){
  return `<div class="stepper">
    <button type="button" data-step="-1" aria-label="One fewer">−</button>
    <input class="input" id="${id}" type="number" inputmode="numeric" min="${min}" max="${MAX_GYMNASTS}" step="1" value="${value}">
    <button type="button" data-step="1" aria-label="One more">+</button>
  </div>`;
}
function wireStepper(m, id, onChange){
  const inp = m.querySelector('#' + id);
  inp.parentElement.querySelectorAll('[data-step]').forEach(b => b.onclick = () => { inp.value = Math.max(+inp.min, Math.min(MAX_GYMNASTS, (parseInt(inp.value, 10) || 0) + +b.dataset.step)); onChange(); });
  inp.oninput = onChange;
  return () => parseInt(inp.value, 10);
}
/* number box that follows a maximum until the club edits it */
function smallField(id, label, note){
  return `<div class="field" style="margin:12px 0 0"><label for="${id}">${label}</label>
    <input class="input" id="${id}" type="number" inputmode="numeric" min="0" step="1" style="max-width:140px">
    ${note ? `<p class="note" style="margin:6px 0 0">${note}</p>` : ''}</div>`;
}
function follower(m, id, maxFn, dfltFn, onChange){
  const inp = m.querySelector('#' + id); let touched = false;
  inp.oninput = () => { touched = true; onChange(); };
  return { sync(){ const mx = maxFn(); inp.max = mx; if(!touched) inp.value = dfltFn(); else if(+inp.value > mx) inp.value = mx; },
           get(){ return parseInt(inp.value, 10); }, show(on){ inp.closest('.field').hidden = !on; } };
}

function startModal(pathway){
  const p = pathwayById(pathway), s = pricingFor(state.settings, pathway), term = billingTerm();
  if(!term){ toast('No term is set up yet. Please contact NGL.', true); return; }
  const prev = state.licences[pathway] || {};
  const m = modal(`<p class="eyebrow"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</p>
    <h2>Start ${esc(p.name)} licence</h2>

    ${INCLUDES[pathway] ? `<div style="--pc:${p.color};margin:0 0 14px">${includesList(pathway)}</div>` : ''}
    <p class="muted">How many gymnasts this term? You can add more at any time.</p>
    ${stepper('qty', 20, 1)}
    ${smallField('books', `How many need a new ${esc((s.bookName || 'book').toLowerCase())}? (${gbp(s.bookPence)} each)`, 'Gymnasts who already have one pay nothing for it.')}
    ${s.medal ? smallField('spares', `Spare medals for mid-term joiners (${gbp(s.medal.pricePence)} each, optional)`, '') : ''}

    <div id="calc" style="margin-top:14px"></div>
    <label class="note" style="display:flex;gap:10px;align-items:flex-start;margin:14px 0"><input type="checkbox" id="ok" style="margin-top:3px"> I understand numbers can go up at any time, and go down only by registering a lower number before the next term starts.</label>
    <p class="error" id="err"></p>
    <div class="btn-row"><button class="btn" id="go">Continue to payment</button><button class="btn ghost" data-close>Cancel</button></div>
    <p class="note" style="margin-top:12px">Pay by card or Direct Debit on the next screen (Stripe). It is saved for your termly bills.</p>`);
  const calc = () => {
    const q = get(), err = m.querySelector('#err'); err.textContent = '';
    const valid = Number.isInteger(q) && q >= 1 && q <= MAX_GYMNASTS;
    if(!valid){ m.querySelector('#calc').innerHTML = `<p class="error">Enter between 1 and ${n0(MAX_GYMNASTS)} gymnasts.</p>`; m.querySelector('#go').disabled = true; return; }
    bk.sync(); if(sp) sp.sync();
    const cl = s.clubFee ? clubLicenceDue(s, term, q, {paidUntil: prev.clubLicence && prev.clubLicence.paidUntil, founding: foundingOpen() || prev.foundingClub}) : null;
    if(s.clubFee) m.querySelector('#feebox').innerHTML = cl ? clubFeeBox(s, pathway, cl) : '<div class="feebox">Club Licence already paid for this school year.</div>';
    const bill = termBill({price:s, pathway, term, gymnasts:q, books:bk.get(), spares: sp ? sp.get() : 0, clubLicence:cl});
    if(bill.error){ m.querySelector('#calc').innerHTML = `<p class="error">${esc(bill.error)}</p>`; m.querySelector('#go').disabled = true; return; }
    m.querySelector('#calc').innerHTML = `<p class="note" style="margin:0 0 4px;font-weight:800;color:var(--white)">First bill: ${esc(term.label)}</p>` + billHTML(bill) +
      `<p class="note">Next term, ${n0(q)} gymnasts would be ${gbp(q * s.termPence)} licence${s.medal ? ' + that term\'s medals' : ''}.</p>`;
    m.querySelector('#go').disabled = false;
  };
  const bk = follower(m, 'books', () => get() || 0, () => get() || 0, () => calc());
  const sp = s.medal ? follower(m, 'spares', () => Math.ceil((get() || 0) * MAX_SPARE_PCT), () => 0, () => calc()) : null;
  const get = wireStepper(m, 'qty', calc); calc();
  m.querySelector('#go').onclick = async () => {
    const err = m.querySelector('#err'); err.textContent = '';
    if(!m.querySelector('#ok').checked){ err.textContent = 'Please tick to confirm how changes work.'; return; }
    const btn = m.querySelector('#go'); btn.disabled = true; btn.textContent = 'Opening payment…';
    try {
      const r = await api.startLicence(pathway, get(), bk.get(), sp ? sp.get() : 0);
      if(r.demo){ m.close(); await refresh(); show(); toast(`${p.name} licence active (demo: Stripe payment skipped)`); }

}

/* ---------- Register for next term ---------- */
function registerModal(pathway){
  const p = pathwayById(pathway), s = pricingFor(state.settings, pathway), l = state.licences[pathway], term = nextTerm();
  const m = modal(`<p class="eyebrow"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</p>
    <h2>Register for ${esc(term.label)}</h2>
    <p class="note">Term starts ${fmtDate(term.start)}${s.medal && s.medal.fromCalendar ? `. Countries this term: ${esc(term.countries.join(', '))}` : ''}. This term you have <b>${n0(l.gymnasts)}</b> gymnasts.</p>
    <p class="muted">How many gymnasts next term? Set 0 to end the licence when the term starts.</p>
    ${stepper('qty', l.gymnasts, 0)}
    ${smallField('books', `How many need a new ${esc((s.bookName || 'book').toLowerCase())}? (${gbp(s.bookPence)} each)`, 'New gymnasts usually do; returning gymnasts keep theirs unless the book is yearly.')}
    ${s.medal ? smallField('spares', `Spare medals (${gbp(s.medal.pricePence)} each, optional)`, '') : ''}
    <div id="calc" style="margin-top:14px"></div>
    <p class="error" id="err"></p>
    <div class="btn-row"><button class="btn" id="go">Confirm registration</button><button class="btn ghost" data-close>Close</button></div>
    <p class="note" style="margin-top:12px">Charged to your saved card or Direct Debit. Not registering keeps you at ${n0(l.gymnasts)} gymnasts.</p>`);
  const calc = () => {
    const q = get(), go = m.querySelector('#go');
    if(!Number.isInteger(q) || q < 0 || q > MAX_GYMNASTS){ m.querySelector('#calc').innerHTML = `<p class="error">Enter between 0 and ${n0(MAX_GYMNASTS)}.</p>`; go.disabled = true; return; }
    bk.show(q > 0); if(sp) sp.show(q > 0);
    if(q === 0){ m.querySelector('#calc').innerHTML = `<div class="lock"><span>⏹</span><span><b>Ending this licence.</b> Access continues until ${fmtDate(term.start)}. Nothing more is charged.</span></div>`; go.disabled = false; go.className = 'btn danger'; go.textContent = 'End licence'; return; }
    bk.sync(); if(sp) sp.sync();
    const cl = s.clubFee ? clubLicenceDue(s, term, q, {paidUntil: l.clubLicence && l.clubLicence.paidUntil, founding: l.foundingClub}) : null;
    const bill = termBill({price:s, pathway, term, gymnasts:q, books:bk.get(), spares: sp ? sp.get() : 0, clubLicence:cl});
    if(bill.error){ m.querySelector('#calc').innerHTML = `<p class="error">${esc(bill.error)}</p>`; go.disabled = true; return; }
    m.querySelector('#calc').innerHTML = (cl ? `<p class="note" style="margin:0 0 6px">Your Club Licence renews with this bill${cl.band ? ` (${esc(cl.band)})` : ''}.</p>` : '') + billHTML(bill);
    go.disabled = false; go.className = 'btn'; go.textContent = 'Confirm registration';
  };
  const bk = follower(m, 'books', () => get() || 0, () => Math.max((get() || 0) - l.gymnasts, 0), () => calc());
  const sp = s.medal ? follower(m, 'spares', () => Math.ceil((get() || 0) * MAX_SPARE_PCT), () => 0, () => calc()) : null;
  const get = wireStepper(m, 'qty', calc); calc();
  m.querySelector('#go').onclick = async () => {
    const err = m.querySelector('#err'); err.textContent = '';
    const btn = m.querySelector('#go'); btn.disabled = true;
    try {
      const r = await api.registerTerm(pathway, get(), get() ? bk.get() : 0, get() && sp ? sp.get() : 0);
      m.close(); await refresh(); show();
      toast(r.ending ? `${p.name} licence ends when ${term.label} starts` : `${p.name} registered for ${term.label}`);
    } catch(x){ err.textContent = friendly(x); btn.disabled = false; }
  };
}

/* ---------- Extras: spare medals, replacement books, extra themes ---------- */
function orderModal(pathway){
  const p = pathwayById(pathway), pr = pricingFor(state.settings, pathway), l = state.licences[pathway];
  const rows = [];
  if(pr.themes) rows.push({id:'theme', name:'Extra themes', unit:pr.themes.extraPence, cap:20, hint:`${gbp(pr.themes.extraPence)} each, on top of the ${pr.themes.included} themes in your Club Licence.`});
  if(pr.medal) rows.push({id:'medal', name:'Spare medals', unit:pr.medal.pricePence, cap:Math.ceil(l.gymnasts * MAX_SPARE_PCT), hint:`${gbp(pr.medal.pricePence)} each, for gymnasts who join mid-term.`});
  rows.push({id:'book', name:`Replacement ${(pr.bookName || 'book').toLowerCase()}s`, unit:pr.bookPence, cap:l.gymnasts, hint:`${gbp(pr.bookPence)} each.`});
  const m = modal(`<p class="eyebrow"><span class="dot" style="--pc:${p.color}"></span>${esc(p.name)}</p>
    <h2>Order extras</h2>
    <p class="note">Medals for your registered gymnasts come with each term's bill; this is for anything extra.</p>
    ${rows.map(r => `<div class="shop-row"><div><b>${esc(r.name)}</b><div class="note">${r.hint}</div></div>
      <input class="input" type="number" min="0" max="${r.cap}" step="1" value="0" data-item="${r.id}" aria-label="${esc(r.name)} quantity"></div>`).join('')}
    <div id="calc" style="margin-top:14px"></div>
    <p class="error" id="err"></p>
    <div class="btn-row"><button class="btn" id="go" disabled>Pay by card</button><button class="btn ghost" data-close>Close</button></div>`);
  const items = () => rows.map(r => ({id:r.id, qty: parseInt(m.querySelector(`[data-item="${r.id}"]`).value, 10) || 0}));
  const calc = () => {
    const its = items(), err = m.querySelector('#err'); err.textContent = '';
    let total = 0, bad = null;
    its.forEach((it, i) => { if(it.qty < 0 || it.qty > rows[i].cap) bad = `Up to ${n0(rows[i].cap)} ${rows[i].name.toLowerCase()}.`; total += it.qty * rows[i].unit; });
    m.querySelector('#calc').innerHTML = its.filter(i => i.qty).map(it => { const r = rows.find(x => x.id === it.id); return `<div class="sum"><span>${n0(it.qty)} × ${esc(r.name)}</span><span>${gbp(it.qty * r.unit)}</span></div>`; }).join('') +
      (total ? `<div class="sum total"><span>Total</span><span>${gbp(total)}</span></div>` : '');
    if(bad) err.textContent = bad;
    m.querySelector('#go').disabled = !!bad || !total;
  };
  m.querySelectorAll('[data-item]').forEach(i => i.oninput = calc);
  m.querySelector('#go').onclick = async () => {
    const btn = m.querySelector('#go'); btn.disabled = true; btn.textContent = 'Opening payment…';
    try { const r = await api.orderProducts(pathway, items().filter(i => i.qty)); if(r.demo){ m.close(); toast('Order placed (demo: payment skipped)'); } }
    catch(x){ m.querySelector('#err').textContent = friendly(x); btn.disabled = false; btn.textContent = 'Pay by card'; }
  };
}

  document.getElementById('addTerm').onclick = () => { terms.push({id:'', label:'', regOpens:'', start:'', end:'', countries:[]}); drawTerms(); };
  document.getElementById('save').onclick = async () => {
    const err = document.getElementById('err'); err.textContent = '';
    const badT = terms.find(t => !t.label.trim() || !t.start || !t.end || !t.regOpens || t.regOpens >= t.start || t.start > t.end);
    if(badT){ err.textContent = 'Each term needs a name, a registration date before the first day, and a last day after the first.'; return; }
    const pathways = {}; let bad = null;
    PATHWAYS.forEach(p => {
      const cur = pricingFor(s, p.id), tr = document.querySelector(`[data-price="${p.id}"]`);
      const v = f => { const el = tr.querySelector(`[data-f=${f}]`); return el ? el.value.trim() : null; };
      if(!v('term')){ pathways[p.id] = {termPence:0, bookPence:0}; return; }
      const out = JSON.parse(JSON.stringify(cur || {}));
      out.termPence = Math.round(parseFloat(v('term')) * 100); out.bookPence = Math.round(parseFloat(v('book') || '0') * 100);
      if(!(out.termPence > 0) || !(out.bookPence >= 0)) bad = p.name;
      if(out.medal && v('medal') != null) out.medal.pricePence = Math.round(parseFloat(v('medal') || '0') * 100);
      if(out.medal && v('perTerm') != null) out.medal.perTerm = parseInt(v('perTerm') || '0', 10);
      document.querySelectorAll(`[data-cf^="${p.id}|"]`).forEach(inp => { const [, i, f] = inp.dataset.cf.split('|'); const x = inp.value.trim();
        out.clubFee.bands[+i][f] = f === 'max' ? (x === '' ? null : parseInt(x, 10)) : Math.round(parseFloat(x || '0') * 100); });
      if(out.clubFee){ const b = out.clubFee.bands; if(b[b.length - 1].max != null || b.slice(0, -1).some((x, i) => x.max == null || (i > 0 && x.max <= b[i-1].max))) bad = `${p.name} Club Licence bands (each limit higher than the one above, the last one blank)`; }
      pathways[p.id] = out;
    });
    if(bad){ err.textContent = `Check ${bad}.`; return; }
    const cleanTerms = terms.map(t => ({id: t.id || `${t.start.slice(0, 4)}-${['aut','spr','sum'][termIndex(t)]}`, label: t.label.trim(), regOpens: t.regOpens, start: t.start, end: t.end, countries: t.countries}))
      .sort((a, b) => a.start.localeCompare(b.start));
    try {
      await api.saveSettings({pathways, terms: cleanTerms, summerTaster: document.getElementById('taster').checked, foundingUntil: document.getElementById('foundUntil').value || DEFAULT_FOUNDING_UNTIL});
      await refresh(); toast('Settings saved'); showAdmin();
    } catch(x){ err.textContent = friendly(x); }
  };
  try {
    const rows = (await api.allLicences()).sort((a, b) => (a.club || '').localeCompare(b.club || '') || a.pathway.localeCompare(b.pathway));
    const live = rows.filter(r => givesAccess(r.status));
    const tot = live.reduce((a, r) => a + (r.gymnasts || 0), 0);
    const termIncome = live.reduce((a, r) => { const pr = pricingFor(state.settings, r.pathway); return a + (pr ? (r.gymnasts || 0) * pr.termPence : 0); }, 0);
    document.getElementById('all').innerHTML = `
      <div class="kpis" style="margin:0 0 14px">
        <div class="kpi"><div class="v">${new Set(live.map(r => r.bg)).size}</div><div class="l">Clubs with a live licence</div></div>
        <div class="kpi"><div class="v">${n0(tot)}</div><div class="l">Registered gymnasts</div></div>
        <div class="kpi"><div class="v">${gbp(termIncome)}</div><div class="l">Gymnast Licences this term</div></div>
        <div class="kpi"><div class="v">${rows.filter(r => r.status === 'past_due').length}</div><div class="l">Payments due</div></div>
      </div>
      <div class="table-wrap"><table>
        <thead><tr><th>Club</th><th>BG number</th><th>Pathway</th><th>Status</th><th class="num">Gymnasts</th></tr></thead>
        <tbody>${rows.map(r => `<tr><td>${esc(r.club)}</td><td>${esc(r.bg)}</td>
          <td><span class="dot" style="--pc:${pathwayById(r.pathway)?.color}"></span>${esc(pathwayById(r.pathway)?.name || r.pathway)}</td>
          <td>${statusTag(r)}</td><td class="num">${n0(r.gymnasts)}</td></tr>`).join('')}</tbody>
      </table></div>`;
  } catch(x){ document.getElementById('all').innerHTML = `<p class="error">${esc(friendly(x))}</p>`; }
}

/* ---------- Boot ---------- */
(async () => {
  if(api.live){
    const f = await firebase();
    f.authM.onAuthStateChanged(f.auth, async user => {
      state.signedIn = !!user;
      if(user){ try { await refresh(); } catch(x){ toast(friendly(x), true); } }
      show();
    });
  } else show();
})();
</script>
</body>
</html>
