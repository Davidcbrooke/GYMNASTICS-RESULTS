<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1440">
<title>NGL Schools – Club Hub</title>
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --red:#d0021b; --gold:#f2a900; --schools:#f5d12f; --ok:#5fd38d; --warn:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,select{font:inherit;color:inherit;}
  a{color:var(--schools);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px;}

  /* Top bar */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(10,20,64,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  .topbar .wrap{display:flex;align-items:center;gap:12px;min-height:60px;}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  @media(max-width:600px){.top-actions .pill{display:none;}.brand-top{display:none;}}
  .pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--schools);color:var(--navy);white-space:nowrap;}

  /* Nav tabs (signed in) */
  .navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--navy-3);font-weight:700;font-size:14px;cursor:pointer;}
  .navtab.active{background:var(--schools);border-color:var(--schools);color:var(--navy);}

  main{padding:20px 0 60px;}
  .screen{animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px;font-weight:900;letter-spacing:-.015em;}
  h2{font-size:22px;margin:0 0 10px;font-weight:850;}
  h3{font-size:16px;margin:0 0 6px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--schools);font-weight:800;margin:0 0 10px;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:760px){.grid2{grid-template-columns:1fr 1fr;}.grid3{grid-template-columns:repeat(3,1fr);}}
  .section{margin:34px 0 0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--schools);color:var(--navy);font-weight:900;font-size:15px;text-decoration:none;white-space:nowrap;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);font-weight:700;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* Landing */
  .hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding:14px 0 6px;}
  @media(min-width:820px){.hero{grid-template-columns:1.25fr .75fr;}}
  .hero img{width:100%;max-width:280px;justify-self:center;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-3deg);}
  .lead{font-size:18px;color:var(--muted);}
  .steps{counter-reset:st;}
  .step{position:relative;padding-left:48px;}
  .step::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--schools);color:var(--navy);display:grid;place-items:center;font-weight:900;}
  .ticks{list-style:none;padding:0;margin:0;}
  .ticks li{padding:7px 0 7px 28px;position:relative;line-height:1.45;}
  .ticks li::before{content:"✓";position:absolute;left:4px;color:var(--schools);font-weight:900;}
  .stat{font-size:34px;font-weight:900;color:var(--schools);line-height:1;}
  .journey{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .jstep{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .jstep.on{background:var(--schools);border-color:var(--schools);color:var(--navy);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:15px;}
  th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.hl td{background:rgba(245,209,47,.1);}
  .table-wrap{overflow-x:auto;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  .input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--white);font-size:16px;outline:none;}
  .input:focus{border-color:var(--schools);}
  .error{color:#ff8a95;font-weight:700;font-size:14px;min-height:1em;margin:0 0 10px;}
  .note{font-size:13px;color:var(--muted);}
  .auth{max-width:440px;margin:10px auto 0;}
  .demo-banner{font-size:13px;text-align:center;color:var(--navy);background:var(--gold);border-radius:10px;padding:9px 12px;margin:0 0 16px;font-weight:700;}

  /* Dashboard */
  .band-card{background:linear-gradient(135deg,var(--navy-4),var(--navy-3));position:relative;overflow:hidden;}
  .band-card::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(245,209,47,.3),transparent 70%);}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .kpi .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .bar{height:10px;border-radius:999px;background:var(--navy-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line);}
  .bar span{display:block;height:100%;background:var(--schools);border-radius:999px;}
  .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .tag.ok{background:rgba(95,211,141,.18);color:var(--ok);}
  .tag.wait{background:rgba(255,180,84,.18);color:var(--warn);}
  .tag.info{background:rgba(245,209,47,.18);color:var(--schools);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .school-row{cursor:pointer;}
  .school-row:hover td{background:rgba(255,255,255,.03);}

  .modal-bg{position:fixed;inset:0;background:rgba(3,8,30,.7);z-index:50;display:grid;place-items:center;padding:16px;}
  .modal{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;}
  .sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
  .sum.total{font-weight:900;font-size:18px;border-bottom:0;}

  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:40px;}
  .mono{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;}

  /* Club code card */
  .code-card{border-color:rgba(245,209,47,.45);}
  .code-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:center;}
  @media(min-width:700px){.code-grid{grid-template-columns:1fr 170px;}}
  .club-code{font-size:clamp(30px,6vw,40px);font-weight:900;color:var(--schools);letter-spacing:.06em;}
  .qr-box{background:#fff;border-radius:14px;padding:10px;width:170px;justify-self:center;text-align:center;color:var(--navy);font-size:12px;font-weight:800;}
  .qr-box svg{width:150px;height:150px;display:block;}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="wrap">
      <div class="brand">
        <span class="brand-top">National Gymnastics League</span>
        <span class="brand-title">NGL Schools · Club Hub</span>
      </div>
      <div class="top-actions" id="topActions"></div>
    </div>
  </header>
  <div class="wrap">
    <nav class="navtabs" id="navtabs" hidden></nav>
    <main id="view"></main>
  </div>
</div>

<script>
//---------------------------------------------------------------------
//
// QR Code Generator for JavaScript
//
// Copyright (c) 2009 Kazuhiko Arase
//
// URL: http://www.d-project.com/
//
// Licensed under the MIT license:
//  http://www.opensource.org/licenses/mit-license.php
//
// The word 'QR Code' is registered trademark of
// DENSO WAVE INCORPORATED
//  http://www.denso-wave.com/qrcode/faqpatent-e.html
//
//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.

   held in memory (nothing is saved). Once the ngl-schools Firebase
   project exists, paste its config here and the `api` layer below is
   switched to Firebase Auth + Firestore.

/* Links — update when the Hub moves to its own subdomain / shop product exists */
const PARENT_HUB_URL = 'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/ngl-schools-hub.html';
const SHOP_URL = 'https://www.nationalgymnasticsleague.co.uk/shop';
const LICENCE_PRODUCT_URL = {           // Squarespace product variants, one per band
  25: 'https://www.nationalgymnasticsleague.co.uk/shop',
  22: 'https://www.nationalgymnasticsleague.co.uk/shop',
  20: 'https://www.nationalgymnasticsleague.co.uk/shop'
};
const CONTACT_EMAIL = 'bookingoffice@saadigymnastics.co.uk';

/* ---------- Pricing rules ---------- */
const BANDS = [
  {min:1,    max:99,       price:25, label:'1–99'},
  {min:100,  max:499,      price:22, label:'100–499'},
  {min:500,  max:999,      price:20, label:'500–999'},
  {min:1000, max:Infinity, price:null, label:'1,000+'}
];
function bandFor(count){ return BANDS.find(b => count >= b.min && count <= b.max) || BANDS[0]; }
const EXTRAS = [
  {item:'Awards Book', price:8},
  {item:'Certificate', price:1},
  {item:'NGL Schools Coach T-shirt', price:20},
  {item:'Graduation place (incl. medal)', price:10}
];
const gbp = n => n == null ? 'Agreement' : '£' + n.toLocaleString('en-GB', {minimumFractionDigits: n % 1 ? 2 : 0});

/* ---------- School year ---------- */
function currentSeason(d = new Date()){
  const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;   // Sept starts the year
  return y + '/' + String(y + 1).slice(2);
}
function nextSeason(s){ const y = +s.slice(0,4) + 1; return y + '/' + String(y + 1).slice(2); }

/* ---------- Club Hub access codes (must match ngl-schools-hub.html) ----------
   One code per club, shared with all its Schools families, e.g. SAADI-7K4P.
   Prefix = first word of the club name (max 10 letters), then 4 characters with no look-alikes. */
const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function codePrefix(name){
  const words = String(name).toUpperCase().replace(/[^A-Z ]/g,'').split(/\s+/)
    .filter(w => w && !['GYMNASTICS','GYMNASTIC','GYM','CLUB','THE','ACADEMY','OF','AND'].includes(w));
  return (words[0] || 'NGL').slice(0, 10).padEnd(2, 'X');
}
function newAccessCode(clubName){
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  return codePrefix(clubName) + '-' + Array.from(r, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join('');
}

/* =====================================================================
   DATA LAYER — demo implementation. Same method names will be backed by
   Firebase Auth + Firestore:
     clubs/{uid}                 name, bgNumber, contact, email, bands{season:price}
     clubs/{uid}/schools/{id}    name
     orders/{id}                 clubId, schoolId, qty, price, season, status
     accessCodes/{code}          clubId, clubName, season, status 'active'|'inactive'
   The parent Hub only ever reads accessCodes/{code}.
   ===================================================================== */
function makeClub(name, contact, email){
  return {name, contact, email, bands:{}, accessCode:newAccessCode(name)};
}
const demo = (() => {
  const season = currentSeason();
  const state = {season, club:null, schools:[], orders:[]};
  state.loadSample = () => {
    state.club = makeClub('SAADI Gymnastics', 'Dave Brooke', CONTACT_EMAIL);
    state.club.bands[season] = 20;   // demo: last year's total put SAADI in the £20 band
    state.schools = []; state.orders = [];
    [['Brookfield Primary',183],['St Mary’s C of E Primary',126],['Oakwood Junior School',207],['Hillside Infants',94]]
      .forEach(([n,q],i) => { const s = state.addSchool(n); state.orders.push({id:'ORD-' + (1001 + i), schoolId:s.id, qty:q, price:20, status:'paid', season}); });
  };
  state.addSchool = name => { const s = {id:'s' + (state.schools.length + 1), name}; state.schools.push(s); return s; };
  return state;
})();

const api = {
  async signIn(email, password){ demo.loadSample(); return {ok:true}; },
  // Live: createUserWithEmailAndPassword, then write clubs/{uid} + accessCodes/{code}. No approval step.
  async register(d){
    demo.club = makeClub(d.name, d.contact, d.email);
    demo.schools = []; demo.orders = [];
    return {ok:true};
  },
  async addSchool(name){ return demo.addSchool(name); },
  async orderLicences(schoolId, qty){
    const price = demo.club.bands[demo.season] ?? bandFor(qty).price;   // first order sets a new club's band
    if(demo.club.bands[demo.season] == null) demo.club.bands[demo.season] = price;
    const o = {id:'ORD-' + (1001 + demo.orders.length), schoolId, qty, price, status:'awaiting-payment', season:demo.season};
    demo.orders.push(o);
    return o;
  },
  async newCode(){ demo.club.accessCode = newAccessCode(demo.club.name); return demo.club.accessCode; },
  // Admin only in the live version — in preview a club can simulate it.
  async markPaid(orderId){ const o = demo.orders.find(x => x.id === orderId); if(o) o.status = 'paid'; }
};

            <td class="num">${o.status==='paid' ? '' : `<div class="row-actions"><a class="btn small" href="${LICENCE_PRODUCT_URL[o.price]||SHOP_URL}" target="_blank" rel="noopener">Pay now</a>${FIREBASE_CONFIG?'':`<button class="btn ghost small" data-act="markpaid" data-order="${o.id}" title="Preview only: in the live Hub NGL confirms payment">Simulate paid</button>`}</div>`}</td></tr>`;
        }).join('') || '<tr><td colspan="6" class="muted">No orders yet.</td></tr>'}</tbody>
      </table></div>
    </div>`);
}

function screenProgramme(){ render(pitchHTML(true)); }

function show(){
  setTop();
  if(!signedIn) return screenLanding();
  ({dashboard:screenDashboard, orders:screenOrders, programme:screenProgramme})[tab]();
  window.scrollTo(0,0);
}

/* ---------- Modals ---------- */
function modal(html){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e => { if(e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

function addSchoolModal(){
  const m = modal(`<h2>Add a school</h2>
    <form id="asf"><div class="field"><label for="sn">School name</label><input class="input" id="sn" required></div>
    <div class="btn-row"><button class="btn" type="submit">Add school</button><button class="btn ghost" type="button" data-close>Cancel</button></div></form>`);
  m.querySelector('#sn').focus();
  m.querySelector('#asf').addEventListener('submit', async e => {
    e.preventDefault(); const s = await api.addSchool(m.querySelector('#sn').value.trim()); m.remove();
    orderModal(s.id);
  });
}

function orderModal(schoolId){
  if(!demo.schools.length){ return addSchoolModal(); }
  const price = demo.club.bands[demo.season];
  const m = modal(`<h2>Add licences</h2>
    <form id="of">
      <div class="field"><label for="os">School</label><select class="input" id="os">${demo.schools.map(s => `<option value="${s.id}" ${s.id===schoolId?'selected':''}>${esc(s.name)}</option>`).join('')}</select></div>
      <div class="field"><label for="oq">How many gymnasts?</label><input class="input" id="oq" type="number" min="1" max="2000" value="30" required></div>
      <div id="osum"></div>
      <div class="btn-row" style="margin-top:14px"><button class="btn" type="submit">Place order</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
    </form>`);
  const q = m.querySelector('#oq');
  const upd = () => {
    const n = Math.max(0, parseInt(q.value || '0', 10));
    const p = price ?? bandFor(n).price;
    m.querySelector('#osum').innerHTML = `
      <div class="sum"><span>${n} × ${gbp(p)} ${price ? `(your ${esc(demo.season)} band)` : '(starting band)'}</span><span></span></div>
      <div class="sum total"><span>Total</span><span>${p ? gbp(n*p) : 'Commercial agreement'}</span></div>`;
  };
  q.addEventListener('input', upd); upd();
  m.querySelector('#of').addEventListener('submit', async e => {
    e.preventDefault();
    const n = parseInt(q.value, 10); if(!(n > 0)) return;
    const o = await api.orderLicences(m.querySelector('#os').value, n);
    m.innerHTML = `<div class="modal"><h2>Order ${o.id} placed</h2>
      <p class="muted">${n} licences · ${gbp(n*o.price)}. Pay through the NGL shop quoting <b class="mono">${o.id}</b>. The licences count towards your total straight away.</p>
      <div class="btn-row"><a class="btn" href="${LICENCE_PRODUCT_URL[o.price]||SHOP_URL}" target="_blank" rel="noopener">Pay now</a>
      <button class="btn ghost" data-close>Done</button></div></div>`;
    m.querySelector('[data-close]').addEventListener('click', () => { m.remove(); show(); });
  });
}

/* ---------- Sharing the club code ---------- */
function qrSVG(text){
  const qr = qrcode(0, 'M'); qr.addData(text); qr.make();
  return qr.createSvgTag({cellSize:4, margin:2, scalable:true});
}
function parentMessage(){
  return `Your child is taking part in NGL Schools gymnastics with ${demo.club.name}.\n\n`
    + `Watch the routines they’re learning and practise together at home in the NGL Schools Hub:\n${hubLink()}\n\n`
    + `Or go to the Schools Hub and enter our club code: ${demo.club.accessCode}`;
}
async function copyText(text, note){
  try{ await navigator.clipboard.writeText(text); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }
  const n = document.getElementById('copyNote'); if(n) n.textContent = note;
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if(go){ e.preventDefault(); const g = go.dataset.go; if(g==='login') screenLogin(); else if(g==='register') screenRegister(); else screenLanding(); window.scrollTo(0,0); return; }
  const nt = t.closest('[data-tab]');
  if(nt){ tab = nt.dataset.tab; show(); return; }
  const act = t.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a === 'signout'){ signedIn = false; screenLanding(); }
  else if(a === 'add-school') addSchoolModal();
  else if(a === 'order') orderModal(act.dataset.school);
  else if(a === 'copy-msg') copyText(parentMessage(), 'Message copied. Paste it into your letter, email or WhatsApp.');
  else if(a === 'copy-link') copyText(hubLink(), 'Link copied.');
  else if(a === 'new-code'){
    if(act.dataset.armed){ await api.newCode(); show(); const n = document.getElementById('copyNote'); if(n) n.textContent = 'New code created. The old code no longer works, so share the new one with your families.'; }
    else { act.dataset.armed = '1'; act.textContent = 'Tap again to confirm'; const n = document.getElementById('copyNote'); if(n) n.textContent = 'Changing your code stops the old one working for every family. Only do this if it has been shared outside your club.'; }
  }
  else if(a === 'markpaid'){ await api.markPaid(act.dataset.order); screenOrders(); }
});
