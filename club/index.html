<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5d12f">
<link rel="manifest" href="/club/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NGL Club Hub">
<title>NGL Schools – Club Hub</title>
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --red:#d0021b; --gold:#f2a900; --schools:#f5d12f; --ok:#5fd38d; --warn:#ffb454;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,select{font:inherit;color:inherit;}
  a{color:var(--schools);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 16px;}

  /* Top bar */

  /* NGL Schools header, styled on the Awards Book cover: yellow band with a
     line of navy text, then the navy panel with its top-right corner swept away */
  .topbar{position:relative;z-index:30;background:var(--schools);border:0;
    width:100vw;margin-left:calc(50% - 50vw);padding:0;}
  .topbar-strap{text-align:center;color:#2a245f;font-weight:800;font-size:13px;letter-spacing:.02em;
    padding:calc(7px + var(--safe-t, 0px)) 16px 7px;}
  .topbar-in{background:linear-gradient(180deg,#2a245f 0%,#2a245f 40%,var(--navy) 100%);border-top-right-radius:120px 38px;padding-bottom:22px;}
  @media(min-width:700px){.topbar-in{border-top-right-radius:220px 46px;}}
  .topbar-row{display:flex;align-items:center;gap:12px;min-height:66px;}
  .ngl-logo{height:44px;width:auto;display:block;flex:0 0 auto;}
  @media(min-width:700px){.ngl-logo{height:52px;}}
  .hub-label{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--schools);white-space:nowrap;}
  @media(max-width:600px){.hub-label{display:none;}}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;white-space:nowrap;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  @media(max-width:600px){.top-actions .pill{display:none;}.brand-top{display:none;}}
  .pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--schools);color:var(--navy);white-space:nowrap;}

  /* Nav tabs (signed in) */
  .navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--navy-3);font-weight:700;font-size:14px;cursor:pointer;}
  .navtab.active{background:var(--schools);border-color:var(--schools);color:var(--navy);}

  main{padding:20px 0 60px;}
  .screen{animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px;font-weight:900;letter-spacing:-.015em;}
  h2{font-size:22px;margin:0 0 10px;font-weight:850;}
  h3{font-size:16px;margin:0 0 6px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--schools);font-weight:800;margin:0 0 10px;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:760px){.grid2{grid-template-columns:1fr 1fr;}.grid3{grid-template-columns:repeat(3,1fr);}}
  .section{margin:34px 0 0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--schools);color:var(--navy);font-weight:900;font-size:15px;text-decoration:none;white-space:nowrap;}
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);font-weight:700;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  /* Landing */
  .hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding:14px 0 6px;}
  @media(min-width:820px){.hero{grid-template-columns:1.25fr .75fr;}}
  .hero img{width:100%;max-width:280px;justify-self:center;border-radius:12px;box-shadow:0 20px 50px rgba(0,0,0,.5);transform:rotate(-3deg);}
  .lead{font-size:18px;color:var(--muted);}
  .steps{counter-reset:st;}
  .step{position:relative;padding-left:48px;}
  .step::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--schools);color:var(--navy);display:grid;place-items:center;font-weight:900;}
  .ticks{list-style:none;padding:0;margin:0;}
  .ticks li{padding:7px 0 7px 28px;position:relative;line-height:1.45;}
  .ticks li::before{content:"✓";position:absolute;left:4px;color:var(--schools);font-weight:900;}
  .stat{font-size:34px;font-weight:900;color:var(--schools);line-height:1;}
  .journey{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .jstep{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .jstep.on{background:var(--schools);border-color:var(--schools);color:var(--navy);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:15px;}
  th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  tr.hl td{background:rgba(245,209,47,.1);}
  .table-wrap{overflow-x:auto;}

  /* Forms */
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  .input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--white);font-size:16px;outline:none;}
  .input:focus{border-color:var(--schools);}
  .error{color:#ff8a95;font-weight:700;font-size:14px;min-height:1em;margin:0 0 10px;}
  .note{font-size:13px;color:var(--muted);}
  .auth{max-width:440px;margin:10px auto 0;}
  .demo-banner{font-size:13px;text-align:center;color:var(--navy);background:var(--gold);border-radius:10px;padding:9px 12px;margin:0 0 16px;font-weight:700;}

  /* Dashboard */
  .band-card{background:linear-gradient(135deg,var(--navy-4),var(--navy-3));position:relative;overflow:hidden;}
  .band-card::after{content:"";position:absolute;right:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(245,209,47,.3),transparent 70%);}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .kpi .v{font-size:26px;font-weight:900;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .bar{height:10px;border-radius:999px;background:var(--navy-2);overflow:hidden;margin:12px 0 6px;border:1px solid var(--line);}
  .bar span{display:block;height:100%;background:var(--schools);border-radius:999px;}
  .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;}
  .tag.ok{background:rgba(95,211,141,.18);color:var(--ok);}
  .tag.wait{background:rgba(255,180,84,.18);color:var(--warn);}
  .tag.info{background:rgba(245,209,47,.18);color:var(--schools);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}
  .school-row{cursor:pointer;}
  .school-row:hover td{background:rgba(255,255,255,.03);}

  .modal-bg{position:fixed;inset:0;background:rgba(3,8,30,.7);z-index:50;display:grid;place-items:center;padding:16px;}
  .modal{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:460px;max-height:90vh;overflow:auto;}
  .sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);}
  .sum.total{font-weight:900;font-size:18px;border-bottom:0;}

  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:40px;}
  .mono{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;}

  /* Club code card */
  .code-card{border-color:rgba(245,209,47,.45);}
  .code-grid{display:grid;grid-template-columns:1fr;gap:18px;align-items:center;}
  @media(min-width:700px){.code-grid{grid-template-columns:1fr 170px;}}
  .club-code{font-size:clamp(30px,6vw,40px);font-weight:900;color:var(--schools);letter-spacing:.06em;}
  .qr-box{background:#fff;border-radius:14px;padding:10px;width:170px;justify-self:center;text-align:center;color:var(--navy);font-size:12px;font-weight:800;}
  .qr-box svg{width:150px;height:150px;display:block;}

  /* Invoice */
  .modal-wide{max-width:760px;}
  .grad-fee{background:rgba(245,209,47,.1);border:1px solid rgba(245,209,47,.4);border-radius:12px;padding:10px 12px;font-size:14px;margin:0 0 14px;line-height:1.45;}
  .grad-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--line);}
  .grad-row:first-of-type{margin-top:8px;}
  .inv-screen{background:#fff;border-radius:12px;padding:6px;overflow-x:auto;}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#1c1f3a;font-size:13px;line-height:1.45;padding:22px;min-width:560px;}
  .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #f5d12f;padding-bottom:14px;margin-bottom:16px;}
  .inv-logo{height:54px;width:auto;}
  .inv-title{text-align:right;}
  .inv-h{font-size:26px;font-weight:900;letter-spacing:.08em;color:#2a245f;}
  .inv-no{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;}
  .inv-paid{display:inline-block;margin-top:6px;border:2px solid #1f9d55;color:#1f9d55;font-weight:900;padding:2px 10px;border-radius:6px;transform:rotate(-4deg);}
  .inv-cols{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:16px;margin-bottom:18px;}
  .inv-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b6f8f;margin-bottom:3px;}
  .inv-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  .inv-table th{background:#2a245f;color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;text-align:left;border:0;}
  .inv-table td{padding:10px;border-bottom:1px solid #e3e4ee;color:#1c1f3a;font-size:13px;}
  .inv-table .num{text-align:right;}
  .inv-sub{color:#6b6f8f;font-size:12px;}
  .inv-total td{font-weight:900;font-size:16px;border-bottom:0;background:#fdf6d3;}
  .inv-pay{background:#f4f5fa;border-left:4px solid #f5d12f;padding:12px 14px;border-radius:6px;}
  .inv-pay table{border-collapse:collapse;margin:6px 0 8px;}
  .inv-pay td{padding:3px 18px 3px 0;border:0;font-size:13px;color:#1c1f3a;}
  .inv-pay p{margin:0;font-size:12px;color:#4a4e6d;}
  .inv-ref{font-family:ui-monospace,Menlo,Consolas,monospace;background:#fdf6d3;padding:1px 6px;border-radius:4px;}
  .inv-foot{margin-top:18px;text-align:center;font-size:11px;color:#6b6f8f;}
  #print-area{display:none;}
  @media print{
    @page{size:A4;margin:12mm;}
    body{background:#fff !important;}
    .app, .modal-bg{display:none !important;}
    #print-area{display:block;}
    #print-area .inv{min-width:0;padding:0;}
  }
</style>
</head>

function currentSeason(d = new Date()){
  const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;   // Sept starts the year

function nextSeason(s){ const y = +s.slice(0,4) + 1; return y + '/' + String(y + 1).slice(2); }

/* ---------- Club Hub access codes (must match ngl-schools-hub.html) ----------
   One code per club, shared with all its Schools families, e.g. SAADI-7K4P.
   Prefix from the club name, then 4 characters with no look-alikes. */
const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function codePrefix(name){
  const words = String(name).toUpperCase().replace(/[^A-Z ]/g,'').split(/\s+/)
    .filter(w => w && !['GYMNASTICS','GYMNASTIC','GYM','CLUB','THE','ACADEMY','OF','AND'].includes(w));
  return (words[0] || 'NGL').slice(0, 10).padEnd(2, 'X');
}
function newAccessCode(clubName){
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  return codePrefix(clubName) + '-' + Array.from(r, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join('');
}

function lastYearTotal(){
  const prev = (+S.season.slice(0,4) - 1) + '/' + S.season.slice(2,4);
  return S.orders.filter(o => o.season === prev && (o.type || 'licence') === 'licence').reduce((a,o) => a + o.qty, 0);
}
function currentPrice(){
  const fixed = S.club && S.club.bands && S.club.bands[S.season];
  if(fixed) return fixed;
  const ly = lastYearTotal();
  return ly ? bandFor(ly).price : null;
}
function orderRef(){
  const r = new Uint32Array(5); crypto.getRandomValues(r);

}
function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'That email and password don’t match. Please try again.';
  if(c.includes('email-already-in-use')) return 'There’s already a club account with that email. Try logging in instead.';
  if(c.includes('weak-password')) return 'Please choose a password of at least 8 characters.';
  if(c.includes('invalid-email')) return 'Please check the email address.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes and try again.';
  if(c.includes('network')) return 'We couldn’t connect. Please check your internet connection.';
  return 'Something went wrong. Please try again.';
}

/* ---------- Firebase ---------- */
let FB = null;
async function fb(){
  if(FB) return FB;
  const v = '10.12.2';
  const [app, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  FB = {auth, fs, A: auth.getAuth(a), D: fs.getFirestore(a)};
  return FB;
}
async function loadClubData(uid){
  const {fs, D} = await fb();
  S.uid = uid;
  const [clubSnap, adminSnap, schoolsSnap, ordersSnap, eventsSnap] = await Promise.all([
    fs.getDoc(fs.doc(D, 'clubs', uid)),
    fs.getDoc(fs.doc(D, 'admins', uid)).catch(() => null),
    fs.getDocs(fs.collection(D, 'clubs', uid, 'schools')),
    fs.getDocs(fs.query(fs.collection(D, 'orders'), fs.where('clubId', '==', uid))),
    fs.getDocs(fs.query(fs.collection(D, 'events'), fs.where('clubId', '==', uid))).catch(() => ({docs:[]}))
  ]);
  S.events = eventsSnap.docs.map(d => ({id:d.id, ...d.data()}));
  S.club = clubSnap.exists() ? {bands:{}, ...clubSnap.data()} : null;
  S.isAdmin = !!(adminSnap && adminSnap.exists());
  S.schools = schoolsSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
  S.orders = ordersSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => (a.createdAt?.seconds||0) - (b.createdAt?.seconds||0));
}
async function claimNewCode(clubName, active, clubId){
  clubId = clubId || S.uid;
  const {fs, D} = await fb();
  for(let i = 0; i < 6; i++){
    const code = newAccessCode(clubName);
    const ref = fs.doc(D, 'accessCodes', code);
    const snap = await fs.getDoc(ref);
    if(snap.exists()) continue;
    await fs.setDoc(ref, {clubId, clubName, season:S.season, status: active ? 'active' : 'inactive', createdAt: fs.serverTimestamp()});
    return code;
  }
  throw new Error('Could not create a club code');
}

const liveApi = {
  async restore(){
    const {auth, A} = await fb();
    return new Promise(res => {
      const off = auth.onAuthStateChanged(A, async user => {
        off();
        if(!user){ res(false); return; }
        try{ await loadClubData(user.uid); res(!!S.club || S.isAdmin); }catch(e){ res(false); }

  async signIn(email, password){

  async orderLicences(schoolId, qty){

    await fs.setDoc(fs.doc(D, 'orders', id), {...o, createdAt:fs.serverTimestamp()});
    const local = {id, ...o, createdAt:new Date()}; S.orders.push(local); return local;
  },
  async orderGraduation(ev, qty){
    const {fs, D} = await fb();
    const id = orderRef();
    const o = {type:'graduation', clubId:S.uid, clubName:S.club.name, eventId:ev.id, eventTitle:ev.title || 'NGL Schools Graduation', eventDate:ev.date || '',
               schoolId:ev.schoolId || '', schoolName:'Graduation ' + evDateShort(ev), qty, price:GRAD_NGL_FEE, season:S.season, status:'awaiting-payment'};
    await fs.setDoc(fs.doc(D, 'orders', id), {...o, createdAt:fs.serverTimestamp()});
    const local = {id, ...o, createdAt:new Date()}; S.orders.push(local); return local;
  },
  async newCode(){
    const {fs, D} = await fb();
    const old = S.club.accessCode;
    const code = await claimNewCode(S.club.name, !!S.club.codeActive);
    await fs.updateDoc(fs.doc(D, 'clubs', S.uid), {accessCode:code});
    if(old) await fs.deleteDoc(fs.doc(D, 'accessCodes', old)).catch(() => {});
    S.club.accessCode = code; return code;
  },
  async saveEvent(id, d){
    const {fs, D} = await fb();
    const data = {...d, clubId:S.uid, clubName:S.club.name, updatedAt:fs.serverTimestamp()};
    if(id){ await fs.updateDoc(fs.doc(D, 'events', id), data); Object.assign(S.events.find(e => e.id === id), d); }
    else { const ref = await fs.addDoc(fs.collection(D, 'events'), {...data, createdAt:fs.serverTimestamp()}); S.events.push({id:ref.id, ...d}); }
  },
  async deleteEvent(id){
    const {fs, D} = await fb();
    await fs.deleteDoc(fs.doc(D, 'events', id));

  },

  async adminUpdateClub(club, d, regenerate){

      await fs.updateDoc(fs.doc(D, 'accessCodes', club.accessCode), {clubName:d.name}).catch(() => {});

  async adminLoad(){

    };

    await fs.updateDoc(fs.doc(D, 'clubs', clubId), new fs.FieldPath('bands', season), price);
  }

function seasonOrders(){ return S.orders.filter(o => o.season === S.season && isLicence(o)); }
function counts(){
  const O = seasonOrders();
  const active = O.filter(o => o.status === 'paid').reduce((a,o) => a + o.qty, 0);
  const pending = O.filter(o => o.status !== 'paid').reduce((a,o) => a + o.qty, 0);
  return {total:active + pending, active, pending};
}
function schoolCount(id){ return seasonOrders().filter(o => o.schoolId === id).reduce((a,o) => a + o.qty, 0); }
function codeLive(){ return !!S.club.codeActive; }
function hubLink(){ return PARENT_HUB_URL + '?code=' + encodeURIComponent(S.club.accessCode); }

  const m = modal(`<h2>${isAdminEdit ? 'Edit club' : 'Edit club details'}</h2>

      <label class="note" style="display:flex;gap:10px;align-items:flex-start;margin:4px 0 6px"><input type="checkbox" id="eregen" style="margin-top:3px"> Also give the club a new Hub code based on this name</label>
      <p class="note" id="eregenNote" style="margin:0 0 14px">Current code: <b class="mono">${esc(club.accessCode || '')}</b>. Only change it if the old code hasn’t been shared with families yet, because the old code stops working.</p>
      <p class="error" id="ecErr"></p>
      <div class="btn-row"><button class="btn" type="submit">Save</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
    </form>`);
  const nameIn = m.querySelector('#ecn');
  const regen = m.querySelector('#eregen');
  const tick = () => { if(codePrefix(nameIn.value) !== String(club.accessCode || '').split('-')[0]) regen.checked = true; };
  nameIn.addEventListener('input', tick);
  m.querySelector('#ecf').addEventListener('submit', async e => {
    e.preventDefault();
    const d = {name:nameIn.value.trim(), bgNumber:m.querySelector('#ebg').value.trim(), contact:m.querySelector('#ect').value.trim()};
    if(isAdminEdit) d.email = m.querySelector('#eem').value.trim();
    const btn = m.querySelector('button[type=submit]'); btn.disabled = true; btn.textContent = 'Saving…';
    try{
      if(isAdminEdit) await api.adminUpdateClub(club, d, regen.checked);
      else { await api.updateClub(d); if(regen.checked) await api.newCode(); }
      m.remove();
      if(isAdminEdit) screenAdmin(); else show();
    }catch(err){ console.error(err); btn.disabled = false; btn.textContent = 'Save'; m.querySelector('#ecErr').textContent = 'Couldn’t save. Please try again.'; }
  });
}

function modal(html){
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('click', e => { if(e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); return bg;
}

async function copyText(text, note){

  catch(e){ const ta = document.createElement('textarea'); ta.value = text; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(_){} ta.remove(); }

}

async function emailInvoice(o, club){
  if(!club || !club.email) throw new Error('No email address for this club');
  const res = await fetch('https://api.emailjs.com/api/v1.0/email/send', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      service_id: EMAILJS.serviceId, template_id: EMAILJS.templateId, user_id: EMAILJS.publicKey,
      template_params: {
        to_email: club.email,
        to_name: club.contact || club.name || '',
        subject: `NGL Schools invoice ${o.id} – ${gbp(o.qty * o.price)}`,
        invoice_html: invoiceEmailHTML(o, club)
      }
    })
  });
  if(!res.ok) throw new Error('Email failed: ' + res.status + ' ' + (await res.text()));
}

let CURRENT_INVOICE = null;
function showInvoice(o, club){
  document.getElementById('print-area').innerHTML = invoiceHTML(o, club);
  const m = modal(`<div class="inv-screen">${invoiceHTML(o, club)}</div>
    <div class="btn-row" style="margin-top:14px"><button class="btn" data-act="print-invoice">Download / print PDF</button><button class="btn ghost" data-act="email-invoice">Email invoice</button><button class="btn ghost" data-close>Close</button></div>
    <p class="note" id="invMailNote" style="margin:10px 0 0;min-height:1em"></p>`);
  CURRENT_INVOICE = {o, club};
  m.querySelector('.modal').classList.add('modal-wide');
}

/* ---------- Events ---------- */
document.addEventListener('click', async e => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if(go){ e.preventDefault(); const g = go.dataset.go; if(g==='login') screenLogin(); else if(g==='register') screenRegister(); else screenLanding(); window.scrollTo(0,0); return; }
  const nt = t.closest('[data-tab]');
  if(nt){ tab = nt.dataset.tab; show(); return; }
  const act = t.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a === 'signout'){ await api.signOut(); signedIn = false; S.club = null; S.isAdmin = false; ADMIN_MODE ? screenLogin() : screenLanding(); }
  else if(a === 'add-school') addSchoolModal();
  else if(a === 'order') orderModal(act.dataset.school);
  else if(a === 'copy-msg') copyText(parentMessage(), 'Message copied. Paste it into your letter, email or WhatsApp.');
  else if(a === 'copy-link') copyText(hubLink(), 'Link copied.');
  else if(a === 'new-code'){
    if(act.dataset.armed){ await api.newCode(); show(); const n = document.getElementById('copyNote'); if(n) n.textContent = 'New code created. The old code no longer works, so share the new one with your families.'; }
    else { act.dataset.armed = '1'; act.textContent = 'Tap again to confirm'; const n = document.getElementById('copyNote'); if(n) n.textContent = 'Changing your code stops the old one working for every family. Only do this if it has been shared outside your club.'; }
  }
  else if(a === 'reset'){
    const em = (document.getElementById('em') || {}).value || '';
    const err = document.getElementById('err');
    if(!em.trim()){ if(err) err.textContent = 'Type your email above, then tap “Forgotten your password?” again.'; return; }
    const r = await api.resetPassword(em.trim());
    if(err){ err.style.color = r.ok ? 'var(--ok)' : ''; err.textContent = r.ok ? 'If there’s a club account for that email, a reset link is on its way.' : r.reason; }
  }
  else if(a === 'add-grad'){ gradModal(null); }
  else if(a === 'order-medals'){ const ev = S.events.find(e => e.id === act.dataset.ev); if(ev) medalsModal(ev); }
  else if(a === 'edit-grad'){ gradModal(S.events.find(e => e.id === act.dataset.ev)); }
  else if(a === 'del-grad'){
    if(act.dataset.armed){ act.disabled = true; try{ await api.deleteEvent(act.dataset.ev); show(); }catch(err){ console.error(err); act.disabled = false; act.textContent = 'Failed, retry'; } }
    else { act.dataset.armed = '1'; act.textContent = 'Tap again to delete'; }
  }
  else if(a === 'edit-club'){ editClubModal(S.club, false); }
  else if(a === 'adm-edit-club'){ const c = ADM.clubs.find(x => x.id === act.dataset.club); if(c) editClubModal(c, true); }
  else if(a === 'invoice'){
    const o = S.orders.find(x => x.id === act.dataset.order); if(o) showInvoice(o, S.club || {});
  }
  else if(a === 'adm-invoice'){
    const o = ADM.orders.find(x => x.id === act.dataset.order); if(!o) return;
    showInvoice(o, ADM.clubs.find(x => x.id === o.clubId) || {name:o.clubName});
  }
  else if(a === 'print-invoice'){ window.print(); }
  else if(a === 'email-invoice' && CURRENT_INVOICE){
    const n = document.getElementById('invMailNote'); const to = CURRENT_INVOICE.club.email;
    if(!FIREBASE_CONFIG){ if(n) n.textContent = 'Preview mode: no email sent.'; return; }
    act.disabled = true; if(n){ n.style.color = ''; n.textContent = 'Sending to ' + (to || '') + '…'; }
    try{ await emailInvoice(CURRENT_INVOICE.o, CURRENT_INVOICE.club); if(n){ n.style.color = 'var(--ok)'; n.textContent = '✓ Emailed to ' + to + ' (copy to NGL).'; } }
    catch(err){ console.error(err); if(n) n.textContent = 'Couldn’t send the email. Please try again later.'; }
    act.disabled = false;
  }
  else if(a === 'adm-paid'){
    const o = ADM.orders.find(x => x.id === act.dataset.order); if(!o) return;
    const c = ADM.clubs.find(x => x.id === o.clubId) || {id:o.clubId};
    act.disabled = true; act.textContent = 'Saving…';
    try{ await api.adminMarkPaid(o, c); if(FIREBASE_CONFIG && o.clubId === S.uid) await loadClubData(S.uid); screenAdmin(); }
    catch(e){ act.disabled = false; act.textContent = 'Failed, tap to retry'; console.error(e); }
  }
});
