<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E88230">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-64.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NGL Recreational">
<title>NGL Recreational Hub</title>
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --rec:#E88230; --rec-ink:#2a1405; --gold:#f2a900; --ok:#5fd38d; --warn:#ffb454; --bad:#ff8a95;
    --ruby:#C8194A; --pink:#E0559C; --teal:#0FA3A8; --indigo:#5A55C8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;}
  button,input,select{font:inherit;color:inherit;}
  a{color:var(--rec);}
  .wrap{max-width:1100px;margin:0 auto;padding:0 16px;}

  .topbar{position:relative;z-index:30;background:var(--rec);width:100vw;margin-left:calc(50% - 50vw);}
  .topbar-strap{text-align:center;color:var(--rec-ink);font-weight:800;font-size:13px;letter-spacing:.02em;padding:calc(7px + env(safe-area-inset-top,0px)) 16px 7px;}
  .topbar-in{background:linear-gradient(180deg,#2a245f 0%,#2a245f 40%,var(--navy) 100%);border-top-right-radius:120px 38px;padding-bottom:18px;}
  @media(min-width:700px){.topbar-in{border-top-right-radius:220px 46px;}}
  .topbar-row{display:flex;align-items:center;gap:12px;min-height:66px;}
  .logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--white);}
  .logo img{height:50px;width:auto;display:block;}
  @media(min-width:700px){.logo img{height:58px;}}
  .logo-mark{font-weight:900;font-size:22px;letter-spacing:.02em;line-height:1;}
  .logo-mark small{display:block;font-size:11px;letter-spacing:.22em;color:var(--rec);font-weight:800;margin-top:3px;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  @media(max-width:600px){.top-actions .pill{display:none;}}
  .pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;background:var(--rec);color:var(--rec-ink);white-space:nowrap;}

  .navtabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 0 12px;}
  .navtabs::-webkit-scrollbar{display:none;}
  .navtab{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:var(--navy-3);font-weight:700;font-size:14px;cursor:pointer;}
  .navtab.active{background:var(--rec);border-color:var(--rec);color:var(--rec-ink);}
  .navtab.locked{opacity:.55;}

  main{padding:18px 0 60px;}
  .screen{animation:fadein .2s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.screen{animation:none;}}

  h1{font-size:clamp(28px,5vw,44px);line-height:1.08;margin:0 0 12px;font-weight:900;letter-spacing:-.015em;text-wrap:balance;}
  h2{font-size:22px;margin:0 0 10px;font-weight:850;text-wrap:balance;}
  h3{font-size:16px;margin:0 0 6px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--rec);font-weight:800;margin:0 0 10px;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;}
  .grid2{display:grid;grid-template-columns:1fr;gap:16px;}
  .grid3{display:grid;grid-template-columns:1fr;gap:14px;}
  .grid4{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:760px){.grid2{grid-template-columns:1fr 1fr;}.grid3{grid-template-columns:repeat(3,1fr);}.grid4{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1000px){.grid4{grid-template-columns:repeat(4,1fr);}}
  .grid2>*,.grid3>*,.grid4>*{min-width:0;}
  .section{margin:30px 0 0;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;border:0;cursor:pointer;background:var(--rec);color:var(--rec-ink);font-weight:900;font-size:15px;text-decoration:none;}
  .btn:active{transform:scale(.98);}
  .btn:focus-visible,.navtab:focus-visible,.chip:focus-visible{outline:3px solid var(--white);outline-offset:2px;}
  .btn.ghost{background:transparent;color:var(--white);border:1px solid var(--line);font-weight:700;}
  .btn.small{padding:8px 12px;font-size:13px;border-radius:10px;}
  .btn.block{width:100%;}
  .btn[disabled]{opacity:.55;cursor:default;}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}

  .hero{display:grid;grid-template-columns:1fr;gap:24px;align-items:center;padding:14px 0 6px;}
  @media(min-width:820px){.hero{grid-template-columns:1.3fr .7fr;}}
  .lead{font-size:18px;color:var(--muted);}
  .levels-art{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .lvtile{border-radius:16px;padding:18px 14px;font-weight:900;font-size:20px;color:#fff;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;}
  .lvtile small{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.04em;}
  .bg-ruby{background:var(--ruby);}.bg-pink{background:var(--pink);}.bg-teal{background:var(--teal);}.bg-indigo{background:var(--indigo);}
  .steps{counter-reset:st;}
  .step{position:relative;padding-left:48px;}
  .step::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:var(--rec);color:var(--rec-ink);display:grid;place-items:center;font-weight:900;}
  .ticks{list-style:none;padding:0;margin:0;}
  .ticks li{padding:7px 0 7px 28px;position:relative;line-height:1.45;}
  .ticks li::before{content:"✓";position:absolute;left:4px;color:var(--rec);font-weight:900;}
  .stat{font-size:34px;font-weight:900;color:var(--rec);line-height:1;}
  .journey{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;}
  .jstep{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .jstep.on{background:var(--rec);border-color:var(--rec);color:var(--rec-ink);}

  table{width:100%;border-collapse:collapse;}
  th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--line);font-size:15px;vertical-align:top;}
  th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;}
  .table-wrap{overflow-x:auto;}
  s.was{color:var(--muted);font-weight:600;margin-right:6px;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px;}
  .input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--navy-2);color:var(--white);font-size:16px;outline:none;}
  .input:focus{border-color:var(--rec);}
  select.input{appearance:auto;}
  .error{color:var(--bad);font-weight:700;font-size:14px;min-height:1em;margin:0 0 10px;}
  .note{font-size:13px;color:var(--muted);}
  .auth{max-width:440px;margin:10px auto 0;}
  .demo-banner{font-size:13px;text-align:center;color:var(--rec-ink);background:var(--warn);border-radius:10px;padding:9px 12px;margin:0 0 16px;font-weight:700;}

  .lic-card{background:linear-gradient(135deg,var(--navy-4),var(--navy-3));position:relative;overflow:hidden;}
  .lic-card::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(232,130,48,.32),transparent 70%);pointer-events:none;}
  .kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
  @media(min-width:760px){.kpis{grid-template-columns:repeat(4,1fr);}}
  .kpi{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .kpi .v{font-size:24px;font-weight:900;font-variant-numeric:tabular-nums;}
  .kpi .l{font-size:12px;color:var(--muted);font-weight:700;margin-top:2px;}
  .tag{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;}
  .tag.ok{background:rgba(95,211,141,.18);color:var(--ok);}
  .tag.wait{background:rgba(255,180,84,.18);color:var(--warn);}
  .tag.off{background:rgba(255,138,149,.16);color:var(--bad);}
  .tag.info{background:rgba(232,130,48,.2);color:var(--rec);}
  .row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;}

  .modal-bg{position:fixed;inset:0;background:rgba(3,8,30,.7);z-index:50;display:grid;place-items:center;padding:16px;}
  .modal{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:22px;width:100%;max-width:520px;max-height:90vh;overflow:auto;}
  .modal-wide{max-width:780px;}
  .sum{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);}
  .sum.total{font-weight:900;font-size:18px;border-bottom:0;}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:40px;}
  .mono{white-space:nowrap;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.04em;}

  /* Content area */
  .toolbar{display:flex;flex-direction:column;gap:10px;margin:0 0 18px;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chips .lbl{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;align-self:center;margin-right:4px;min-width:62px;}
  .chip{padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--navy-2);font-weight:700;font-size:13px;cursor:pointer;}
  .chip.on{background:var(--white);color:var(--navy);border-color:var(--white);}
  .chip.lv-ruby.on{background:var(--ruby);border-color:var(--ruby);color:#fff;}
  .chip.lv-pink.on{background:var(--pink);border-color:var(--pink);color:#fff;}
  .chip.lv-teal.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip.lv-indigo.on{background:var(--indigo);border-color:var(--indigo);color:#fff;}
  .piece{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;margin-bottom:16px;overflow:hidden;}
  .piece-h{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;padding:14px 18px;border-bottom:1px solid var(--line);}
  .piece-h h2{margin:0;font-size:19px;}
  .piece-h .th{color:var(--rec);font-weight:800;}
  .piece-h .su{margin-left:auto;font-size:12px;color:var(--muted);font-weight:700;}
  .intro{padding:10px 18px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);}
  .intro b{color:var(--white);}
  .grid-st{width:100%;border-collapse:collapse;min-width:720px;}
  .grid-st th{padding:9px 12px;font-size:12px;color:#fff;letter-spacing:.06em;}
  .grid-st th.n{background:transparent;color:var(--muted);width:44px;}
  .grid-st td{padding:11px 12px;font-size:14px;line-height:1.45;border-bottom:1px solid var(--line);}
  .grid-st td.n{font-weight:900;color:var(--muted);text-align:center;}
  .grid-st tr:last-child td{border-bottom:0;}
  .grid-st.one{min-width:0;}
  .grid-st.one td{font-size:16px;}
  .chg{display:inline-block;margin-left:6px;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--rec);}
  .final{color:var(--rec);font-weight:800;}
  .asm{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;}
  .apill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 7px 2px 5px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid var(--c);color:var(--white);line-height:1.3;}
  .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .thumb{padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:64px;height:64px;background:var(--navy-2);cursor:zoom-in;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .grid-st.one .thumb{width:96px;height:96px;}
  .apill i{width:8px;height:8px;border-radius:50%;background:var(--c);display:inline-block;flex:0 0 auto;}
  .blockhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;margin:0 0 12px;}
  .blockhead h1{margin:0;font-size:clamp(24px,4vw,34px);}
  .blockhead .muted{font-weight:700;}
  .bookgrid{display:grid;grid-template-columns:1fr;gap:12px;}
  @media(min-width:700px){.bookgrid{grid-template-columns:repeat(2,1fr);}}
  @media(min-width:1000px){.bookgrid{grid-template-columns:repeat(3,1fr);}}
  .bookgrid>*{min-width:0;}
  .skill-list{list-style:none;padding:0;margin:0;}
  .skill-list li{padding:7px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4;}
  .skill-list li:last-child{border-bottom:0;}
  .lvl-band{display:flex;align-items:center;gap:10px;margin:22px 0 10px;}
  .lvl-band .dot{width:12px;height:28px;border-radius:4px;}
  .lvl-band h2{margin:0;font-size:20px;}
  .locked-card{text-align:center;padding:34px 20px;}

  /* Families */
  .fhead{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;border-left:6px solid;padding:4px 0 4px 14px;}
  .fstations{display:flex;flex-direction:column;}
  .fstation{padding:12px 18px;border-bottom:1px solid var(--line);}
  .fstation:last-child{border-bottom:0;}
  .ftext{font-size:15px;line-height:1.45;}
  .flinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;}
  .flink{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;line-height:1.35;}
  .flink.fa{background:var(--c);color:#fff;}
  .flink.fc{background:var(--gold);color:#2a1405;}
  .flink.fb{border:1px solid var(--c);color:var(--white);}
  .legend-f{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:13px;color:var(--muted);margin:0 0 14px;}
  .legend-f .flink{margin-left:6px;}
  /* Invoice */
  .inv-screen{background:#fff;border-radius:12px;padding:6px;overflow-x:auto;}
  .inv{-webkit-print-color-adjust:exact;print-color-adjust:exact;background:#fff;color:#1c1f3a;font-size:13px;line-height:1.45;padding:22px;min-width:560px;}
  .inv-top{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #E88230;padding-bottom:14px;margin-bottom:16px;}
  .inv-brand{font-weight:900;font-size:20px;color:#2a245f;}
  .inv-brand small{display:block;font-size:10px;letter-spacing:.2em;color:#E88230;}
  .inv-title{text-align:right;}
  .inv-h{font-size:26px;font-weight:900;letter-spacing:.08em;color:#2a245f;}
  .inv-no{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;font-size:15px;}
  .inv-paid{display:inline-block;margin-top:6px;border:2px solid #1f9d55;color:#1f9d55;font-weight:900;padding:2px 10px;border-radius:6px;transform:rotate(-4deg);}
  .inv-cols{display:grid;grid-template-columns:1.2fr 1.2fr 1fr;gap:16px;margin-bottom:18px;}
  .inv-label{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#6b6f8f;margin-bottom:3px;}
  .inv-table{width:100%;border-collapse:collapse;margin-bottom:18px;}
  .inv-table th{background:#2a245f;color:#fff;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:8px 10px;text-align:left;border:0;}
  .inv-table td{padding:10px;border-bottom:1px solid #e3e4ee;color:#1c1f3a;font-size:13px;}
  .inv-table .num{text-align:right;}
  .inv-total td{font-weight:900;font-size:16px;border-bottom:0;background:#fdebdc;}
  .inv-pay{background:#f4f5fa;border-left:4px solid #E88230;padding:12px 14px;border-radius:6px;}
  .inv-pay table{border-collapse:collapse;margin:6px 0 8px;width:auto;}
  .inv-pay td{padding:3px 18px 3px 0;border:0;font-size:13px;color:#1c1f3a;}
  .inv-pay p{margin:0;font-size:12px;color:#4a4e6d;}
  .inv-foot{margin-top:18px;text-align:center;font-size:11px;color:#6b6f8f;}

  /* Print sheets */
  #print-area{display:none;}
  .sheet{background:#fff;color:#111;font-size:12px;}
  .sheet h2{color:#111;font-size:18px;margin:0 0 4px;}
  .sheet p{color:#333;margin:0 0 10px;}
  .sheet table{border-collapse:collapse;width:100%;}
  .sheet th,.sheet td{border:1px solid #999;padding:5px 6px;font-size:11px;color:#111;vertical-align:top;}
  .sheet th{background:#eee;letter-spacing:0;text-transform:none;}
  .sheet.compact .onepage{break-inside:avoid;}
  .sheet.compact h2{font-size:15px;}
  .sheet.compact td,.sheet.compact th{font-size:9.5px;padding:3px 5px;line-height:1.3;}
  .sheet.compact .st{font-weight:700;margin-top:2px;}
  .sheet .foot{font-size:9px;color:#555;margin-top:6px;}
  .sheet .pc{background:#f6e2d2;font-weight:800;}
  @media print{
    @page{size:A4 landscape;margin:10mm;}
    body{background:#fff !important;}
    .app,.modal-bg{display:none !important;}
    #print-area{display:block;}
    #print-area .inv{min-width:0;padding:0;}
  }


  /* ---------- Branded print sheets ---------- */
  .print-wait{position:fixed;left:50%;top:20px;transform:translateX(-50%);z-index:100;background:var(--rec);color:var(--rec-ink);font-weight:800;padding:10px 16px;border-radius:999px;}
  .sheet .brand{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  .sheet .ph-head{display:flex;align-items:center;gap:14px;background:#0a1440;color:#fff;border-radius:8px;padding:8px 14px;border-bottom:4px solid #E88230;margin-bottom:6px;}
  .sheet .ph-logo{height:34px;width:auto;display:block;}
  .sheet .ph-title{flex:1;min-width:0;}
  .sheet .ph-wk{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#E88230;}
  .sheet .ph-pc{font-size:17px;font-weight:900;color:#fff;line-height:1.2;}
  .sheet .ph-meta{font-size:9.5px;color:#b7c1e6;text-align:right;line-height:1.35;}
  .sheet .ph-strip{display:grid;gap:5px;margin-bottom:6px;}
  .sheet .ph-shot{position:relative;height:40mm;border-radius:6px;overflow:hidden;background:#eef0f6;border:1px solid #d5d9e6;}
  .sheet .ph-shot img{width:100%;height:100%;object-fit:cover;display:block;}
  .sheet .ph-none{display:grid;place-items:center;height:100%;color:#888;font-size:9px;}
  .sheet .ph-n{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#E88230;color:#2a1405;font-weight:900;font-size:10.5px;}
  .sheet .ph-shot .ph-n{position:absolute;top:4px;left:4px;box-shadow:0 1px 3px rgba(0,0,0,.4);}
  .sheet.compact .brand th{color:#2a1405;font-size:10px;border-color:#d9b89c;}
  .sheet.compact .brand th span{font-weight:400;}
  .sheet.compact .brand td{border-color:#d5d9e6;font-size:10.5px;padding:4px 6px;}
  .sheet .brand .ph-stn{width:24px;text-align:center;background:#0a1440 !important;color:#fff !important;}
  .sheet.compact .brand .st{border-left:3px solid;border-radius:3px;padding:1px 4px;margin-top:3px;font-weight:700;}
  .sheet .ph-foot{display:flex;justify-content:space-between;font-size:8.5px;color:#555;margin-top:5px;}


  /* ---------- Your group picker ---------- */
  .grpcard{background:var(--navy-3);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0 6px;}
  .grpcard h2{font-size:19px;margin:0 0 4px;}
  .grpcard .muted{margin:0 0 12px;font-size:14px;}
  .grprow{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  @media(min-width:600px){.grprow{grid-template-columns:repeat(4,1fr);}}
  .grpbox{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:64px;padding:12px 14px;border-radius:14px;border:2px solid var(--c);background:transparent;color:var(--white);cursor:pointer;text-align:left;}
  .grpbox.on{background:var(--c);}
  .grpbox .grp-name{font-size:18px;font-weight:900;}
  .grpbox .grp-rung{font-size:14px;font-weight:800;}

<script>
/* =====================================================================
   NGL Recreational: club plan generator (shared by the Hub and Families)
   Input: NGL content + the club's term settings. Output: the club's own
   fortnights, each with its apparatus and stations, plus a coverage report.
   ===================================================================== */
const PLAN_WEEK_A = ['FF','VT','BM'], PLAN_WEEK_B = ['BF','BA','FT'];
const CLASS_RULES = {
  45: {warm:8, cool:4, rot:11, cap:4, stretch:1},
  60: {warm:10, cool:5, rot:15, cap:6, stretch:0},
  75: {warm:10, cool:5, rot:20, cap:8, stretch:0}
};
const PIECE_OPTS = {
  VT: [['table','Vault table'],['block','Block only'],['none','No vault']],
  BM: [['beam','High, medium or low beam'],['floor','Floor beam or bench'],['none','No beam']],
  BA: [['bars','Bars'],['none','No bars']],
  FT: [['fasttrack','Fast track and trampette'],['tramp','Trampette only']]
};
function planDefaults(t){
  t = t || {};
  return {start: t.start || '', weeks: +t.weeks || 14, halfTerm: t.halfTerm || '', classLen: +t.classLen || 60,
    pieces: Object.assign({VT:'table', BM:'beam', BA:'bars', FT:'fasttrack'}, t.pieces || {}), startBlock: 1, custom: !!t.custom};
}
function stationCps(s){
  const out = [];
  Object.keys(s.assess || {}).forEach(c => (s.assess[c] || []).forEach(y => out.push(y.p + '|' + y.L + '|' + y.s)));
  return out;
}
function buildClubPlan(content, term){
  const t = planDefaults(term), rule = CLASS_RULES[t.classLen] || CLASS_RULES[60];
  const src = content.plan.blocks, teach = src.filter(b => !b.assessment), assessB = src.find(b => b.assessment);
  const removed = Object.keys(t.pieces).filter(k => t.pieces[k] === 'none');
  const has = c => !removed.includes(c);
  const noBars = !has('BA');
  // Week B with no bars: two longer rotations
  const capFor = code => {
    if(noBars && PLAN_WEEK_B.includes(code)){ const len = (t.classLen - rule.warm - rule.cool) / 2; return Math.max(4, Math.min(8, Math.round(len / 3))); }
    return rule.cap;
  };
  const T = t.weeks - 2, F = Math.floor(T / 2), odd = T % 2 === 1;
  // fortnight slots per piece; Week A pieces get the odd week too
  const slotsFor = code => F + (odd && PLAN_WEEK_A.includes(code) ? 1 : 0);
  // map NGL teaching blocks (1..6) onto this club's slots
  const mapBlock = (bn, nSlots) => Math.min(nSlots - 1, Math.floor((bn - 1) * nSlots / teach.length));
  const codes = [...PLAN_WEEK_A, ...PLAN_WEEK_B].filter(has);
  // candidates per piece, each with a home slot
  const cand = {};
  codes.forEach(code => {
    const n = slotsFor(code); cand[code] = [];
    teach.forEach(b => { const p = b.pieces.find(x => x.code === code); if(!p) return;
      p.stations.forEach(s => cand[code].push({b, p, s, home: mapBlock(b.n, n), cps: stationCps(s)})); });
  });
  // checkpoints the full NGL plan teaches on the apparatus this club has
  const required = new Set();
  codes.forEach(code => cand[code].forEach(x => x.cps.forEach(c => { if(!(noBars && c.startsWith('Bars|'))) required.add(c); })));
  // greedy cover: a station goes in its home fortnight, or the one either side if that is full
  const chosen = {}, used = {}, covered = new Set();
  codes.forEach(code => { chosen[code] = Array.from({length: slotsFor(code)}, () => []); used[code] = new Set(); });
  const room = (code, k, extra) => k >= 0 && k < slotsFor(code) && chosen[code][k].length < capFor(code) + extra;
  for(;;){
    let best = null, gain = 0;
    codes.forEach(code => cand[code].forEach((x, i) => {
      if(used[code].has(i)) return;
      const g = x.cps.filter(c => required.has(c) && !covered.has(c)).length;
      if(g <= gain) return;
      const k = [x.home, x.home + 1, x.home - 1, x.home + 2, x.home - 2].find(k => room(code, k, rule.stretch));
      if(k === undefined) return;
      gain = g; best = [code, i, k];
    }));
    if(!best) break;
    const [code, i, k] = best; used[code].add(i); chosen[code][k].push(i); cand[code][i].cps.forEach(c => covered.add(c));
  }
  // fill with progressions from each fortnight's own themes, in authored order
  codes.forEach(code => chosen[code].forEach((list, k) => {
    cand[code].forEach((x, i) => { if(x.home === k && !used[code].has(i) && list.length < capFor(code)){ used[code].add(i); list.push(i); } });
  }));
  // assemble fortnights
  const blocks = [];
  const nSlots = Math.max(F + (odd ? 1 : 0), 1);
  for(let k = 0; k < nSlots; k++){
    const isOdd = odd && k === F;
    const w1 = 2 * k + 1;
    const pieces = [];
    codes.forEach(code => {
      if(isOdd && !PLAN_WEEK_A.includes(code)) return;
      const pick = (chosen[code][k] || []).slice().sort((a, b) => a - b).map(i => cand[code][i]);
      if(!pick.length) return;
      const own = pick.filter(x => x.home === k), themes = [...new Set((own.length ? own : pick).map(x => x.p.theme))];
      const first = pick[0].p;
      pieces.push({code, piece: first.piece, theme: themes.join(' + '), setup: first.setup, intro: first.intro,
        stations: pick.map((x, j) => Object.assign({}, x.s, {n: j + 1, from: x.b.n}))});
    });
    const srcBlocks = [...new Set(teach.filter(b => codes.some(c => mapBlock(b.n, slotsFor(c)) === k)).map(b => b.n))];
    blocks.push({n: k + 1, label: isOdd ? 'Week ' + w1 : 'Fortnight ' + (k + 1), weeks: isOdd ? 'Week ' + w1 : `Weeks ${w1} & ${w1 + 1}`,
      assessment: false, odd: isOdd, warm: Math.max(0, (srcBlocks[0] || 1) - 1), pieces});
  }
  blocks.push({n: nSlots + 1, label: 'Assessment', weeks: `Weeks ${t.weeks - 1} & ${t.weeks}`, assessment: true, odd: false,
    warm: content.warmups.length - 1,
    pieces: assessB.pieces.filter(p => has(p.code)).map(p => Object.assign({}, p, {stations: p.stations.slice(0, capFor(p.code)).map((s, j) => Object.assign({}, s, {n: j + 1}))}))});
  // coverage report by book
  const byBook = [0,1,2,3].map(() => ({need:0, got:0, missing:[]}));
  required.forEach(c => { const [p, L, s] = c.split('|'); const b = byBook[Math.ceil(+L / 4) - 1]; if(!b) return;
    b.need++; if(covered.has(c)) b.got++; else b.missing.push({p, L:+L, s}); });
  const adapted = [];
  if(t.pieces.BM === 'floor') adapted.push('Beam skills are taught and assessed on a floor beam or bench, and marked adapted.');
  if(t.pieces.VT === 'block') adapted.push('Vault skills are taught on a block instead of a vault table.');
  if(t.pieces.FT === 'tramp') adapted.push('Fast Track stations run on the trampette with a run of panel mats.');
  const key4 = ['VT','BM','BA'].filter(c => removed.includes(c));
  return {settings: t, rule, blocks, coverage: byBook, removed, adapted,
    twoPiece: key4.length > 0, noBars, F, odd};
}
// Which club week is it? Half-term week is skipped.
function clubWeekNow(term, plan, today){
  const t = planDefaults(term);
  if(!t.start) return null;
  const day = 86400000, start = new Date(t.start + 'T00:00:00'), now = today || new Date();
  let wk = Math.floor((now - start) / (7 * day)) + 1;
  let half = false;
  if(t.halfTerm){
    const hw = Math.floor((new Date(t.halfTerm + 'T00:00:00') - start) / (7 * day)) + 1;
    if(wk === hw) half = true; else if(wk > hw) wk -= 1;
  }
  if(wk < 1 || wk > t.weeks) return {wk, W:t.weeks, outside:true};
  if(half) return {wk, W:t.weeks, half:true};
  const blocks = plan.blocks;
  if(wk > t.weeks - 2) return {wk, W:t.weeks, block: blocks[blocks.length - 1].n, week: wk === t.weeks - 1 ? 'A' : 'B'};
  const k = Math.floor((wk - 1) / 2);
  const b = blocks[Math.min(k, blocks.length - 2)];
  return {wk, W:t.weeks, block: b.n, week: b.odd ? 'A' : ((wk - 1) % 2 === 0 ? 'A' : 'B')};
}

/* =====================================================================
   NGL RECREATIONAL — CLUB HUB
   ---------------------------------------------------------------------
   Uses the same Firebase project and club accounts as NGL Schools, so a
   club has one NGL login. Recreational is its own licence on that

   The lesson plan, warm-ups and books are NOT in this file. NGL Admin

   Firestore behind the security rules (see firestore.rules).

   ===================================================================== */

/* ---------- Pricing (edit here) ----------
   One yearly Club Licence per club, banded by size. It runs 12 months from the day it is
   activated. Books, medals and t-shirts are bought through the Hub while the licence is active.
   Each band can buy books up to 10% above its top gymnast number in a licence year; past that
   the club upgrades to the next band for the difference. */
const CLUB_BANDS = [
  {key:'s', label:'Up to 99 recreational gymnasts',  short:'Under 100', price:500,  books:110},
  {key:'m', label:'100 to 399 recreational gymnasts', short:'100–399',  price:1000, books:440},
  {key:'l', label:'400 or more recreational gymnasts', short:'400+',    price:1500, books:null}   // null = no limit
];

  {kind:'book',   name:'Recreational award book',  price:5,  rrp:'£10',      note:'Lasts more than a year (4 levels)'},
  {kind:'medal',  name:'Recreational medal',       price:3, rrp:'£5',       note:'One per gymnast each term'},
  {kind:'tshirt', name:'NGL children’s t-shirt',   price:12, rrp:'£17 to £20', note:''}
];

/* ---------- Season / terms ---------- */
function currentSeason(d = new Date()){
  const y = d.getMonth() >= 8 ? d.getFullYear() : d.getFullYear() - 1;
  return y + '/' + String(y + 1).slice(2);
}
function currentTermKey(d = new Date()){
  const m = d.getMonth();
  return m >= 8 ? 'autumn' : (m <= 2 ? 'spring' : 'summer');
}
// A licence runs 12 months from activation. A renewal paid early starts when the current one ends.
function addYear(d){ const x = new Date(d); x.setFullYear(x.getFullYear() + 1); return x; }
function licenceExpiry(rec, now = new Date()){
  const cur = rec && rec.expires ? toDate(rec.expires) : null;
  return addYear(cur && cur > now ? cur : now);
}
const clubFee = band => (CLUB_BANDS.find(x => x.key === band) || CLUB_BANDS[0]).price;
const shopItem = k => SHOP.find(x => x.kind === k);
// Adds a VAT line when NGL is VAT registered
function withVat(lines){
  if(!VAT_RATE) return lines;
  const net = lines.reduce((a, l) => a + l.qty * l.unit, 0);
  return [...lines, {kind:'vat', desc:`VAT at ${Math.round(VAT_RATE * 100)}%`, qty:1, unit:Math.round(net * VAT_RATE * 100) / 100}];
}
/* Book allowance: books in the order that started or renewed the licence, and every order since. */
function bookAllowance(club, orders){
  const band = (CLUB_BANDS.find(b => b.key === (club.rec && club.rec.band)) || CLUB_BANDS[0]);
  const lic = orders.filter(o => o.kind === 'start' || o.kind === 'renew').sort((a,b) => toDate(b.createdAt) - toDate(a.createdAt))[0];
  const from = lic ? toDate(lic.createdAt) : new Date(0);
  const used = orders.filter(o => toDate(o.createdAt) >= from)
    .reduce((a, o) => a + (o.lines || []).filter(l => l.kind === 'book').reduce((x, l) => x + l.qty, 0), 0);
  return {band, used, limit: band.books, left: band.books == null ? Infinity : Math.max(0, band.books - used)};
}
// Upgrade = the difference between the two bands, pro-rata for the whole months left on the licence
function monthsRemaining(rec, now = new Date()){
  if(!rec || !rec.expires) return 12;
  const e = toDate(rec.expires); let m = (e.getFullYear() - now.getFullYear()) * 12 + (e.getMonth() - now.getMonth());
  if(e.getDate() > now.getDate()) m += 1;          // part month counts as a month
  return Math.max(1, Math.min(12, m));
}
function upgradeCost(fromKey, toKey, rec){
  const a = CLUB_BANDS.find(b => b.key === fromKey) || CLUB_BANDS[0], b = CLUB_BANDS.find(x => x.key === toKey) || a;
  return Math.round((b.price - a.price) * monthsRemaining(rec) / 12 * 100) / 100;
}
const nextBand = key => CLUB_BANDS[Math.min(CLUB_BANDS.length - 1, CLUB_BANDS.findIndex(b => b.key === key) + 1)];

const CODE_ALPHABET = '23456789ABCDEFGHJKMNPQRSTUVWXYZ';
function orderRef(){
  const r = new Uint32Array(5); crypto.getRandomValues(r);
  return 'ORD-' + Array.from(r, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join('');
}
/* NGL Schools needs every club to hold a (switched-off) Schools code, so a
   club that registers here can still open the Schools Club Hub later. */
function codePrefix(name){
  const words = String(name).toUpperCase().replace(/[^A-Z ]/g,'').split(/\s+/)
    .filter(w => w && !['GYMNASTICS','GYMNASTIC','GYM','CLUB','THE','ACADEMY','OF','AND'].includes(w));
  return (words[0] || 'NGL').slice(0, 10).padEnd(2, 'X');
}
function newAccessCode(clubName){
  const r = new Uint32Array(4); crypto.getRandomValues(r);
  return codePrefix(clubName) + '-' + Array.from(r, x => CODE_ALPHABET[x % CODE_ALPHABET.length]).join('');
}
function friendlyAuthError(e){
  const c = (e && e.code) || '';
  if(c.includes('invalid-credential') || c.includes('wrong-password') || c.includes('user-not-found')) return 'That email and password don’t match. Please try again.';
  if(c.includes('email-already-in-use')) return 'There’s already an NGL club account with that email (perhaps from NGL Schools). Log in with it instead.';
  if(c.includes('weak-password')) return 'Please choose a password of at least 8 characters.';
  if(c.includes('invalid-email')) return 'Please check the email address.';
  if(c.includes('too-many-requests')) return 'Too many attempts. Please wait a few minutes and try again.';
  if(c.includes('network')) return 'We couldn’t connect. Please check your internet connection.';
  return 'Something went wrong. Please try again.';
}
const toDate = c => !c ? new Date() : (typeof c.toDate === 'function' ? c.toDate() : (c.seconds ? new Date(c.seconds * 1000) : new Date(c)));
const fmtDate = d => d.toLocaleDateString('en-GB', {day:'numeric', month:'long', year:'numeric'});

let FB = null;

  const [app, auth, fs] = await Promise.all([
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-auth.js`),
    import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`)
  ]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  FB = {auth, fs, A: auth.getAuth(a), D: fs.getFirestore(a)};
  return FB;
}
async function loadClubData(uid){
  const {fs, D} = await fb();
  S.uid = uid;
  const [clubSnap, adminSnap, ordersSnap] = await Promise.all([
    fs.getDoc(fs.doc(D, 'clubs', uid)),
    fs.getDoc(fs.doc(D, 'admins', uid)).catch(() => null),
    fs.getDocs(fs.query(fs.collection(D, 'recOrders'), fs.where('clubId', '==', uid))).catch(() => ({docs:[]}))
  ]);
  S.club = clubSnap.exists() ? clubSnap.data() : null;
  S.isAdmin = !!(adminSnap && adminSnap.exists());
  S.orders = ordersSnap.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => toDate(a.createdAt) - toDate(b.createdAt));
  S.content = null;
}
async function claimSchoolsCode(clubName, clubId){
  const {fs, D} = await fb();
  for(let i = 0; i < 6; i++){
    const code = newAccessCode(clubName);
    const ref = fs.doc(D, 'accessCodes', code);
    if((await fs.getDoc(ref)).exists()) continue;
    await fs.setDoc(ref, {clubId, clubName, season:S.season, status:'inactive', createdAt: fs.serverTimestamp()});
    return code;
  }
  return '';
}

const liveApi = {
  async restore(){
    const {auth, A} = await fb();
    return new Promise(res => {
      const off = auth.onAuthStateChanged(A, async user => {

        if(!user){ res(false); return; }
        try{ await loadClubData(user.uid); res(!!S.club || S.isAdmin); }catch(e){ res(false); }
      });

  async signIn(email, password){

    catch(e){ return {ok:false, reason:friendlyAuthError(e)}; }
  },
  async register(d){
    try{
      const {auth, fs, A, D} = await fb();
      const cred = await auth.createUserWithEmailAndPassword(A, d.email, d.password);
      S.uid = cred.user.uid;
      const code = await claimSchoolsCode(d.name, S.uid).catch(() => '');
      await fs.setDoc(fs.doc(D, 'clubs', S.uid), {name:d.name, bgNumber:d.bgNumber, contact:d.contact, email:d.email, accessCode:code, source:'recreational', createdAt:fs.serverTimestamp()});
      await loadClubData(S.uid);
      return {ok:true};
    }catch(e){ return {ok:false, reason:friendlyAuthError(e)}; }
  },
  async signOut(){ const {auth, A} = await fb(); await auth.signOut(A); },
  async placeOrder(o){
    const {fs, D} = await fb();
    const id = orderRef();
    const data = {...o, clubId:S.uid, clubName:S.club.name, status:'awaiting-payment'};
    await fs.setDoc(fs.doc(D, 'recOrders', id), {...data, createdAt:fs.serverTimestamp()});
    const local = {id, ...data, createdAt:new Date()}; S.orders.push(local); return local;
  },
  async loadContent(){
    const {fs, D} = await fb();
    const meta = await fs.getDoc(fs.doc(D, 'recContent', 'meta'));
    if(!meta.exists()) throw new Error('No content published yet');
    const key = meta.data().key; S.contentKey = key;
    const keys = ['plan','warmups','book','competition','imgIndex'];
    const snaps = await Promise.all(keys.map(k => fs.getDoc(fs.doc(D, 'recShared', key, 'docs', k))));
    const c = {};
    snaps.forEach((s, i) => { if(s.exists()) c[keys[i]] = JSON.parse(s.data().json); });
    if(!c.plan) throw new Error('No content published yet');
    return c;
  },
  async loadImgChunk(n){
    const {fs, D} = await fb();
    const s = await fs.getDoc(fs.doc(D, 'recShared', S.contentKey, 'docs', 'img' + n));
    return s.exists() ? JSON.parse(s.data().json) : {};
  },
  async syncFamily(){
    const {fs, D} = await fb();
    const meta = await fs.getDoc(fs.doc(D, 'recContent', 'meta'));
    const upd = {clubName:S.club.name, expires:S.club.rec.expires};
    if(meta.exists()) upd.key = meta.data().key;
    await fs.updateDoc(fs.doc(D, 'recCodes', S.club.recCode), upd);
  },
  async saveFamily(term){
    const {fs, D} = await fb();
    // 1. The club plan itself: always saved on the club's own record.
    await fs.updateDoc(fs.doc(D, 'clubs', S.uid), {recTerm:term});
    S.club.recTerm = term;
    // 2. The family code: only once the Recreational licence is active.
    const rec = S.club.rec;
    if(!rec || rec.status !== 'active' || !rec.expires) return S.club.recCode || null;
    let code = S.club.recCode;
    const data = {clubId:S.uid, clubName:S.club.name, status:'active', key:S.contentKey || '', term, expires:rec.expires};
    try{
      if(!code){
        for(let i = 0; i < 6; i++){
          const c = newAccessCode(S.club.name);
          const ref = fs.doc(D, 'recCodes', c);
          if((await fs.getDoc(ref)).exists()) continue;
          await fs.setDoc(ref, {...data, createdAt:fs.serverTimestamp()}); code = c; break;
        }
      }else{
        await fs.updateDoc(fs.doc(D, 'recCodes', code), {clubName:S.club.name, key:data.key, term, expires:data.expires});
      }
      if(code){ await fs.updateDoc(fs.doc(D, 'clubs', S.uid), {recCode:code}); S.club.recCode = code; }
    }catch(e){ console.warn('Family code not updated', e); S.familyWarn = true; }
    return code;
  },
  // ----- NGL admin -----
  async adminLoad(){
    const {fs, D} = await fb();
    const [c, o] = await Promise.all([fs.getDocs(fs.collection(D, 'clubs')), fs.getDocs(fs.collection(D, 'recOrders'))]);
    return {
      clubs: c.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => String(a.name).localeCompare(String(b.name))),
      orders: o.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => toDate(b.createdAt) - toDate(a.createdAt))
    };
  },
  async adminMarkPaid(order, club){
    const {fs, D} = await fb();
    const batch = fs.writeBatch(D);
    batch.update(fs.doc(D, 'recOrders', order.id), {status:'paid', paidAt:fs.serverTimestamp()});
    if(order.upgradeTo && club.rec){
      batch.update(fs.doc(D, 'clubs', club.id), {rec:{...club.rec, band:order.upgradeTo}});
    }else if(order.band){
      batch.update(fs.doc(D, 'clubs', club.id), {rec:{status:'active', band:order.band, season:order.season,
        expires: fs.Timestamp.fromDate(licenceExpiry(club.rec)), activatedAt: fs.serverTimestamp()}});
    }
    await batch.commit();
  },
  async adminSetStatus(club, status){
    const {fs, D} = await fb();
    const rec = {...(club.rec || {}), status};
    if(status === 'active' && !rec.expires){ rec.season = S.season; rec.expires = fs.Timestamp.fromDate(addYear(new Date())); rec.band = rec.band || 's'; }
    await fs.updateDoc(fs.doc(D, 'clubs', club.id), {rec});
    club.rec = rec;
  },
  async adminPublish(content, progress){
    const {fs, D} = await fb();
    for(const k of ['plan','warmups','book','competition']) if(!content[k]) throw new Error('rec-content.json is missing “' + k + '”');
    const r = new Uint32Array(6); crypto.getRandomValues(r);
    const key = Array.from(r, x => x.toString(36)).join('');
    const imgs = content.images || [], idx = {};
    imgs.forEach((ch, n) => Object.keys(ch).forEach(h => idx[h] = n));
    const put = (name, obj) => fs.setDoc(fs.doc(D, 'recShared', key, 'docs', name), {json: JSON.stringify(obj), version: content.version || '', updatedAt: fs.serverTimestamp()});
    for(const k of ['plan','warmups','book','competition']){ progress && progress('Uploading ' + k + '…'); await put(k, content[k]); }
    await put('imgIndex', idx);
    for(let n = 0; n < imgs.length; n++){ progress && progress(`Uploading photos ${n + 1} of ${imgs.length}…`); await put('img' + n, imgs[n]); }
    await fs.setDoc(fs.doc(D, 'recContent', 'meta'), {key, version: content.version || '', updatedAt: fs.serverTimestamp()});
    progress && progress('Updating family codes…');
    const codes = await fs.getDocs(fs.collection(D, 'recCodes'));
    for(const c of codes.docs) await fs.updateDoc(c.ref, {key});
    S.content = null; IMG.cache = {}; IMG.loaded = {};
  }
};

/* ---------- Order modals ---------- */
// kind: 'start' (new licence + optional starter order), 'renew' (licence, can change band), 'shop' (books, medals, t-shirts)
function orderModal(kind){
  const withLicence = kind === 'start' || kind === 'renew';
  const curBand = S.club.rec && S.club.rec.band;
  const m = modal(`
    <h2>${kind === 'start' ? 'Start your Recreational licence' : kind === 'renew' ? 'Renew your Club Licence' : 'Order books, medals and t-shirts'}</h2>
    <form id="oform">
      ${withLicence ? `<div class="field"><label for="ob">Club size (recreational gymnasts)</label><select class="input" id="ob">${CLUB_BANDS.map(b => `<option value="${b.key}" ${curBand === b.key ? 'selected' : ''}>${b.label}, ${gbp(b.price)} a year</option>`).join('')}</select></div>` : ''}
      ${SHOP.map(i => `<div class="field"><label for="q_${i.kind}">${esc(i.name)}s <span class="note">${gbp(i.price)} each${i.note ? ' · ' + esc(i.note) : ''}</span></label><input class="input" id="q_${i.kind}" type="number" min="0" step="1" value="0" inputmode="numeric"></div>`).join('')}
      <div id="oallow" class="note" style="margin:-4px 0 10px"></div>
      <div id="osum"></div>
      <div class="btn-row" style="margin-top:14px"><button class="btn" type="submit">Place order</button><button class="btn ghost" type="button" data-close>Cancel</button></div>
    </form>`);
  const q = id => m.querySelector('#' + id);
  const qty = k => Math.max(0, parseInt(q('q_' + k).value) || 0);
  let upgrade = false;
  function state(){
    // Allowance for the band this order will leave the club in
    const bandKey = withLicence ? q('ob').value : curBand;
    const band = CLUB_BANDS.find(b => b.key === bandKey) || CLUB_BANDS[0];
    const used = kind === 'shop' ? bookAllowance(S.club, S.orders).used : 0;
    const target = upgrade ? nextBand(bandKey) : band;
    const over = band.books != null && used + qty('book') > band.books;
    const fits = target.books == null || used + qty('book') <= target.books;
    return {band, target, used, over, fits};
  }
  function lines(){
    const st = state(), L = [];
    if(withLicence) L.push({kind:'club', desc:`Recreational Club Licence, ${st.band.label.replace(' recreational', '')} (12 months)`, qty:1, unit:st.band.price});
    if(kind === 'shop' && upgrade && st.over){ const mr = monthsRemaining(S.club.rec); L.push({kind:'club', desc:`Club Licence upgrade, ${st.band.short} to ${st.target.short} (${mr} month${mr === 1 ? '' : 's'} left on your licence)`, qty:1, unit:upgradeCost(st.band.key, st.target.key, S.club.rec)}); }
    SHOP.forEach(i => { const n = qty(i.kind); if(n) L.push({kind:i.kind, desc:i.name + 's', qty:n, unit:i.price}); });
    return withVat(L);
  }
  function sum(){
    const st = state(), L = lines(), tot = L.reduce((a, l) => a + l.qty * l.unit, 0);
    const lim = st.band.books;
    let msg = lim == null ? 'No limit on award books for your club size.' : `Award books: ${st.used + qty('book')} of ${lim} for this licence year.`;
    if(st.over){
      const nb = nextBand(st.band.key);
      msg = kind === 'shop'
        ? `<b style="color:var(--ruby,#b00)">That’s more books than your band allows (${lim} a licence year, ${st.used} used).</b><br><label style="display:flex;gap:8px;align-items:center;margin-top:6px"><input type="checkbox" id="oup" ${upgrade ? 'checked' : ''}> Upgrade to ${esc(nb.short)} gymnasts for ${gbp(upgradeCost(st.band.key, nb.key, S.club.rec))} (the difference for the ${monthsRemaining(S.club.rec)} month${monthsRemaining(S.club.rec) === 1 ? '' : 's'} left on your licence) and add it to this order</label>`
        : `<b style="color:var(--ruby,#b00)">${lim} books is the most for this club size.</b> Choose a larger club size, or order fewer books.`;
      if(upgrade && !st.fits) msg += `<br>Even after upgrading that’s more than ${nb.books} books. Please contact us.`;
    }
    q('oallow').innerHTML = msg;
    const up = q('oup'); if(up) up.addEventListener('change', () => { upgrade = up.checked; sum(); });

// Shrink any sheet that would spill onto a second page (A4, 8mm margins).
function fitPages(pa, landscape){
  const pages = pa.querySelectorAll('.onepage');
  if(!pages.length) return;
  const mm = 96 / 25.4, W = (landscape ? 281 : 194) * mm, H = (landscape ? 192 : 279) * mm;
  pa.style.cssText = `display:block;position:absolute;left:-10000px;top:0;width:${W}px;`;
  pages.forEach(pg => { pg.style.zoom = ''; const h = pg.scrollHeight; if(h > H * 0.95) pg.style.zoom = (H * 0.95 / h).toFixed(3); });
  pa.style.cssText = '';
}
async function printHTML(html, landscape){
  const pa = document.getElementById('print-area');
  pa.innerHTML = html;
  let st = document.getElementById('pageStyle');
  if(!st){ st = document.createElement('style'); st.id = 'pageStyle'; document.head.appendChild(st); }
  st.textContent = `@media print{@page{size:A4 ${landscape ? 'landscape' : 'portrait'};margin:8mm;}}`;
  if(pa.querySelector('img[data-img]')){
    const n = document.createElement('div'); n.className = 'print-wait'; n.textContent = 'Preparing photos for printing…'; document.body.appendChild(n);
    try{ await hydrateImages(pa); await Promise.all([...pa.querySelectorAll('img')].map(i => i.decode ? i.decode().catch(() => {}) : null)); }
    finally{ n.remove(); }
  }
  fitPages(pa, landscape);
  window.print();
}

const IMG = {cache:{}, loaded:{}};
async function hydrateImages(root){
  const els = [...(root || document).querySelectorAll('img[data-img]:not([src])')];
  if(!els.length || !S.content || !S.content.imgIndex) return;
  const need = [...new Set(els.map(e => S.content.imgIndex[e.dataset.img]).filter(n => n !== undefined && !IMG.loaded[n]))];
  await Promise.all(need.map(async n => { IMG.loaded[n] = true; try{ Object.assign(IMG.cache, await api.loadImgChunk(n)); }catch(e){ IMG.loaded[n] = false; } }));
  els.forEach(e => { const d = IMG.cache[e.dataset.img]; if(d) e.src = d; });
}
function thumbs(s, i){
  const ids = s.img && s.img[i];
  if(!ids || !ids.length) return '';
  return `<div class="thumbs">${ids.map(h => `<button class="thumb" data-act="photo" data-img-id="${h}" aria-label="Enlarge photo"><img data-img="${h}" alt="Station set-up photo"></button>`).join('')}</div>`;

};

let PLAN_CACHE = null;
function clubPlan(){
  const t = S.club && S.club.recTerm;
  const key = JSON.stringify(t || null) + '|' + (S.content.version || '') + '|' + S.content.plan.blocks.length;
  if(PLAN_CACHE && PLAN_CACHE.key === key) return PLAN_CACHE.plan;
  const plan = t && t.custom ? buildClubPlan(S.content, t)
    : {custom:false, settings: planDefaults(t), removed: [], adapted: [], coverage: null,
       blocks: S.content.plan.blocks.map(b => Object.assign({}, b, {warm: b.assessment ? S.content.warmups.length - 1 : b.n - 1}))};
  PLAN_CACHE = {key, plan}; return plan;
}
function planNow(){
  const t = S.club && S.club.recTerm, plan = clubPlan(), blocks = plan.blocks;
  if(!t || !t.start) return null;
  if(t.custom){ const n = clubWeekNow(t, plan); return n && !n.outside && !n.half ? n : null; }
  const start = new Date(t.start + 'T00:00:00');
  const wk = Math.floor((Date.now() - start) / (7 * 86400000)) + 1, W = t.weeks || 14, sb = t.startBlock || 1;
  if(wk < 1 || wk > W) return null;
  const week = (wk - 1) % 2 === 0 ? 'A' : 'B';
  if(wk > W - 2) return {block: blocks.find(x => x.assessment).n, week: wk === W - 1 ? 'A' : 'B', wk, W};
  return {block: ((sb - 1) + Math.floor((wk - 1) / 2)) % 6 + 1, week, wk, W};
}

function weekToBlock(w){

  const b = blocks[Math.min(Math.floor((w - 1) / 2), blocks.length - 2)];
  return [b, b.odd ? 'A' : ((w - 1) % 2 === 0 ? 'A' : 'B')];
}
function planPrintHTML(scope, arg){

  if(scope === 'term') blocks.forEach(b => order(b).forEach(p => list.push([b, p])));

  <div class="blockhead"><h1>Competition</h1><span class="muted">NGL Recreational club competitions</span></div>
  <div class="grid4">${c.levels.map((l, i) => `<div class="card" style="border-top:6px solid ${LEVELS[i].color}">
    <p class="eyebrow" style="color:${LEVELS[i].color}">Level ${l.n} · ${esc(l.tag)}</p><h2>${esc(l.name)}</h2>
    ${row('Floor (strip)', l.floor)}${row('Vault', l.vault)}<p class="note">${esc(c.vaultNote[i])}</p>${row('Beam', l.beam)}${row('Bars', l.bars)}</div>`).join('')}</div>
  <div class="card"><h2>Rules and format</h2><ul class="ticks">${c.rules.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>`);
}

/* =====================================================================
   NGL ADMIN
   ===================================================================== */
let ADM = {clubs:[], orders:[]};
async function screenAdmin(){
  setTop();
  render(`<p class="muted">Loading…</p>`);
  try{ ADM = await api.adminLoad(); }catch(e){ console.error(e); render('<p class="error">Couldn’t load admin data.</p>'); return; }
  const recClubs = ADM.clubs.filter(c => c.rec || ADM.orders.some(o => o.clubId === c.id));
  const waiting = ADM.orders.filter(o => o.status !== 'paid');
  render(`<p class="eyebrow">NGL Admin</p><h1>Recreational admin</h1>
  <div class="card"><h2>Orders awaiting payment (${waiting.length})</h2>${waiting.length ? `<div class="table-wrap"><table>
    <thead><tr><th>Order</th><th>Club</th><th>For</th><th class="num">Total</th><th></th></tr></thead>
    <tbody>${waiting.map(o => `<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.clubName)}</td><td>${esc(orderFor(o))}</td><td class="num">${gbp(orderTotal(o))}</td>
      <td class="row-actions"><button class="btn ghost small" data-act="adm-invoice" data-order="${esc(o.id)}">Invoice</button><button class="btn small" data-act="adm-paid" data-order="${esc(o.id)}">Mark paid</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="muted">Nothing outstanding.</p>'}</div>
  <div class="card"><h2>Recreational clubs (${recClubs.length})</h2>${recClubs.length ? `<div class="table-wrap"><table>
    <thead><tr><th>Club</th><th>Size</th><th>Licence until</th><th>Books used</th><th>Status</th><th></th></tr></thead>
    <tbody>${recClubs.map(c => { const on = c.rec && c.rec.status === 'active'; return `<tr><td>${esc(c.name)}<div class="note">${esc(c.email || '')}</div></td><td>${c.rec ? esc(bandOf(c.rec.band).short) : '—'}</td><td>${c.rec && c.rec.expires ? fmtDate(new Date(toDate(c.rec.expires).getTime() - 86400000)) : '—'}</td><td>${(() => { if(!c.rec) return '—'; const a = bookAllowance(c, ADM.orders.filter(o => o.clubId === c.id)); return a.limit == null ? a.used : a.used + ' / ' + a.limit; })()}</td>
      <td>${on ? '<span class="tag ok">Active</span>' : c.rec ? '<span class="tag off">Off</span>' : '<span class="tag wait">Not started</span>'}</td>
      <td class="row-actions"><button class="btn ghost small" data-act="adm-status" data-club="${esc(c.id)}" data-to="${on ? 'inactive' : 'active'}">${on ? 'Switch off' : 'Switch on'}</button></td></tr>`; }).join('')}</tbody></table></div>` : '<p class="muted">No Recreational clubs yet.</p>'}</div>
  <div class="card"><h2>Publish programme content</h2>
    <p class="muted">Publishes the copy of <b>rec-content.json</b> kept on the website (the <b>content</b> folder in GitHub) to every licensed club. When the programme changes, replace that file in GitHub, wait a minute, then press the button.</p>
    <p class="note" id="pubNote" style="margin-top:8px"></p>
    <button class="btn" data-act="publish-site">Publish latest from website</button>
    <details style="margin-top:12px"><summary class="note">Or publish a file from this computer</summary>
      <input type="file" id="contentFile" accept="application/json,.json" class="input" style="margin-top:8px">
      <button class="btn ghost small" data-act="publish" style="margin-top:8px">Publish file</button></details></div>`);
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('input', e => {
  if(e.target.id === 'cpStart' || e.target.id === 'cpHalf'){ const d = cpDraft(); d.start = document.getElementById('cpStart').value; d.halfTerm = document.getElementById('cpHalf').value;
    const nx = document.querySelector('.cp-nav [data-n="4"]'); if(nx) nx.disabled = !d.start; }
});
document.addEventListener('click', async e => {
  const t = e.target;
  const go = t.closest('[data-go]');
  if(go){ e.preventDefault(); const g = go.dataset.go;
    if(g === 'home'){ if(signedIn){ tab = 'dashboard'; show(); } else screenLanding(); }
    else if(g === 'login') screenLogin(); else if(g === 'register') screenRegister(); window.scrollTo(0,0); return; }
  const nt = t.closest('[data-tab]');
  if(nt){ tab = nt.dataset.tab; UI.fromPlan = false; UI.cstep = 0; if(tab === 'warmups') UI.wstep = 'weeks'; show(); window.scrollTo(0,0); return; }
  const ui = t.closest('[data-ui]');
  if(ui){
    const k = ui.dataset.ui, v = ui.dataset.v;
    if(k === 'pblock'){ planGo({block: +v, pstep:'app'}); return; }
    if(k === 'pc'){ planGo({piece: v, pstep:'setup'}); return; }
    if(k === 'pstep'){ planGo({pstep: v}); return; }
    if(k === 'wpick'){ UI.wblock = +v; UI.wstep = 'show'; show(); window.scrollTo(0,0); return; }
    if(k === 'wstep'){ UI.wstep = v; show(); window.scrollTo(0,0); return; }
    if(k === 'block'){ UI.block = +v; UI.piece = 'all'; }
    else if(k === 'wblock') UI.wblock = +v;
    else if(k === 'book') UI.book = +v;
    else UI[k] = v;
    show(); return;
  }
  const act = t.closest('[data-act]');
  if(!act) return;
  const a = act.dataset.act;
  if(a === 'signout'){ await api.signOut(); signedIn = false; S.club = null; S.isAdmin = false; S.content = null; screenLanding(); }
  else if(a === 'start') orderModal('start');
  else if(a === 'renew') orderModal('renew');
  else if(a === 'shop-order'){ if(hasAccess()) orderModal('shop'); else show(); }
  else if(a === 'reset'){
    const em = (document.getElementById('em') || {}).value || '';
    const err = document.getElementById('err');
    if(!em.trim()){ if(err) err.textContent = 'Type your email above, then tap “Forgotten your password?” again.'; return; }
    const r = await api.resetPassword(em.trim());
    if(err){ err.style.color = r.ok ? 'var(--ok)' : ''; err.textContent = r.ok ? 'If there’s a club account for that email, a reset link is on its way.' : r.reason; }
  }
  else if(a === 'invoice'){ const o = S.orders.find(x => x.id === act.dataset.order); document.querySelectorAll('.modal-bg').forEach(m => m.remove()); if(o) showInvoice(o, S.club || {}); }
  else if(a === 'adm-invoice'){ const o = ADM.orders.find(x => x.id === act.dataset.order); if(o) showInvoice(o, ADM.clubs.find(x => x.id === o.clubId) || {name:o.clubName}); }
  else if(a === 'print-invoice' && CURRENT_INVOICE){ printHTML(invoiceHTML(CURRENT_INVOICE.o, CURRENT_INVOICE.club), false); }
  else if(a === 'email-invoice' && CURRENT_INVOICE){
    const n = document.getElementById('invMailNote'); const to = CURRENT_INVOICE.club.email;
    if(!FIREBASE_CONFIG){ if(n) n.textContent = 'Preview mode: no email sent.'; return; }
    act.disabled = true; if(n) n.textContent = 'Sending to ' + (to || '') + '…';
    try{ await emailInvoice(CURRENT_INVOICE.o, CURRENT_INVOICE.club); if(n){ n.style.color = 'var(--ok)'; n.textContent = '✓ Emailed to ' + to + '.'; } }
    catch(err){ console.error(err); if(n) n.textContent = 'Couldn’t send the email. Please try again later.'; }
    act.disabled = false;
  }
  else if(a === 'cp-story'){ const m = modal(planStoryHTML(true) + '<div class="btn-row" style="margin-top:16px"><button class="btn" data-close>Close</button></div>'); m.querySelector('.modal').classList.add('modal-wide'); }
  else if(a === 'cp-start'){ UI.cdraft = planDefaults(S.club.recTerm); UI.cstep = 1; show(); window.scrollTo(0,0); }
  else if(a === 'cp-cancel'){ UI.cstep = 0; UI.cdraft = null; show(); window.scrollTo(0,0); }
  else if(a === 'cp-set'){ const d = cpDraft(), k = act.dataset.k, v = act.dataset.v;
    if(['VT','BM','BA','FT'].includes(k)) d.pieces[k] = v; else d[k] = +v; const y = window.scrollY; show(); window.scrollTo(0, y); }
  else if(a === 'cp-step'){ const d = cpDraft();
    if(UI.cstep === 3){ const sEl = document.getElementById('cpStart'), hEl = document.getElementById('cpHalf'); if(sEl) d.start = sEl.value; if(hEl) d.halfTerm = hEl.value; if(+act.dataset.n > 3 && !d.start) return; }
    UI.cstep = +act.dataset.n; show(); window.scrollTo(0,0); }
  else if(a === 'cp-save'){ const d = cpDraft(), n = document.getElementById('cpNote'); act.disabled = true; n.textContent = 'Saving…';
    try{ await api.saveFamily(Object.assign({}, d, {custom:true, startBlock:1})); PLAN_CACHE = null; UI.cstep = 0; UI.cdraft = null; UI.pstep = 'weeks'; show(); window.scrollTo(0,0); }
    catch(err){ console.error(err); act.disabled = false; n.textContent = 'Couldn’t save: ' + (err && (err.code || err.message) || 'unknown error') + '. Please try again, or send this message to NGL.'; } }
  else if(a === 'vid-soon'){ const t = act.querySelector('.skillvid-soon'); if(t){ t.textContent = 'This video is coming soon'; } }
  else if(a === 'grp'){ const i = +act.dataset.i; const g = inGroup(i) ? UI.group.filter(x => x !== i) : [...UI.group, i].sort(); if(!g.length) return; UI.group = g; GROUP_STORE.set(g); const y = window.scrollY; show(); window.scrollTo(0, y); }
  else if(a === 'print-plan'){ printHTML(planPrintHTML(act.dataset.scope || 'piece', act.dataset.arg), true); }
  else if(a === 'to-plan'){ UI.fromPlan = false; tab = 'plan'; show(); window.scrollTo(0,0); }
  else if(a === 'plan-warmup'){ UI.wblock = UI.block; UI.fromPlan = true; tab = 'warmups'; show(); window.scrollTo(0,0); }
  else if(a === 'photo'){ const d = IMG.cache[act.dataset.imgId]; if(d){ const m = modal(`<img src="${d}" alt="Station set-up photo" style="width:100%;border-radius:12px;display:block"><div class="btn-row" style="margin-top:12px"><button class="btn ghost" data-close>Close</button></div>`); m.querySelector('.modal').classList.add('modal-wide'); } }
  else if(a === 'family') familyModal();
  else if(a === 'copy-family'){ copyText(familyMessage(), 'Message copied. Paste it into your email, newsletter or WhatsApp.'); }
  else if(a === 'sheet'){ printHTML(sheetHTML(+act.dataset.level), true); }
  else if(a === 'adm-paid'){
    const o = ADM.orders.find(x => x.id === act.dataset.order); if(!o) return;
    const c = ADM.clubs.find(x => x.id === o.clubId) || {id:o.clubId};
    act.disabled = true; act.textContent = 'Saving…';
    try{ await api.adminMarkPaid(o, c); if(FIREBASE_CONFIG && o.clubId === S.uid) await loadClubData(S.uid); screenAdmin(); }
    catch(err){ console.error(err); act.disabled = false; act.textContent = 'Failed, tap to retry'; }
  }
  else if(a === 'adm-status'){
    const c = ADM.clubs.find(x => x.id === act.dataset.club); if(!c) return;
    if(!act.dataset.armed){ act.dataset.armed = '1'; act.textContent = 'Tap again to confirm'; return; }
    act.disabled = true;
    try{ await api.adminSetStatus(c, act.dataset.to); if(FIREBASE_CONFIG && c.id === S.uid) await loadClubData(S.uid); screenAdmin(); }
    catch(err){ console.error(err); act.disabled = false; act.textContent = 'Failed, retry'; }
  }
  else if(a === 'publish' || a === 'publish-site'){
    const f = document.getElementById('contentFile'), n = document.getElementById('pubNote');
    if(a === 'publish' && !f.files[0]){ n.textContent = 'Choose rec-content.json first.'; return; }
    act.disabled = true; n.style.color = ''; n.textContent = a === 'publish-site' ? 'Fetching rec-content.json from the website…' : 'Publishing…';
    try{ let c;
      if(a === 'publish-site'){ const r = await fetch('content/rec-content.json?t=' + Date.now(), {cache:'no-store'}); if(!r.ok) throw new Error('content/rec-content.json not found on the website (' + r.status + '). Check it is uploaded to the content folder in GitHub.'); c = await r.json(); }
      else c = JSON.parse(await f.files[0].text()); await api.adminPublish(c, msg => { n.textContent = msg; }); S.content = null; n.style.color = 'var(--ok)'; n.textContent = FIREBASE_CONFIG ? '✓ Published version ' + (c.version || '') + '. Licensed clubs will see it next time they open the Hub.' : 'File checked (version ' + (c.version || '') + '). Preview mode: nothing is published from here. Do this on nglrecreational.co.uk once it’s live.'; }
    catch(err){ console.error(err); n.style.color = ''; n.textContent = 'Couldn’t publish: ' + err.message; }
    act.disabled = false;
  }
});

(async () => {
  let restored = false;
  try{ restored = await api.restore(); }catch(e){ console.error(e); }
  if(restored){ signedIn = true; tab = S.club ? 'dashboard' : 'admin'; show(); }
  else{
    const go = new URLSearchParams(location.search).get('go');
    if(go === 'register') screenRegister(); else if(go === 'login') screenLogin(); else screenLanding();
  }
})();

</script>
</body>
