<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1440">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NGL General League">
<title>NGL General League Hub (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071B3'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='900' fill='white' text-anchor='middle'%3EGL%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230071B3'/%3E%3Ctext x='90' y='112' font-family='Arial,Helvetica,sans-serif' font-size='72' font-weight='900' fill='white' text-anchor='middle'%3EGL%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --gl:#0071B3; --gl-bright:#3aa0e6; --red:#D30E33; --gold:#f2a900;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;}
  button,input{font:inherit;color:inherit;}
  a{color:var(--gl-bright);}
  .app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .demo-bar{background:var(--gold);color:#1b1300;font-size:12px;font-weight:800;text-align:center;padding:6px 10px;letter-spacing:.02em;}
  .topbar{position:sticky;top:0;z-index:20;padding:calc(12px + var(--safe-t)) 16px 12px;background:rgba(10,20,64,0.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;min-height:56px;}
  .badge{width:36px;height:36px;border-radius:10px;background:var(--gl);display:grid;place-items:center;font-weight:900;font-size:14px;flex:0 0 auto;}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .top-actions[hidden]{display:none;}
  .icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--navy-3);display:grid;place-items:center;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--navy-3);}
  main{flex:1;padding:18px 16px calc(96px + var(--safe-b));}
  .screen{animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,26,79,0.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));}
  .tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
  .tab{background:none;border:0;cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;}
  .tab svg{width:24px;height:24px;}
  .tab.active{color:var(--gl-bright);}
  .tabbar[hidden]{display:none;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
  .card.accent{background:linear-gradient(135deg,var(--gl),#00548a);border-color:transparent;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 8px;}
  .accent .eyebrow{color:rgba(255,255,255,.8);}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:900;letter-spacing:-.01em;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;}
  h3{font-size:16px;margin:0 0 4px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;}
  .section-title h2{font-size:17px;margin:0;}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--gl);color:#fff;cursor:pointer;text-align:center;}
  .btn.ghost{background:transparent;border:1px solid var(--line);}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px;}
  .btn + .btn{margin-top:10px;}
  label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px;color:var(--muted);letter-spacing:.02em;}
  input[type=text],input[type=email]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--navy-2);font-size:17px;outline:none;}
  input:focus{border-color:var(--gl-bright);}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;}
  .error{color:#ff8fa3;font-weight:700;font-size:14px;margin-top:10px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat .k{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .stat .v{font-size:22px;font-weight:900;margin-top:2px;}
  .stat .pb{font-size:11px;color:var(--gold);font-weight:800;}
  .big-pos{display:flex;align-items:baseline;gap:8px;}
  .big-pos .n{font-size:44px;font-weight:900;line-height:1;}
  .row{display:flex;align-items:center;gap:12px;}
  .pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--navy-4);color:#fff;margin:0 6px 6px 0;}
  .pill.gl{background:var(--gl);}
  .comp{display:flex;gap:14px;align-items:flex-start;}
  .date{flex:0 0 52px;text-align:center;background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:6px 0;}
  .date .d{font-size:20px;font-weight:900;line-height:1.1;}
  .date .m{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
  .scores div{background:var(--navy-2);border-radius:10px;padding:6px 8px;font-size:12px;}
  .scores b{display:block;font-size:15px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  table.best{width:100%;border-collapse:collapse;font-size:14px;}
  table.best td{padding:9px 4px;border-bottom:1px solid var(--line);}
  table.best tr:last-child td{border-bottom:0;}
  table.best td:last-child{text-align:right;font-weight:800;}
  .switcher{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
  .switcher button{border:1px solid var(--line);background:var(--navy-3);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;}
  .switcher button.on{background:var(--gl);border-color:var(--gl);}
  .card-canvas{display:block;width:min(300px,80vw);height:auto;margin:6px auto 14px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));}
  .msg{border-left:4px solid var(--gl-bright);}
  .msg.read{border-left-color:var(--line);}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{width:50px;height:30px;border-radius:999px;background:var(--navy-4);border:0;position:relative;cursor:pointer;flex:0 0 auto;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on{background:var(--gl);}
  .switch.on::after{left:23px;}
  .demo-box{background:rgba(242,169,0,.12);border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:16px;}
  .demo-box b{color:var(--gold);}
  .demo-box button{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0;font-weight:800;}
  .center{text-align:center;}
  .hero-icon{width:64px;height:64px;border-radius:18px;background:var(--gl);display:grid;place-items:center;margin:8px auto 14px;}
  .hero-icon svg{width:32px;height:32px;}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;}
</style>
</head>
<body>
<div class="app">
  <div class="demo-bar">DEMO · made-up gymnasts and results · nothing is saved</div>
  <header class="topbar">
    <div class="badge">GL</div>
    <div class="brand">
      <span class="brand-top">National Gymnastics League</span>
      <span class="brand-title" id="topTitle">General League Hub</span>
    </div>
    <div class="top-actions" id="topActions" hidden>
      <button class="icon-btn" data-go="#/news" aria-label="News">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>
        <span class="dot" id="newsDot"></span>
      </button>
      <button class="icon-btn" data-go="#/settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      </button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <div class="tabbar-inner">
      <button class="tab" data-go="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>
      <button class="tab" data-go="#/stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/></svg>Stats</button>
      <button class="tab" data-go="#/comps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Comps</button>
      <button class="tab" data-go="#/card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v12c0 3-3 5-6 6-3-1-6-3-6-6z"/><path d="M9 9h6M9 12h6"/></svg>Card</button>
    </div>
  </nav>
</div>

<script>
/* ───────────────── Demo data (all made up) ───────────────── */
var MAG = ["Floor","Pommel","Rings","Vault","Parallel Bars","High Bar"];
var WAG = ["Vault","Uneven Bars","Balance Beam","Floor"];
var COMPS = [
  {id:"r1", name:"General League · Round 1", date:"2027-02-07", venue:"Hertfordshire"},
  {id:"r2", name:"General League · Round 2", date:"2027-03-21", venue:"East Midlands"},
  {id:"r3", name:"General League · Round 3", date:"2027-05-09", venue:"Hertfordshire"}
];
var UPCOMING = {name:"General League · Round 4", date:"2027-06-13", venue:"Hertfordshire", arrival:"08:15", warmup:"08:45", squad:"Squad 3", start:"Floor"};
var DEMO = {
  "1000001": {name:"Oliver Hart", gender:"Boys", discipline:"MAG", level:"2", club:"Demo Gymnastics Club", linked:true,
    results:{r1:[12.1,9.8,9.4,11.6,10.2,9.9], r2:[12.4,10.3,9.7,11.9,10.6,10.1], r3:[12.8,10.1,10.2,12.2,10.9,10.6]}, videos:{r3:true}},
  "1000002": {name:"Maisie Hart", gender:"Girls", discipline:"WAG", level:"1", club:"Demo Gymnastics Club", linked:false,
    results:{r1:[11.2,10.1,10.4,11.8], r2:[11.5,10.4,10.9,12.1], r3:[11.4,10.9,11.3,12.4]}, videos:{}}
};
var NEWS = [
  {id:"n1", date:"2027-06-02", title:"Round 4 running order is out", body:"Squads, start apparatus and arrival times for Round 4 are now on the Comps tab. Warm-up starts at 08:45 and parking is on site."},
  {id:"n2", date:"2027-05-10", title:"Round 3 results are in", body:"Scores from Round 3 are now on the Stats and Comps tabs, and the Player Card has been updated."},
  {id:"n3", date:"2027-01-12", title:"Welcome to the General League Hub", body:"This is your gymnast's own page for the 2027 season: results, progress, competitions and their NGL Player Card."}
];

// Peers so league position and player card ratings have something to compare against
function seeded(n){ var x = Math.sin(n) * 10000; return x - Math.floor(x); }
function buildPeers(prefix, apps, level, gender, base, count){
  var out = [];
  for(var i = 0; i < count; i++){
    var r = {};
    COMPS.forEach(function(c, ci){
      r[c.id] = apps.map(function(a, ai){ return Math.round((base + seeded(i*31 + ai*7 + ci*3 + level*11) * 3.2 - 0.6 + ci*0.15) * 10) / 10; });
    });
    out.push({id:prefix + i, gender:gender, level:level, club:"Club " + (i % 6 + 1), results:r});
  }
  return out;
}
var PEERS = buildPeers("pb", MAG, "2", "Boys", 9.2, 15).concat(buildPeers("pg", WAG, "1", "Girls", 9.6, 22));

// Shape the data like the league pages so ngl-player-card.js can use it unchanged
var competitions = COMPS.map(function(c){
  var apps = MAG.concat(WAG.filter(function(a){ return MAG.indexOf(a) < 0; }));
  return {name:c.name, date:c.date, displayDate:c.date, sheets: apps.map(function(app){
    var entries = [];
    function add(id, g){
      var list = g.gender === "Boys" ? MAG : WAG, i = list.indexOf(app);
      if(i < 0 || !g.results[c.id]) return;
      entries.push({memberId:id, gender:g.gender, level:g.level, club:g.club, score:g.results[c.id][i]});
    }
    Object.keys(DEMO).forEach(function(id){ add(id, DEMO[id]); });
    PEERS.forEach(function(p){ add(p.id, p); });
    return {apparatus:app, entries:entries};
  })};
});
function getName(id){ return DEMO[id] ? DEMO[id].name : ""; }

/* ───────────────── State ───────────────── */
var S = {email:"", bg:"", signedIn:false, gymnasts:[], current:null, readNews:{}, emails:true, photo:{}};

/* ───────────────── Helpers ───────────────── */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function apps(g){ return g.gender === "Boys" ? MAG : WAG; }
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateBits(d){ return {d:Number(d.slice(8)), m:MONTHS[Number(d.slice(5,7)) - 1]}; }
function longDate(d){ var b = dateBits(d); return b.d + " " + b.m + " " + d.slice(0,4); }
function best(g){ var a = apps(g), out = {}; a.forEach(function(app, i){ out[app] = Math.max.apply(null, COMPS.filter(function(c){ return g.results[c.id]; }).map(function(c){ return g.results[c.id][i]; })); }); return out; }
function total(b){ return Object.keys(b).reduce(function(t,k){ return t + b[k]; }, 0); }
function compTotal(g, cid){ return g.results[cid].reduce(function(t,v){ return t + v; }, 0); }
function leaguePos(id){
  var me = DEMO[id], field = PEERS.filter(function(p){ return p.gender === me.gender && p.level === me.level; }).concat([me]);
  var mine = total(best(me));
  var ahead = field.filter(function(p){ return total(best(p)) > mine; }).length;
  return {pos:ahead + 1, of:field.length};
}
function compPlace(id, cid){
  var me = DEMO[id], field = PEERS.filter(function(p){ return p.gender === me.gender && p.level === me.level; }).concat([me]);
  var mine = compTotal(me, cid);
  return field.filter(function(p){ return compTotal(p, cid) > mine; }).length + 1;
}
function ord(n){ var s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function firstName(g){ return g.name.split(" ")[0]; }

/* ───────────────── Router ───────────────── */
var view = document.getElementById("view");
function go(h){ if(location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);
document.addEventListener("click", function(e){
  var t = e.target.closest("[data-go]"); if(t){ e.preventDefault(); go(t.getAttribute("data-go")); }
});

function chrome(signed){
  document.getElementById("tabbar").hidden = !signed;
  document.getElementById("topActions").hidden = !signed;
  document.getElementById("newsDot").style.display = NEWS.some(function(n){ return !S.readNews[n.id]; }) ? "" : "none";
  var route = location.hash.replace("#/","") || "home";
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-go") === "#/" + route); });
}

function render(){
  var route = (location.hash.replace("#/","") || "").split("?")[0];
  if(!S.signedIn && ["signin","waiting","check",""].indexOf(route) < 0) route = "signin";
  if(S.signedIn && ["signin","waiting","check",""].indexOf(route) >= 0) route = "home";
  if(!SCREENS[route]) route = S.signedIn ? "home" : "signin";
  var fn = SCREENS[route];
  chrome(S.signedIn);
  view.innerHTML = '<div class="screen">' + fn() + '</div>';
  if(AFTER[route]) AFTER[route]();
  window.scrollTo(0, 0);
}

/* ───────────────── Screens ───────────────── */
var SCREENS = {}, AFTER = {};

SCREENS.signin = function(){
  return '<div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v12c0 3-3 5-6 6-3-1-6-3-6-6z"/></svg></div>'
  + '<h1 class="center">Your gymnast\'s hub</h1>'
  + '<p class="center muted">Results, progress, competitions and their NGL Player Card for the 2027 General League season.</p>'
  + '<div class="card">'
  +   '<label for="bg">Gymnast\'s British Gymnastics number</label>'
  +   '<input id="bg" type="text" inputmode="numeric" autocomplete="off" placeholder="e.g. 1234567" value="' + esc(S.bg) + '">'
  +   '<div class="hint">On their BG membership, or ask your club.</div>'
  +   '<label for="em">Your email address</label>'
  +   '<input id="em" type="email" autocomplete="email" placeholder="you@example.com" value="' + esc(S.email) + '">'
  +   '<div class="hint">We\'ll email you a sign-in link. No password to remember.</div>'
  +   '<div id="err"></div>'
  +   '<div style="margin-top:16px"><button class="btn" id="go">Send my sign-in link</button></div>'
  + '</div>'
  + '<div class="demo-box"><b>Demo:</b> try <button data-fill="1000001">1000001</button> (Oliver, MAG, already linked) or <button data-fill="1000002">1000002</button> (Maisie, WAG, first time, so her club checks it first). Any email works.</div>'
  + '<div class="foot">Only parents linked to a gymnast can see their hub.<br>Photos on the Player Card never leave your phone.</div>';
};
AFTER.signin = function(){
  document.querySelectorAll("[data-fill]").forEach(function(b){ b.onclick = function(){ document.getElementById("bg").value = b.getAttribute("data-fill"); if(!document.getElementById("em").value) document.getElementById("em").value = "parent@example.com"; }; });
  document.getElementById("go").onclick = function(){
    var bg = document.getElementById("bg").value.trim(), em = document.getElementById("em").value.trim(), err = document.getElementById("err");
    S.bg = bg; S.email = em;
    if(!/^\d{6,8}$/.test(bg)){ err.innerHTML = '<div class="error">Enter the gymnast\'s BG number (numbers only).</div>'; return; }
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){ err.innerHTML = '<div class="error">Enter a valid email address.</div>'; return; }
    if(!DEMO[bg]){ err.innerHTML = '<div class="error">We can\'t find that BG number in the 2027 General League. Check it with your club.</div>'; return; }
    go(DEMO[bg].linked ? "#/check" : "#/waiting");
  };
};

SCREENS.waiting = function(){
  var g = DEMO[S.bg];
  return '<div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>'
  + '<h1 class="center">Nearly there</h1>'
  + '<p class="center muted">This is the first time <b>' + esc(S.email) + '</b> has asked for a hub, so we\'ve asked <b>' + esc(g.club) + '</b> to confirm it\'s you. Clubs usually do this the same day.</p>'
  + '<div class="card"><h3>What happens next</h3><p class="muted" style="margin:0">When your club confirms, we\'ll email you a sign-in link. You only do this once.</p></div>'
  + '<div class="demo-box"><b>Demo:</b> pretend you\'re the club. <button id="approve">Approve this parent in the NGL Club Hub</button></div>';
};
AFTER.waiting = function(){ document.getElementById("approve").onclick = function(){ DEMO[S.bg].linked = true; go("#/check"); }; };

SCREENS.check = function(){
  return '<div class="hero-icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>'
  + '<h1 class="center">Check your email</h1>'
  + '<p class="center muted">We\'ve sent a sign-in link to <b>' + esc(S.email) + '</b>. Tap it on this phone and you\'re in. You\'ll stay signed in.</p>'
  + '<div class="demo-box"><b>Demo:</b> <button id="open">Open the sign-in link</button></div>'
  + '<div class="foot"><button class="btn ghost small" data-go="#/signin">Use a different email</button></div>';
};
AFTER.check = function(){
  document.getElementById("open").onclick = function(){
    S.signedIn = true;
    S.gymnasts = Object.keys(DEMO).filter(function(id){ return DEMO[id].linked; });
    if(S.gymnasts.indexOf(S.bg) < 0) S.gymnasts.push(S.bg);
    // siblings: in the demo, linking Maisie also shows Oliver (same family email)
    if(S.bg === "1000002" && S.gymnasts.indexOf("1000001") < 0) S.gymnasts.unshift("1000001");
    S.current = S.bg;
    go("#/home");
  };
};

function switcher(){
  if(S.gymnasts.length < 2) return "";
  return '<div class="switcher">' + S.gymnasts.map(function(id){ return '<button data-pick="' + id + '" class="' + (id === S.current ? "on" : "") + '">' + esc(firstName(DEMO[id])) + '</button>'; }).join("") + '</div>';
}
function wireSwitcher(){ document.querySelectorAll("[data-pick]").forEach(function(b){ b.onclick = function(){ S.current = b.getAttribute("data-pick"); render(); }; }); }

SCREENS.home = function(){
  var g = DEMO[S.current], b = best(g), lp = leaguePos(S.current), a = apps(g);
  var top = a.slice().sort(function(x, y){ return b[y] - b[x]; }).slice(0, 4);
  var bd = dateBits(UPCOMING.date);
  return switcher()
  + '<div class="card">'
  +   '<div class="eyebrow">2027 General League</div>'
  +   '<h1>' + esc(g.name) + '</h1>'
  +   '<div><span class="pill gl">' + g.discipline + ' Level ' + g.level + '</span><span class="pill">' + esc(g.club) + '</span></div>'
  + '</div>'
  + '<div class="card accent">'
  +   '<div class="eyebrow">League position · ' + g.discipline + ' Level ' + g.level + '</div>'
  +   '<div class="big-pos"><span class="n">' + ord(lp.pos) + '</span><span>of ' + lp.of + ' gymnasts</span></div>'
  +   '<p style="margin:8px 0 0;opacity:.9">All-around total ' + total(b).toFixed(3) + ' from best scores on each apparatus.</p>'
  + '</div>'
  + '<div class="section-title"><h2>Best scores</h2><a href="#/stats">See progress</a></div>'
  + '<div class="stat-grid">' + top.map(function(app){ return '<div class="stat"><div class="k">' + esc(app) + '</div><div class="v">' + b[app].toFixed(3) + '</div></div>'; }).join("") + '</div>'
  + '<div class="section-title"><h2>Next competition</h2></div>'
  + '<div class="card"><div class="comp"><div class="date"><div class="d">' + bd.d + '</div><div class="m">' + bd.m + '</div></div><div>'
  +   '<h3>' + esc(UPCOMING.name) + '</h3><div class="muted" style="font-size:14px">' + esc(UPCOMING.venue) + ' · arrive ' + UPCOMING.arrival + '</div>'
  +   '<div style="margin-top:8px"><span class="pill gl">' + UPCOMING.squad + '</span><span class="pill">Starts on ' + UPCOMING.start + '</span></div>'
  + '</div></div></div>';
};
AFTER.home = wireSwitcher;

var COLOURS = ["#3aa0e6","#f2a900","#2ec4b6","#ff6b8b","#a78bfa","#9be564"];
function graph(g){
  var a = apps(g), W = 520, H = 240, L = 44, R = 44, T = 14, B = 40;
  var all = []; COMPS.forEach(function(c){ g.results[c.id].forEach(function(v){ all.push(v); }); });
  var lo = Math.floor(Math.min.apply(null, all) - 0.5), hi = Math.ceil(Math.max.apply(null, all) + 0.5);
  var X = function(i){ return L + i * (W - L - R) / (COMPS.length - 1); }, Y = function(v){ return T + (hi - v) / (hi - lo) * (H - T - B); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Scores across the season">';
  for(var v = lo; v <= hi; v++){ s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="rgba(255,255,255,.1)"/><text x="' + (L - 8) + '" y="' + (Y(v) + 4) + '" fill="#b7c1e6" font-size="15" text-anchor="end">' + v + '</text>'; }
  COMPS.forEach(function(c, i){ s += '<text x="' + X(i) + '" y="' + (H - 10) + '" fill="#b7c1e6" font-size="15" text-anchor="middle">Round ' + (i + 1) + '</text>'; });
  a.forEach(function(app, ai){
    var pts = COMPS.map(function(c, i){ return X(i) + "," + Y(g.results[c.id][ai]); });
    s += '<polyline points="' + pts.join(" ") + '" fill="none" stroke="' + COLOURS[ai] + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    COMPS.forEach(function(c, i){ s += '<circle cx="' + X(i) + '" cy="' + Y(g.results[c.id][ai]) + '" r="4" fill="' + COLOURS[ai] + '"/>'; });
  });
  return s + '</svg><div class="legend">' + a.map(function(app, ai){ return '<span><i style="background:' + COLOURS[ai] + '"></i>' + esc(app) + '</span>'; }).join("") + '</div>';
}

SCREENS.stats = function(){
  var g = DEMO[S.current], b = best(g), a = apps(g), lp = leaguePos(S.current);
  var latest = COMPS[COMPS.length - 1].id;
  return switcher()
  + '<div class="card"><div class="eyebrow">Progress this season</div>' + graph(g) + '</div>'
  + '<div class="stat-grid" style="margin-bottom:14px">'
  +   '<div class="stat"><div class="k">All-around</div><div class="v">' + total(b).toFixed(3) + '</div></div>'
  +   '<div class="stat"><div class="k">League position</div><div class="v">' + ord(lp.pos) + ' <span class="muted" style="font-size:14px">of ' + lp.of + '</span></div></div>'
  + '</div>'
  + '<div class="card"><div class="eyebrow">Best per apparatus</div><table class="best">'
  + a.map(function(app, i){ var pb = g.results[latest][i] === b[app]; return '<tr><td>' + esc(app) + (pb ? ' <span class="pill" style="background:var(--gold);color:#1b1300;margin:0 0 0 6px">PB last comp</span>' : '') + '</td><td>' + b[app].toFixed(3) + '</td></tr>'; }).join("")
  + '</table></div>';
};
AFTER.stats = wireSwitcher;

SCREENS.comps = function(){
  var g = DEMO[S.current], a = apps(g), bd = dateBits(UPCOMING.date);
  var done = COMPS.slice().reverse().map(function(c){
    var d = dateBits(c.date), place = compPlace(S.current, c.id);
    return '<div class="card"><div class="comp"><div class="date"><div class="d">' + d.d + '</div><div class="m">' + d.m + '</div></div><div style="flex:1;min-width:0">'
      + '<h3>' + esc(c.name) + '</h3><div class="muted" style="font-size:14px">' + esc(c.venue) + ' · ' + g.discipline + ' Level ' + g.level + '</div>'
      + '<div style="margin-top:8px"><span class="pill gl">' + ord(place) + ' all-around</span><span class="pill">' + compTotal(g, c.id).toFixed(3) + '</span>' + (g.videos[c.id] ? '<span class="pill" style="cursor:pointer" data-video>▶ Videos</span>' : '') + '</div>'
      + '<div class="scores">' + a.map(function(app, i){ return '<div>' + esc(app) + '<b>' + g.results[c.id][i].toFixed(3) + '</b></div>'; }).join("") + '</div>'
      + '</div></div></div>';
  }).join("");
  return switcher()
  + '<div class="section-title" style="margin-top:0"><h2>Coming up</h2></div>'
  + '<div class="card accent"><div class="comp"><div class="date" style="background:rgba(255,255,255,.15);border-color:transparent"><div class="d">' + bd.d + '</div><div class="m" style="color:#fff">' + bd.m + '</div></div><div>'
  +   '<h3>' + esc(UPCOMING.name) + '</h3><p style="margin:0;opacity:.9;font-size:14px">' + esc(UPCOMING.venue) + '<br>Arrive ' + UPCOMING.arrival + ' · warm-up ' + UPCOMING.warmup + '<br>' + UPCOMING.squad + ', starts on ' + UPCOMING.start + '</p>'
  + '</div></div></div>'
  + '<div class="section-title"><h2>Entered in 2027</h2><span class="muted" style="font-size:13px">' + COMPS.length + ' competitions</span></div>'
  + done;
};
AFTER.comps = function(){ wireSwitcher(); document.querySelectorAll("[data-video]").forEach(function(v){ v.onclick = function(){ alert("Demo: this would open the routine videos for this competition."); }; }); };

SCREENS.card = function(){
  var c = NGLPlayerCard.build(S.current);
  return switcher()
  + '<canvas class="card-canvas" id="pc" width="1200" height="1720"></canvas>'
  + '<div class="row" style="justify-content:center;gap:10px;margin-bottom:14px"><button class="btn ghost small" id="addPhoto">Add photo</button><button class="btn small" id="saveCard">Save card</button></div>'
  + '<input type="file" accept="image/*" id="photoIn" hidden>'
  + '<div class="card"><div class="eyebrow">How the ratings work</div>'
  +   '<p class="muted" style="font-size:14px">Each apparatus gets a rating from where ' + esc(firstName(DEMO[S.current])) + '\'s best score sits among ' + (c ? c.discipline : "") + ' Level ' + DEMO[S.current].level + ' gymnasts this season. Those feed the six skills below. The card updates after every competition.</p>'
  +   '<div class="stat-grid">' + NGLPlayerCard.attrs.map(function(at){ return '<div class="stat"><div class="k">' + at.key + ' · ' + at.label + '</div><div class="v">' + (c && c.attrs[at.key] != null ? c.attrs[at.key] : "–") + '</div></div>'; }).join("") + '</div>'
  + '</div>'
  + '<div class="foot">Photos stay on this phone. They are never uploaded or saved by NGL.</div>';
};
AFTER.card = function(){
  wireSwitcher();
  var id = S.current, card = NGLPlayerCard.build(id); card.season = 2027; var cv = document.getElementById("pc");
  function draw(){ NGLPlayerCard.draw(cv, card, S.photo[id] || null); }
  draw(); NGLPlayerCard.ready().then(draw);
  document.getElementById("addPhoto").onclick = function(){ document.getElementById("photoIn").click(); };
  document.getElementById("photoIn").onchange = function(e){
    var f = e.target.files && e.target.files[0]; if(!f) return;
    var img = new Image(); img.onload = function(){ S.photo[id] = img; draw(); }; img.src = URL.createObjectURL(f);
  };
  document.getElementById("saveCard").onclick = function(){
    try{ var a = document.createElement("a"); a.download = "NGL_Player_" + card.name.replace(/\s+/g, "_") + ".png"; a.href = cv.toDataURL("image/png"); a.click(); }
    catch(err){ alert("Couldn't save here. Try a screenshot instead."); }
  };
};

SCREENS.news = function(){
  var out = '<h1>News</h1><p class="muted">Messages from NGL about ' + esc(firstName(DEMO[S.current])) + '\'s competitions and the General League.</p>'
  + NEWS.map(function(n){ return '<div class="card msg ' + (S.readNews[n.id] ? "read" : "") + '"><div class="eyebrow">' + longDate(n.date) + '</div><h3>' + esc(n.title) + '</h3><p class="muted" style="margin:0">' + esc(n.body) + '</p></div>'; }).join("");
  NEWS.forEach(function(n){ S.readNews[n.id] = true; });
  return out;
};
AFTER.news = function(){ chrome(true); };

SCREENS.settings = function(){
  return '<h1>Account</h1>'
  + '<div class="card"><div class="eyebrow">Signed in as</div><h3>' + esc(S.email) + '</h3><p class="muted" style="margin:0">Linked gymnasts: ' + S.gymnasts.map(function(id){ return esc(DEMO[id].name); }).join(", ") + '</p></div>'
  + '<div class="card"><div class="toggle"><div><h3>Competition emails</h3><p class="muted" style="margin:0;font-size:14px">Running orders, arrival times and results.</p></div><button class="switch ' + (S.emails ? "on" : "") + '" id="em" aria-label="Competition emails"></button></div></div>'
  + '<div class="card"><h3>Add another gymnast</h3><p class="muted" style="font-size:14px">A brother or sister in the General League? Add them with their BG number.</p><button class="btn ghost small" data-go="#/signin" id="addG">Add a gymnast</button></div>'
  + '<div class="card"><h3>Your data</h3><p class="muted" style="font-size:14px">We hold your email and which gymnasts it\'s linked to. Results come from NGL competitions. NGL is part of SAADI Gymnastics, the data controller.</p><button class="btn ghost small" id="del">Delete my account</button></div>'
  + '<button class="btn ghost" id="out">Sign out</button>';
};
AFTER.settings = function(){
  document.getElementById("em").onclick = function(){ S.emails = !S.emails; this.classList.toggle("on", S.emails); };
  document.getElementById("addG").onclick = function(e){ e.preventDefault(); e.stopPropagation(); S.signedIn = false; S.bg = ""; go("#/signin"); };
  document.getElementById("del").onclick = function(){ if(confirm("Demo: delete this account? (Nothing is really stored.)")){ S = {email:"", bg:"", signedIn:false, gymnasts:[], current:null, readNews:{}, emails:true, photo:{}}; go("#/signin"); } };
  document.getElementById("out").onclick = function(){ S.signedIn = false; go("#/signin"); };
};

render();
</script>
<script src="ngl-player-card.js"></script>
