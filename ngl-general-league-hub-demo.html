<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1440">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>NGL General League Hub (Demo)</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230071B3'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='900' fill='white' text-anchor='middle'%3EGL%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230071B3'/%3E%3Ctext x='90' y='112' font-family='Arial,Helvetica,sans-serif' font-size='72' font-weight='900' fill='white' text-anchor='middle'%3EGL%3C/text%3E%3C/svg%3E">
<style>
  :root{
    --navy:#0a1440; --navy-2:#0d1a4f; --navy-3:#152463; --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14); --white:#fff; --muted:#b7c1e6;
    --gl:#0071B3; --gl-bright:#3aa0e6; --red:#D30E33; --gold:#f2a900;
    --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--navy);color:var(--white);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;min-height:100dvh;}
  button,input{font:inherit;color:inherit;}
  a{color:var(--gl-bright);}
  .app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
  .demo-bar{margin:14px 16px 0;border:1px dashed var(--gold);border-radius:12px;background:rgba(242,169,0,.08);color:var(--gold);font-size:12px;font-weight:800;text-align:center;padding:8px 12px;letter-spacing:.02em;}
  .demo-bar a{color:#fff;}
  .topbar{position:relative;z-index:20;background:var(--gl);width:100vw;margin-left:calc(50% - 50vw);}
  .topbar-strap{text-align:center;color:#fff;font-weight:800;font-size:13px;letter-spacing:.02em;padding:calc(7px + var(--safe-t)) 16px 7px;}
  .topbar-in{background:linear-gradient(180deg,#2a245f 0%,#2a245f 40%,var(--navy) 100%);border-top-right-radius:120px 38px;padding-bottom:4px;}
  @media(min-width:700px){.topbar-in{border-top-right-radius:220px 46px;}}
  .topbar-row{max-width:1100px;margin:0 auto;padding:0 16px;display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px;min-height:76px;}
  .logo{display:block;line-height:0;}
  .logo img{height:50px;width:auto;display:block;}
  @media(min-width:700px){.logo img{height:60px}}
  .badge{width:36px;height:36px;border-radius:10px;background:var(--gl);display:grid;place-items:center;font-weight:900;font-size:14px;flex:0 0 auto;}
  .brand{display:flex;flex-direction:column;line-height:1.15;min-width:0;}
  .brand-top{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:700;}
  .brand-title{font-size:17px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center;}
  .top-actions[hidden]{display:none;}
  .icon-btn{position:relative;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--navy-3);display:grid;place-items:center;cursor:pointer;}
  .icon-btn svg{width:19px;height:19px;}
  .dot{position:absolute;top:6px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--navy-3);}
  main{flex:1;padding:18px 16px calc(96px + var(--safe-b));}
  .screen{animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(13,26,79,0.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));}
  .tabbar-inner{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);}
  .tab{background:none;border:0;cursor:pointer;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.03em;}
  .tab svg{width:24px;height:24px;}
  .tab.active{color:var(--gl-bright);}
  .tabbar[hidden]{display:none;}
  .card{background:var(--navy-3);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px;}
  .card.accent{background:linear-gradient(135deg,var(--gl),#00548a);border-color:transparent;}
  .eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:0 0 8px;}
  .accent .eyebrow{color:rgba(255,255,255,.8);}
  h1{font-size:26px;line-height:1.15;margin:0 0 6px;font-weight:900;letter-spacing:-.01em;}
  h2{font-size:20px;margin:0 0 6px;font-weight:800;}
  h3{font-size:16px;margin:0 0 4px;font-weight:800;}
  p{line-height:1.55;margin:0 0 10px;}
  .muted{color:var(--muted);}
  .section-title{display:flex;align-items:baseline;justify-content:space-between;margin:22px 2px 10px;}
  .section-title h2{font-size:17px;margin:0;}
  .btn{display:block;width:100%;border:0;border-radius:14px;padding:14px 16px;font-weight:800;font-size:16px;background:var(--gl);color:#fff;cursor:pointer;text-align:center;}
  .btn.ghost{background:transparent;border:1px solid var(--line);}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px;border-radius:12px;}
  .btn + .btn{margin-top:10px;}
  label{display:block;font-size:13px;font-weight:800;margin:14px 0 6px;color:var(--muted);letter-spacing:.02em;}
  input[type=text],input[type=email]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--navy-2);font-size:17px;outline:none;}
  input:focus{border-color:var(--gl-bright);}
  .hint{font-size:13px;color:var(--muted);margin-top:6px;}
  .error{color:#ff8fa3;font-weight:700;font-size:14px;margin-top:10px;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .stat{background:var(--navy-2);border:1px solid var(--line);border-radius:14px;padding:12px;}
  .stat .k{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase;}
  .stat .v{font-size:22px;font-weight:900;margin-top:2px;}
  .stat .pb{font-size:11px;color:var(--gold);font-weight:800;}
  .big-pos{display:flex;align-items:baseline;gap:8px;}
  .big-pos .n{font-size:44px;font-weight:900;line-height:1;}
  .row{display:flex;align-items:center;gap:12px;}
  .pill{display:inline-block;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--navy-4);color:#fff;margin:0 6px 6px 0;}
  .pill.gl{background:var(--gl);}
  .comp{display:flex;gap:14px;align-items:flex-start;}
  .date{flex:0 0 52px;text-align:center;background:var(--navy-2);border:1px solid var(--line);border-radius:12px;padding:6px 0;}
  .date .d{font-size:20px;font-weight:900;line-height:1.1;}
  .date .m{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;}
  .scores{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px;}
  .scores div{background:var(--navy-2);border-radius:10px;padding:6px 8px;font-size:12px;}
  .scores b{display:block;font-size:15px;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:12px;color:var(--muted);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;}
  table.best{width:100%;border-collapse:collapse;font-size:14px;}
  table.best td{padding:9px 4px;border-bottom:1px solid var(--line);}
  table.best tr:last-child td{border-bottom:0;}
  table.best td:last-child{text-align:right;font-weight:800;}
  .switcher{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;}
  .switcher button{border:1px solid var(--line);background:var(--navy-3);border-radius:999px;padding:8px 14px;font-weight:800;font-size:14px;cursor:pointer;white-space:nowrap;}
  .switcher button.on{background:var(--gl);border-color:var(--gl);}
  .card-canvas{display:block;width:min(300px,80vw);height:auto;margin:6px auto 14px;filter:drop-shadow(0 14px 30px rgba(0,0,0,.45));}
  .msg{border-left:4px solid var(--gl-bright);}
  .msg.read{border-left-color:var(--line);}
  .toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{width:50px;height:30px;border-radius:999px;background:var(--navy-4);border:0;position:relative;cursor:pointer;flex:0 0 auto;}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s;}
  .switch.on{background:var(--gl);}
  .switch.on::after{left:23px;}
  .demo-box{background:rgba(242,169,0,.12);border:1px dashed var(--gold);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;margin-top:16px;}
  .demo-box b{color:var(--gold);}
  .demo-box button{background:none;border:0;color:var(--gold);text-decoration:underline;cursor:pointer;padding:0;font-weight:800;}
  .center{text-align:center;}
  .hero-icon{width:64px;height:64px;border-radius:18px;background:var(--gl);display:grid;place-items:center;margin:8px auto 14px;}
  .hero-icon svg{width:32px;height:32px;}
  .foot{text-align:center;font-size:12px;color:var(--muted);margin-top:26px;}
</style>
<script src="ngl-power-league-core.js"></script>
</head>
<body>
<div class="app">
  <header class="topbar"><div class="topbar-strap" id="topTitle">General League Hub · Families</div><div class="topbar-in">
   <div class="topbar-row">
    <a class="logo" href="#/home" aria-label="NGL General League Hub"><img src="brand/ngl-logo-full.png" alt="National Gymnastics League"></a>
    <div class="top-actions" id="topActions" hidden>
      <button class="icon-btn" data-go="#/news" aria-label="News">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 01-3.4 0"/></svg>

      </button>
      <button class="icon-btn" data-go="#/settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>

   </div>
  </div></header>
  <div class="demo-bar" id="demoBar">Loading…</div>

  <main id="view" aria-live="polite"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <div class="tabbar-inner">
      <button class="tab" data-go="#/home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>Home</button>

      <button class="tab" data-go="#/comps"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Comps</button>
      <button class="tab" data-go="#/card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v12c0 3-3 5-6 6-3-1-6-3-6-6z"/><path d="M9 9h6M9 12h6"/></svg>Card</button>
    </div>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ═════════════════ Modes ═════════════════
   Demo (default): made-up gymnasts, demo sign-in.
   Admin (?admin=1, opened from the NGL Admin Hub): search real gymnasts from the
   league results and view their hub read-only, exactly as their family would. */
var ADMIN = /[?&]admin=1/.test(location.search);
var MAG = ["Floor","Pommel","Rings","Vault","Parallel Bars","High Bar"];
var WAG = ["Vault","Uneven Bars","Balance Beam","Floor"];

/* ═════════════════ Data model ═════════════════
   GYM[id] = {name, gender, discipline, level, club, results:{compId:{apparatus:score}}, videos:{compId:true}}
   COMPS   = [{id, name, date, venue}] oldest first */
var GYM = {}, COMPS = [], UPCOMING = null, NEWS = [], competitions = [];
var DATA_LABEL = "";

/* ── Demo data (all made up) ── */
function loadDemo(){
  DATA_LABEL = "DEMO · made-up gymnasts and results · nothing is saved";
  COMPS = [
    {id:"r1", name:"General League · Round 1", date:"2027-02-07", venue:"Hertfordshire"},
    {id:"r2", name:"General League · Round 2", date:"2027-03-21", venue:"East Midlands"},
    {id:"r3", name:"General League · Round 3", date:"2027-05-09", venue:"Hertfordshire"}
  ];
  UPCOMING = {name:"General League · Round 4", date:"2027-06-13", venue:"Hertfordshire", arrival:"08:15", warmup:"08:45", squad:"Squad 3", start:"Floor"};
  function res(list, rows){ var out = {}; COMPS.forEach(function(c, ci){ var m = {}; list.forEach(function(a, ai){ m[a] = rows[ci][ai]; }); out[c.id] = m; }); return out; }
  GYM["1000001"] = {name:"Oliver Hart", gender:"Boys", discipline:"MAG", level:"2", club:"Demo Gymnastics Club", linked:true,
    results:res(MAG, [[12.1,9.8,9.4,11.6,10.2,9.9],[12.4,10.3,9.7,11.9,10.6,10.1],[12.8,10.1,10.2,12.2,10.9,10.6]]), videos:{r3:true}};
  GYM["1000002"] = {name:"Maisie Hart", gender:"Girls", discipline:"WAG", level:"1", club:"Demo Gymnastics Club", linked:false,
    results:res(WAG, [[11.2,10.1,10.4,11.8],[11.5,10.4,10.9,12.1],[11.4,10.9,11.3,12.4]]), videos:{}};
  function seeded(n){ var x = Math.sin(n) * 10000; return x - Math.floor(x); }
  function peers(prefix, list, level, gender, base, count){
    for(var i = 0; i < count; i++){
      var rows = COMPS.map(function(c, ci){ return list.map(function(a, ai){ return Math.round((base + seeded(i*31 + ai*7 + ci*3 + Number(level)*11) * 3.2 - 0.6 + ci*0.15) * 10) / 10; }); });
      GYM[prefix + i] = {name:"", gender:gender, discipline:gender === "Boys" ? "MAG" : "WAG", level:level, club:"Club " + (i % 6 + 1), peer:true, results:res(list, rows), videos:{}};
    }
  }
  peers("pb", MAG, "2", "Boys", 9.2, 15); peers("pg", WAG, "1", "Girls", 9.6, 22);
  NEWS = [
    {id:"n1", date:"2027-06-02", title:"Round 4 running order is out", body:"Squads, start apparatus and arrival times for Round 4 are now on the Comps tab. Warm-up starts at 08:45 and parking is on site."},
    {id:"n2", date:"2027-05-10", title:"Round 3 results are in", body:"Scores from Round 3 are now on the Stats and Comps tabs, and the Profile Card has been updated."},
    {id:"n3", date:"2027-01-12", title:"Welcome to the General League Hub", body:"This is your gymnast's own page for the 2027 season: results, progress, competitions and their NGL Profile Card."}
  ];
  buildCompetitions();
  return Promise.resolve();
}

/* ── Real league data (admin preview) ── same sources the league table uses */
var GH = {user:"Davidcbrooke", repo:"GYMNASTICS-RESULTS", branch:"main"};
var ADMIN_DIRS = ["elevien-data-2027", "elevien-data"];   // 2027 season first; falls back to 2026 until 2027 results exist
var API = "https://api.github.com/repos/" + GH.user + "/" + GH.repo + "/contents/";
var RAW = "https://raw.githubusercontent.com/" + GH.user + "/" + GH.repo + "/" + GH.branch + "/";
function cleanClub(c){ return String(c || "").split(",")[0].replace(/\s*\(\d+\)\s*$/, "").trim(); }
function loadAdmin(){
  var names = {}, corrections = {}, reassign = {};
  function json(path){ return fetch(RAW + path).then(function(r){ return r.ok ? r.json() : {}; }).catch(function(){ return {}; }); }
  var side = Promise.all([
    fetch(API + "gymnast-names.xlsx?ref=" + GH.branch).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(d){
      var buf = Uint8Array.from(atob(d.content.replace(/\n/g, "")), function(c){ return c.charCodeAt(0); });
      var wb = XLSX.read(buf, {type:"array"});
      XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], {defval:""}).forEach(function(r){
        var id = String(r["Mid"] || r["BG Number"] || r["Member ID"] || "").trim();
        var nm = (String(r["FirstName"] || r["First Name"] || "").trim() + " " + String(r["LastName"] || r["Last Name"] || "").trim()).trim();
        if(id && nm) names[id] = nm;
      });
    }).catch(function(){}),
    json("corrections.json").then(function(d){ corrections = d || {}; }),
    json("reassignments.json").then(function(d){ reassign = d || {}; })
  ]);
  function tryDir(i){
    if(i >= ADMIN_DIRS.length) return Promise.reject(new Error("No league results found yet"));
    var dir = ADMIN_DIRS[i];
    return fetch(API + dir + "?ref=" + GH.branch).then(function(r){ if(!r.ok) throw 0; return r.json(); }).then(function(files){
      var jf = files.filter(function(f){ return f.type === "file" && /\.json$/i.test(f.name) && !/unavailable/i.test(f.name); });
      if(!jf.length) throw 0;
      return Promise.all(jf.map(function(f){ return fetch(RAW + dir + "/" + f.name).then(function(r){ return r.json(); }).catch(function(){ return null; }); }))
        .then(function(list){ return {dir:dir, comps:list.filter(Boolean)}; });
    }).catch(function(){ return tryDir(i + 1); });
  }
  return Promise.all([tryDir(0), side]).then(function(out){
    var data = out[0];
    DATA_LABEL = "ADMIN PREVIEW · real results from " + (data.dir === "elevien-data" ? "the 2026 season" : "the 2027 season") + " · read-only";
    data.comps.sort(function(a, b){ return String(a.date).localeCompare(String(b.date)); });
    data.comps.forEach(function(raw, ci){
      var cid = "c" + ci;
      COMPS.push({id:cid, name:raw.name || ("Competition " + (ci + 1)), date:raw.date || "", venue:raw.region || ""});
      (raw.sheets || []).forEach(function(sh){
        (sh.entries || []).forEach(function(e){
          var id = String(e.memberId || "").trim(); if(!id) return;
          if(reassign[id]) id = reassign[id];
          var s = parseFloat(e.score); if(isNaN(s)) return;
          var c = corrections[id] || {};
          var gender = c.gender || e.gender || "", level = String(c.level || e.level || "").toUpperCase();
          var g = GYM[id] || (GYM[id] = {name:names[id] || e.name || "", gender:gender, discipline:/boy/i.test(gender) ? "MAG" : "WAG", level:level, club:cleanClub(e.club), results:{}, videos:{}});
          if(!g.name && names[id]) g.name = names[id];
          (g.results[cid] || (g.results[cid] = {}))[sh.apparatus] = s;
        });
      });
    });
    NEWS = [];
    buildCompetitions();
  });
}

// Shape GYM like the league pages so ngl-player-card.js works unchanged
function buildCompetitions(){
  competitions = COMPS.map(function(c){
    var byApp = {};
    Object.keys(GYM).forEach(function(id){
      var g = GYM[id], r = g.results[c.id]; if(!r) return;
      Object.keys(r).forEach(function(app){ (byApp[app] || (byApp[app] = [])).push({memberId:id, gender:g.gender, level:g.level, club:g.club, score:r[app]}); });
    });
    return {name:c.name, date:c.date, displayDate:c.date, sheets:Object.keys(byApp).map(function(a){ return {apparatus:a, entries:byApp[a]}; })};
  });
}
function getName(id){ return GYM[id] && !GYM[id].peer ? displayName(id) : ""; }

/* ═════════════════ State ═════════════════ */
function freshState(){ return {email:"", bg:"", signedIn:false, gymnasts:[], current:null, readNews:{}, emails:true, photo:{}, query:""}; }
var S = freshState();

/* ═════════════════ Helpers ═════════════════ */
function esc(s){ return String(s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dateBits(d){ return {d:Number(String(d).slice(8, 10)) || "", m:MONTHS[Number(String(d).slice(5, 7)) - 1] || ""}; }
function longDate(d){ var b = dateBits(d); return b.d + " " + b.m + " " + String(d).slice(0, 4); }
function compsOf(g){ return COMPS.filter(function(c){ return g.results[c.id]; }); }
function apps(g){
  var seen = {}; compsOf(g).forEach(function(c){ Object.keys(g.results[c.id]).forEach(function(a){ seen[a] = 1; }); });
  var order = g.discipline === "MAG" ? MAG : WAG;
  return order.filter(function(a){ return seen[a]; }).concat(Object.keys(seen).filter(function(a){ return order.indexOf(a) < 0; }));
}
function best(g){ var out = {}; apps(g).forEach(function(a){ compsOf(g).forEach(function(c){ var v = g.results[c.id][a]; if(v != null && (out[a] == null || v > out[a])) out[a] = v; }); }); return out; }
function total(b){ return Object.keys(b).reduce(function(t, k){ return t + b[k]; }, 0); }
function compTotal(g, cid){ var r = g.results[cid] || {}; return Object.keys(r).reduce(function(t, k){ return t + r[k]; }, 0); }
function field(g){ return Object.keys(GYM).map(function(k){ return GYM[k]; }).filter(function(p){ return p.gender === g.gender && p.level === g.level; }); }
function leaguePos(id){ var me = GYM[id], f = field(me), mine = total(best(me)); return {pos:f.filter(function(p){ return total(best(p)) > mine; }).length + 1, of:f.length}; }
function compPlace(id, cid){ var me = GYM[id], f = field(me).filter(function(p){ return p.results[cid]; }), mine = compTotal(me, cid); return {pos:f.filter(function(p){ return compTotal(p, cid) > mine; }).length + 1, of:f.length}; }
function ord(n){ var s = ["th","st","nd","rd"], v = n % 100; return n + (s[(v - 20) % 10] || s[v] || s[0]); }
function displayName(id){ return GYM[id].name || (/^\d+$/.test(id) ? "BG " + id : String(id).replace(/^\d+\s+/, "")); }
function bgLabel(id){ return /^\d+$/.test(id) ? "BG " + id : "no BG number"; }
function firstName(id){ return GYM[id].name ? GYM[id].name.split(" ")[0] : displayName(id); }
function levelLabel(g){ return g.discipline + " Level " + g.level; }

var view = document.getElementById("view");
function go(h){ if(location.hash === h) render(); else location.hash = h; }
window.addEventListener("hashchange", render);
document.addEventListener("click", function(e){ var t = e.target.closest("[data-go]"); if(t){ e.preventDefault(); go(t.getAttribute("data-go")); } });
var OPEN = ["signin","waiting","check","admin","loading","error"];

function chrome(signed){
  document.getElementById("demoBar").innerHTML = esc(DATA_LABEL) + (ADMIN && S.signedIn ? ' · <a href="#/admin" id="backSearch" style="color:inherit">Back to search</a>' : "");
  document.getElementById("tabbar").hidden = !signed;
  document.getElementById("topActions").hidden = !signed || ADMIN;
  document.getElementById("newsDot").style.display = NEWS.some(function(n){ return !S.readNews[n.id]; }) ? "" : "none";
  var route = location.hash.replace("#/", "") || "home";
  document.querySelectorAll(".tab").forEach(function(b){ b.classList.toggle("active", b.getAttribute("data-go") === "#/" + route); });
}
function render(){
  var route = (location.hash.replace("#/", "") || "").split("?")[0];
  if(READY !== true) route = READY === "error" ? "error" : "loading";
  else if(ADMIN && route === "admin"){ S.signedIn = false; }
  else if(!S.signedIn && OPEN.indexOf(route) < 0) route = ADMIN ? "admin" : "signin";
  else if(S.signedIn && OPEN.indexOf(route) >= 0) route = "home";
  if(!SCREENS[route]) route = S.signedIn ? "home" : (ADMIN ? "admin" : "signin");
  chrome(S.signedIn);
  view.innerHTML = '<div class="screen">' + SCREENS[route]() + '</div>';
  if(AFTER[route]) AFTER[route]();
  window.scrollTo(0, 0);
}

var COLOURS = ["#3aa0e6","#f2a900","#2ec4b6","#ff6b8b","#a78bfa","#9be564"];
function graph(g){
  var a = apps(g), cs = compsOf(g), W = 520, H = 240, L = 44, R = 44, T = 14, B = 40;
  var all = []; cs.forEach(function(c){ a.forEach(function(app){ var v = g.results[c.id][app]; if(v != null) all.push(v); }); });
  if(!all.length) return '<p class="muted">No scores yet.</p>';
  var lo = Math.floor(Math.min.apply(null, all) - 0.5), hi = Math.ceil(Math.max.apply(null, all) + 0.5);
  var X = function(i){ return cs.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (cs.length - 1); }, Y = function(v){ return T + (hi - v) / (hi - lo) * (H - T - B); };
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Scores across the season">';
  for(var v = lo; v <= hi; v++){ s += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + Y(v) + '" y2="' + Y(v) + '" stroke="rgba(255,255,255,.1)"/><text x="' + (L - 8) + '" y="' + (Y(v) + 5) + '" fill="#b7c1e6" font-size="15" text-anchor="end">' + v + '</text>'; }
  cs.forEach(function(c, i){ var d = dateBits(c.date); s += '<text x="' + X(i) + '" y="' + (H - 10) + '" fill="#b7c1e6" font-size="15" text-anchor="middle">' + (ADMIN ? (d.d + " " + d.m) : ("Round " + (i + 1))) + '</text>'; });
  a.forEach(function(app, ai){
    var pts = []; cs.forEach(function(c, i){ var v = g.results[c.id][app]; if(v != null) pts.push([X(i), Y(v)]); });
    if(pts.length > 1) s += '<polyline points="' + pts.map(function(p){ return p.join(","); }).join(" ") + '" fill="none" stroke="' + COLOURS[ai % 6] + '" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>';
    pts.forEach(function(p){ s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="4" fill="' + COLOURS[ai % 6] + '"/>'; });
  });
  return s + '</svg><div class="legend">' + a.map(function(app, ai){ return '<span><i style="background:' + COLOURS[ai % 6] + '"></i>' + esc(app) + '</span>'; }).join("") + '</div>';
}

/* ── Training League (boys) ──
   For boys the NGL Profile Card comes from the Training League challenges, not from competition scores.
   Demo: made-up results. Admin preview: real Training League results, matched by the private BG number
   (only readable when signed in to NGL Admin with Training League or Results access). */
var PL = {ready:false, byGym:{}, list:[], note:""};
var PLK = window.NGLPowerLeague;
function isBoy(id){ return GYM[id] && GYM[id].discipline === "MAG"; }
function plFor(id){ return PL.byGym[id] || null; }
function demoPL(){
  function seeded(n){ var x = Math.sin(n * 9.17) * 10000; return x - Math.floor(x); }
  var base = {sprint:2.3, jump:175, tuck:22, push:20, pull:10, dips:9, balance:30, pike:4, hand:9};
  var list = [];
  for(var i = 0; i < 12; i++){
    var r = {};
    Object.keys(base).forEach(function(k, j){
      var f = i ? 0.7 + seeded(i * 13 + j) * 0.6 : 1.12 + seeded(j) * 0.12, v = k === "sprint" ? base[k] / f : k === "pike" ? Math.round(base[k] * f * 2 - 4) : Math.round(base[k] * f);
      r[k] = {best: k === "sprint" ? Math.round(v * 100) / 100 : v, date: "2027-0" + (2 + i % 4) + "-1" + (i % 9)};
    });
    list.push({id:"d" + i, first: i ? "Boy" : "Oliver", init: i ? String.fromCharCode(65 + i) : "H", club: i ? "Club " + (i % 6 + 1) : "Demo Gymnastics Club", level:"2", age:"9-11", hrs:"2-5", results:r});
  }
  PLK.rate(list); PL.list = list; PL.byGym["1000001"] = list[0];
}
function loadPLAdmin(){
  var V = "https://www.gstatic.com/firebasejs/10.12.0/";
  return Promise.all([import(V + "firebase-app.js"), import(V + "firebase-firestore.js"), import(V + "firebase-auth.js")]).then(function(m){
    var appM = m[0], fs = m[1], au = m[2];
    var app = appM.initializeApp({apiKey:"AIzaSyDV7BuYhSjji9DQDjih5a6Ms7G-SVZpKw4", authDomain:"saadi-rotation.firebaseapp.com", projectId:"saadi-rotation",
      storageBucket:"saadi-rotation.firebasestorage.app", messagingSenderId:"1066734803675", appId:"1:1066734803675:web:0188fd601adea7db08cafe"}, "power-league");
    var db = fs.getFirestore(app), auth = au.getAuth(app);
    return new Promise(function(res){ var off = au.onAuthStateChanged(auth, function(u){ off(); res(u); }); }).then(function(u){
      if(!u){ PL.note = "Sign in to NGL Admin to see Training League cards here."; return; }
      return Promise.all([fs.getDocs(fs.collection(db, "ngl_power_league")), fs.getDocs(fs.collection(db, "ngl_power_league_private"))]).then(function(snaps){
        PL.list = snaps[0].docs.map(function(d){ var o = d.data(); o.id = d.id; return o; }); PLK.rate(PL.list);
        var byId = {}; PL.list.forEach(function(e){ byId[e.id] = e; });
        snaps[1].docs.forEach(function(d){ var bg = String(d.data().bg || ""); if(bg && byId[d.id]) PL.byGym[bg] = byId[d.id]; });
      });
    });
  }).catch(function(e){ console.warn("Training League not loaded", e); PL.note = "Training League results couldn't be loaded here."; });
}
function plTable(e, id){
  return '<table class="best">' + PLK.CH.map(function(c){ var r = e.results && e.results[c.k];
    return '<tr><td>' + esc(PLK.chName(c, e.level)) + '</td><td>' + (r && r.best != null ? PLK.fmt(r.best, c) + ' <span class="muted" style="font-size:13px">' + PLK.chUnit(c, e.level) + '</span>' : '<span class="muted">–</span>') + '</td><td style="width:56px;text-align:right">' + (e.ch[c.k] || '<span class="muted">–</span>') + '</td></tr>'; }).join("") + '</table>';
}
function plStats(id){
  var e = plFor(id);
  return '<div class="card"><div class="eyebrow">Training League</div>'
    + (e ? '<div class="stat-grid" style="margin-bottom:12px"><div class="stat"><div class="k">OVR</div><div class="v">' + e.ovr + '</div></div><div class="stat"><div class="k">League position</div><div class="v" style="font-size:16px">' + plPosLine(e) + '</div></div></div>'
         + '<div class="stat-grid" style="grid-template-columns:repeat(3,1fr);margin-bottom:12px">' + PLK.STATS.map(function(k){ return '<div class="stat"><div class="k">' + k + '</div><div class="v">' + e.stats[k] + '</div></div>'; }).join("") + '</div>' + plTable(e, id)
         : '<p class="muted" style="font-size:14px;margin:0">No Training League results yet.' + (PL.note ? ' ' + esc(PL.note) : '') + '</p>')
    + '</div>';
}
function plPosLine(e){ var lp = PLK.leaguePos(PL.list, e); return lp.pos ? ord(lp.pos) + ' of ' + lp.of + ' · Level ' + esc(e.level) + ' · ' + esc(e.age) + ' · ' + esc(e.hrs) + ' hrs' : 'Not ranked yet'; }
var PL_URL = "ngl-training-league.html";
function plCard(id){
  var e = plFor(id), g = GYM[id];
  if(e){ var c = PLK.cardFor(e); c.name = displayName(id); c.club = g.club || c.club; c.season = "TRAINING LEAGUE"; return c; }
  var blank = {}; PLK.STATS.forEach(function(k){ blank[k] = null; });
  return {name:displayName(id), club:g.club, level:g.level, discipline:"MAG", overall:"–", attrs:blank, tier:"bronze", season:"TRAINING LEAGUE"};
}

/* ═════════════════ Start ═════════════════ */
function start(){
  render();
  (ADMIN ? loadAdmin() : loadDemo()).then(function(){ READY = true; if(ADMIN && !location.hash) location.hash = "#/admin"; render();
      (ADMIN ? loadPLAdmin() : Promise.resolve(demoPL())).then(function(){ PL.ready = true; if(/^#\/(card|stats|home)/.test(location.hash)) render(); }); })
    .catch(function(e){ READY = "error"; LOAD_ERROR = (e && e.message) || "Please try again."; render(); });
}
</script>
<script src="ngl-player-card.js"></script>
<script>start();</script>
