<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NGL Award Programmes</title>
<style>
  :root{
    --navy:#0a1440;
    --navy-2:#0d1a4f;
    --navy-3:#152463;
    --navy-4:#1d2f7a;
    --line:rgba(255,255,255,0.14);
    --white:#ffffff;
    --muted:#b7c1e6;
    --red:#d0021b;
    --gold:#f2a900;

    --c-preschool:#ef2891;
    --c-schools:#f5d12f;
    --c-recreational:#ea732c;
    --c-general:#0f6bac;
    --c-performance:#38bcb9;
    --c-university:#59ac29;
    --c-masters:#851a6c;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--navy);
    color:var(--white);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }

  .wrap{max-width:980px;margin:0 auto;padding:20px 16px 64px;}

  .page-title{
    font-size:15px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
    margin:6px 0 18px;
    font-weight:600;
  }

  /* ---------- Pathway tabs ---------- */
  .pathway-tabs{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:4px 2px 14px;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .pathway-tabs::-webkit-scrollbar{display:none;}

  .ptab{
    flex:0 0 auto;
    padding:11px 16px;
    border-radius:999px;
    background:var(--navy-3);
    border:1px solid var(--line);
    color:var(--white);
    font-size:14px;
    font-weight:600;
    white-space:nowrap;
    cursor:pointer;
    transition:background .18s ease, transform .12s ease, border-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .ptab:active{transform:scale(0.97);}
  .ptab.active{
    background:var(--tab-color, var(--gold));
    border-color:var(--tab-color, var(--gold));
    color:var(--tab-text, #0a1440);
  }

  /* ---------- Pathway panels ---------- */
  .pathway-panel{display:none;}
  .pathway-panel.active{display:block; animation:fadein .22s ease;}
  @keyframes fadein{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .simple-panel{
    background:var(--navy-3);
    border:1px solid var(--line);
    border-radius:16px;
    padding:26px 22px;
    text-align:center;
  }
  .simple-badge{
    display:inline-block;
    padding:6px 14px;
    border-radius:999px;
    font-weight:700;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
    margin-bottom:14px;
    color:var(--pathway-text, #0a1440);
    background:var(--pathway-color, var(--gold));
  }
  .simple-panel p{
    color:var(--white);
    font-size:16px;
    line-height:1.55;
    max-width:520px;
    margin:0 auto 14px;
  }
  .coming-soon{
    color:var(--muted);
    font-size:13px;
    font-style:italic;
  }
  .simple-panel.with-book{text-align:left;}
  .simple-panel.with-book .simple-badge{display:inline-block; margin:0 0 18px;}
  .simple-panel.with-book p{margin:0 0 14px; max-width:none;}
  .coming-tag{
    display:inline-block;
    margin-top:4px;
    padding:8px 16px;
    border-radius:999px;
    background:rgba(255,255,255,0.08);
    border:1px solid var(--pathway-color, var(--line));
    color:var(--pathway-color, var(--muted));
    font-size:13px;
    font-weight:700;
  }

  /* ---------- Schools: section tabs ---------- */
  .section-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:18px;
  }
  .stab{
    flex:1 1 auto;
    min-width:140px;
    text-align:center;
    padding:14px 10px;
    border-radius:12px;
    background:var(--navy-3);
    border:1px solid var(--line);
    color:var(--white);
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition:background .18s ease, transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .stab:active{transform:scale(0.98);}
  .stab.active{
    background:var(--pathway-color, var(--gold));
    color:var(--pathway-text, #0a1440);
    border-color:var(--pathway-color, var(--gold));
  }

  .section-panel{display:none;}
  .section-panel.active{display:block; animation:fadein .22s ease;}

  .card{
    background:var(--navy-3);
    border:1px solid var(--line);
    border-radius:16px;
    padding:22px;
    margin-bottom:16px;
  }

  .book-layout{
    display:flex;
    gap:24px;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .book-layout img{
    width:180px;
    max-width:40%;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.35);
    flex:0 0 auto;
  }
  .book-copy{flex:1 1 260px; min-width:240px;}
  .book-copy p{margin:0 0 14px; line-height:1.55; color:var(--white); font-size:15px;}
  .book-copy ul{margin:0 0 18px; padding-left:20px;}
  .book-copy li{margin-bottom:10px; line-height:1.5; color:var(--white); font-size:14.5px;}

  .buy-btn{
    display:inline-block;
    background:var(--pathway-color, var(--red));
    color:var(--pathway-text, var(--white));
    font-weight:700;
    font-size:14px;
    padding:12px 26px;
    border-radius:999px;
    text-decoration:none;
    transition:filter .15s ease, transform .12s ease;
  }
  .buy-btn:hover{filter:brightness(1.1);}
  .buy-btn:active{transform:scale(0.97);}

  .schools-cta{display:grid;grid-template-columns:1fr;gap:14px;}
  @media(min-width:680px){.schools-cta{grid-template-columns:1fr 1fr;}}
  .schools-cta .card{margin:0;display:flex;flex-direction:column;align-items:flex-start;}
  .schools-cta p{line-height:1.55;font-size:15px;margin:0 0 16px;flex:1;}
  .cta-tag{display:inline-block;padding:5px 12px;border-radius:999px;background:var(--c-schools);color:#0a1440;font-weight:800;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px;}
  .lede{font-size:15px; line-height:1.55; color:var(--white); margin:0 0 20px;}

  .gallery-label{
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    margin:0 0 12px;
    font-weight:700;
  }

  .cert-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px;
    margin-bottom:26px;
  }
  .cert-grid figure, .medal-grid figure{margin:0; text-align:center;}
  .cert-grid img{width:100%; border-radius:8px; box-shadow:0 8px 20px rgba(0,0,0,0.3);}
  .cert-grid figcaption{margin-top:8px; font-size:12.5px; color:var(--muted); font-weight:600;}

  .medal-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
  }
  .medal-grid img{width:100%; max-width:120px; border-radius:50%;}
  .medal-grid figcaption{margin-top:8px; font-size:12.5px; color:var(--muted); font-weight:600;}

  @media (max-width:480px){
    .cert-grid{grid-template-columns:repeat(3,1fr); gap:8px;}
    .medal-grid{grid-template-columns:repeat(3,1fr); gap:10px;}
    .book-layout img{width:140px;}
  }

  /* ---------- Videos nested ---------- */
  .video-panel{display:none;}
  .video-panel.active{display:block;}

  .video-tabs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .vtab{
    flex:1 1 auto;
    min-width:150px;
    text-align:center;
    padding:11px 10px;
    border-radius:10px;
    background:var(--navy-4);
    border:1px solid var(--line);
    color:var(--white);
    font-size:13px;
    font-weight:700;
    cursor:pointer;
    transition:background .18s ease, transform .12s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .vtab:active{transform:scale(0.98);}
  .vtab.active{
    background:var(--pathway-color, var(--gold));
    color:var(--pathway-text, #0a1440);
    border-color:var(--pathway-color, var(--gold));
  }

  .level-block{margin-bottom:8px;}
  .level-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:13px 14px;
    border-radius:10px;
    background:var(--navy-4);
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:background .15s ease;
  }
  .level-row:active{background:#243a94;}
  .level-row .ph{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--muted);
    font-weight:500;
    font-size:12.5px;
  }
  .play-dot{
    width:26px;height:26px;border-radius:50%;
    background:rgba(255,255,255,0.12);
    display:flex;align-items:center;justify-content:center;
    font-size:11px;
  }
  .level-arrow{
    display:inline-block;
    transition:transform .2s ease;
    font-size:12px;
    color:var(--muted);
  }
  .level-block.open .level-arrow{transform:rotate(90deg);}
  .level-videos{
    display:none;
    padding:8px 6px 2px;
  }
  .level-block.open .level-videos{display:block;}
  .video-link-row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding:10px 12px;
    margin-bottom:6px;
    border-radius:8px;
    background:rgba(255,255,255,0.07);
    color:var(--white);
    text-decoration:none;
    font-size:13.5px;
    font-weight:600;
    transition:background .15s ease;
  }
  .video-link-row:hover{background:rgba(255,255,255,0.14);}
  .video-link-row .num{color:var(--muted); font-weight:500; margin-top:2px;}
  .vrow-text{display:flex; flex-direction:column; gap:2px;}
  .vrow-label{font-weight:700;}
  .vrow-caption{font-weight:400; font-size:12px; color:var(--muted); line-height:1.35;}
  .vrow-status{display:block; font-size:11.5px; font-style:italic; color:var(--muted); margin-top:3px;}
  .video-link-row.video-pending{cursor:default;}
  .video-link-row.video-pending:hover{background:rgba(255,255,255,0.07);}
  .video-empty{
    padding:10px 12px;
    color:var(--muted);
    font-size:13px;
    font-style:italic;
  }
  .lvl-dot{
    display:inline-block;
    width:10px; height:10px;
    border-radius:50%;
    margin-right:8px;
    vertical-align:middle;
  }
  .lvl-tag{
    font-size:11px;
    font-weight:600;
    color:var(--muted);
    margin-left:6px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }

  h2.section-title{
    font-size:20px;
    margin:0 0 14px;
    color:var(--white);
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="page-title">NGL Award Programmes</div>

  <div class="pathway-tabs" id="pathwayTabs"></div>

  <div id="panels"></div>
</div>

<script>
const DARK_TEXT = '#0a1440';
const LIGHT_TEXT = '#ffffff';
// TODO: confirm the real booking/registration URL with Dave — placeholder for now.
const BOOK_NOW_URL = 'https://www.nationalgymnasticsleague.co.uk/';
// NGL Schools: full programme detail lives in these two Hubs.
const SCHOOLS_CLUB_HUB_URL = 'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/ngl-schools-club.html';
const SCHOOLS_PARENT_HUB_URL = 'https://davidcbrooke.github.io/GYMNASTICS-RESULTS/ngl-schools-hub.html';
// Recreational 'Book Now' opens the Competitions & Events page on the Recreational tab.
const REC_COMPETITIONS_URL = 'https://www.nationalgymnasticsleague.co.uk/competitions-graduation-events?pathway=recreational';

const REC_LEVELS = [
  {id:'ruby',   name:'Ruby',   tag:'Beginner',       color:'#c90511'},
  {id:'pink',   name:'Pink',   tag:'Beginner Plus',  color:'#f65eb7'},
  {id:'teal',   name:'Teal',   tag:'Intermediate',   color:'#02a1c7'},
  {id:'indigo', name:'Indigo', tag:'Advanced Club',  color:'#603dac'}
];
const REC_PIECES = ['floor','vault','beam','bars'];
const REC_PIECE_LABELS = { floor:'Floor', vault:'Vault', beam:'Beam', bars:'Bars' };
const REC_SKILLS = {
  ruby: {
    floor: ["Forward Roll","Star Jump","Bunny Hops","Half Turn Jump","Arabesque"],
    vault: ["Squat on","Walk across block","Stretch jump off"],
    beam: ["Mount","Walk Forwards","Straight Jump","Arabesque","Stretch Jump Dismount"],
    bars: ["Front Support","Cast","Walk Around Bar","Underswing Dismount"]
  },
  pink: {
    floor: ["Forward Roll","Stretch Jump","Cartwheel","Half Turn Jump","Lever Balance","Straight Jump"],
    vault: ["Straddle on","Walk across block","Stretch jump off"],
    beam: ["Mount","Forward Walk","Sideways Walk","Lever","Half Turn","Stretch Jump Dismount"],
    bars: ["Front Support","Cast","Pullover Attempt","Underswing Dismount"]
  },
  teal: {
    floor: ["Handstand Forward Roll","Tuck Jump","Full Turn","Cartwheel","Backward Roll","Cat Leap","Round Off"],
    vault: ["Jump to Handstand Flatback"],
    beam: ["Mount","Cat Leap","Full Turn","Tuck Jump","Cartwheel","Split Jump Dismount"],
    bars: ["Pullover","Cast","Back Hip Circle","Tap Swings","Straddle Underswing"]
  },
  indigo: {
    floor: ["Handstand Forward Roll","Split Jump","Full Turn","Round Off","Backward Walkover","Balance Hold","Jump Sequence"],
    vault: ["Handstand Flatback OR Half-on to Feet"],
    beam: ["Mount","Split Leap","Full Turn","Cartwheel","Balance Hold","Round Off Dismount"],
    bars: ["Pullover","Cast Above Horizontal","Back Hip Circle","Squat On","Straight Jump Dismount"]
  }
};
// Fill in as Dave sends links: position n -> level = REC_LEVELS[(n-1)%4], piece = REC_PIECES[Math.floor((n-1)/4)]
const REC_VIDEO_IDS = {
  ruby:   { floor:'QUmO-2VM4jQ', vault:'TKV4rRq4JoQ', beam:'6Xf6tzbyuI0', bars:'UqIItuGwqmg' },
  pink:   { floor:'cXcmczamdLs', vault:'8IE9zY81g_g', beam:'YyuTaVTMHto', bars:'Mm_Dnm3WXzw' },
  teal:   { floor:'AYcnuE1zZc8', vault:'4Lgkq3aaues', beam:'PwY_MOdLzKs', bars:'9n-AtEJIr_U' },
  indigo: { floor:'Uu8si-DM_CI', vault:'w58EYcW2Loo', beam:'0GzVp2KSjbI', bars:'pv8VOObrh0Q' }
};

function recVideoLevelsHTML(){
  let rows = '';
  REC_LEVELS.forEach(level => {
    const inner = REC_PIECES.map(piece => {
      const vid = REC_VIDEO_IDS[level.id][piece];
      const label = REC_PIECE_LABELS[piece];
      const caption = REC_SKILLS[level.id][piece].join(', ');
      if(vid){
        return `
          <a class="video-link-row" href="https://youtu.be/${vid}" target="_blank" rel="noopener">
            <span class="num">&#9654;</span>
            <span class="vrow-text">
              <span class="vrow-label">${label}</span>
              <span class="vrow-caption">${caption}</span>
            </span>
          </a>
        `;
      }
      return `
        <div class="video-link-row video-pending">
          <span class="num">&#9654;</span>
          <span class="vrow-text">
            <span class="vrow-label">${label}</span>
            <span class="vrow-caption">${caption}</span>
            <span class="vrow-status">Video coming soon</span>
          </span>
        </div>
      `;
    }).join('');
    rows += `
      <div class="level-block">
        <div class="level-row">
          <span><span class="lvl-dot" style="background:${level.color}"></span>${level.name} <span class="lvl-tag">${level.tag}</span></span>
          <span class="ph"><span class="level-arrow">&#9654;</span></span>
        </div>
        <div class="level-videos">${inner}</div>
      </div>
    `;
  });
  return rows;
}

/* ---------- Shared pathway shell: Awards Programme / Competitions / Videos ---------- */
function pathwaySectionsHTML({awardsHTML, eventLabel, eventHTML, routinesHTML, videosHTML}){
  return `
    <div class="section-tabs">
      <div class="stab active" data-sec="awards">Awards Programme</div>
      <div class="stab" data-sec="event">${eventLabel}</div>
      <div class="stab" data-sec="videos">Videos</div>
    </div>

    <div class="section-panel active" data-sec="awards">${awardsHTML}</div>
    <div class="section-panel" data-sec="event">${eventHTML}</div>
    <div class="section-panel" data-sec="videos">${videosHTML || videoTabsHTML(routinesHTML)}</div>
  `;
}

function videoTabsHTML(routinesHTML){
  return `
    <div class="card">
      <div class="video-tabs">
        <div class="vtab active" data-vid="routines">Routines</div>
        <div class="vtab" data-vid="core">Core Skills Master Classes</div>
        <div class="vtab" data-vid="strength">Strength &amp; Conditioning</div>
      </div>
      <div class="video-panel active" data-vid="routines">${routinesHTML}</div>
      <div class="video-panel" data-vid="core"><p class="coming-soon">Core Skills Master Classes coming soon.</p></div>
      <div class="video-panel" data-vid="strength"><p class="coming-soon">Strength &amp; Conditioning videos coming soon.</p></div>
    </div>
  `;
}

/* ---------- Pre-School content ---------- */
function preschoolAwardsHTML(p){
  const cover = COVER_PLACEHOLDER.preschool;
  const coming = COMING_TEXT.preschool;
  return `
    <div class="card">
      <p class="lede">${p.desc}</p>
    </div>
    <div class="card">
      <div class="book-layout">
        <img src="data:image/jpeg;base64,${cover}" alt="Pre-School Awards Book cover">
        <div class="book-copy">
          <p>${p.desc}</p>
          <ul>
            <li><strong>Around the World with Somi &amp; Flic</strong> &mdash; every young gymnast follows the NGL mascots on a round-the-world adventure as they build their first movement skills.</li>
            <li>Each gymnast gets their own <strong>NGL Passport</strong>, stamped along the way &mdash; with <strong>20 countries</strong> to visit across the programme.</li>
            <li><strong>20 exclusive medals</strong> to collect, one for every country, plus a big Journey Tracker poster to chart progress as they go.</li>
          </ul>
          <div class="coming-tag">${coming}</div>
        </div>
      </div>
    </div>
  `;
}

function preschoolEventHTML(){
  return `
    <div class="card">
      <p class="lede">Graduation Event details for Pre-School are coming soon.</p>
      <a class="buy-btn" href="${BOOK_NOW_URL}" target="_blank" rel="noopener">Book Now</a>
    </div>
  `;
}

/* ---------- Generic shell for pathways with no detailed content yet ---------- */
function simpleAwardsHTML(p){
  const cover = COVER_PLACEHOLDER[p.id];
  const coming = COMING_TEXT[p.id] || 'Awards Book coming soon';
  return `
    <div class="card">
      <p class="lede">${p.desc}</p>
    </div>
    <div class="card">
      <div class="book-layout">
        <img src="data:image/jpeg;base64,${cover}" alt="${p.name} Awards Book cover">
        <div class="book-copy">
          <p>${p.desc}</p>
          <div class="coming-tag">${coming}</div>
        </div>
      </div>
    </div>
  `;
}

function simpleEventHTML(label){
  return `
    <div class="card">
      <p class="lede">${label} details are coming soon.</p>
      <a class="buy-btn" href="${BOOK_NOW_URL}" target="_blank" rel="noopener">Book Now</a>
    </div>
  `;
}

function simpleRoutinesHTML(){
  return `<p class="coming-soon">Routine videos coming soon.</p>`;
}

const tabsEl = document.getElementById('pathwayTabs');
const panelsEl = document.getElementById('panels');

PATHWAYS.forEach((p,i)=>{
  const btn = document.createElement('button');
  btn.className = 'ptab' + (i===0 ? ' active' : '');
  btn.style.setProperty('--tab-color', p.color);
  btn.style.setProperty('--tab-text', p.text);
  btn.textContent = p.name;
  btn.dataset.target = p.id;
  btn.addEventListener('click', ()=>selectPathway(p.id));
  tabsEl.appendChild(btn);

  const panel = document.createElement('div');
  panel.className = 'pathway-panel' + (i===0 ? ' active' : '');
  panel.id = 'panel-' + p.id;
  panel.style.setProperty('--pathway-color', p.color);
  panel.style.setProperty('--pathway-text', p.text);

  let awardsHTML, eventHTML, routinesHTML;
  if(p.id === 'schools'){
    // handled below with schoolsPanelHTML
  } else if(p.id === 'recreational'){
    awardsHTML = recreationalAwardsHTML(p);
    eventHTML = recreationalEventHTML();
    routinesHTML = recreationalRoutinesHTML();
  } else if(p.id === 'preschool'){
    awardsHTML = preschoolAwardsHTML(p);
    eventHTML = preschoolEventHTML();
    routinesHTML = simpleRoutinesHTML();
  } else {
    awardsHTML = simpleAwardsHTML(p);
    eventHTML = simpleEventHTML(p.eventLabel);
    routinesHTML = simpleRoutinesHTML();
  }
  const videosHTML = (p.id === 'recreational') ? `<div class="card"><p class="coming-soon">Recreational Programme videos coming soon.</p></div>` : null;
  panel.innerHTML = (p.id === 'schools') ? schoolsPanelHTML(p) : pathwaySectionsHTML({ awardsHTML, eventLabel: p.eventLabel, eventHTML, routinesHTML, videosHTML });
  panelsEl.appendChild(panel);
});

function selectPathway(id){
  document.querySelectorAll('.ptab').forEach(b=>b.classList.toggle('active', b.dataset.target===id));
  document.querySelectorAll('.pathway-panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+id));
}

document.addEventListener('click', (e)=>{
  const stab = e.target.closest('.stab');
  if(stab){
    const sec = stab.dataset.sec;
    const scope = stab.closest('.pathway-panel');
    scope.querySelectorAll('.stab').forEach(b=>b.classList.toggle('active', b===stab));
    scope.querySelectorAll('.section-panel').forEach(p=>p.classList.toggle('active', p.dataset.sec===sec));
  }
  const vtab = e.target.closest('.vtab');
  if(vtab){
    const vid = vtab.dataset.vid;
    const scope = vtab.closest('.card');
    scope.querySelectorAll('.vtab').forEach(b=>b.classList.toggle('active', b===vtab));
    scope.querySelectorAll('.video-panel').forEach(p=>p.classList.toggle('active', p.dataset.vid===vid));
  }
  const levelRow = e.target.closest('.level-row');
  if(levelRow){
    const block = levelRow.closest('.level-block');
    if(block){ block.classList.toggle('open'); }
  }
});
</script>
